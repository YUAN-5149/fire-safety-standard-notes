<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>消防設備設置標準 互動題庫</title>
<style>
:root{
  --bg:#fbfaf7;--fg:#1c1b19;--muted:#6b6862;--line:#d9d5cc;--card:#fff;
  --accent:#b03a2e;--ok:#2e7d4f;--no:#c0392b;--warn:#a86b00;
  --f1:#f4e7e4;--f2:#e3eff7;--f3:#e5f1ea;--f4:#faf1dc;--sel:#dce9f5;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#16161a;--fg:#e8e6e1;--muted:#9b968c;--line:#3a3a40;--card:#1e1e23;
  --accent:#e8705f;--ok:#5fbb87;--no:#e8705f;--warn:#d9a441;
  --f1:#3a2622;--f2:#1e3341;--f3:#1f3a2c;--f4:#3a3120;--sel:#254157;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);line-height:1.7;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 64px}
header{border-bottom:2px solid var(--fg);padding-bottom:14px;margin-bottom:22px}
h1{font-size:clamp(1.25rem,4vw,1.7rem);margin:0 0 4px}
.sub{color:var(--muted);font-size:.86rem;margin:0}
h2{font-size:1.05rem;margin:26px 0 10px}
.hide{display:none!important}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);
  background:var(--card);color:var(--fg);padding:9px 16px;transition:.12s}
button:hover{border-color:var(--fg)}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.primary:hover{filter:brightness(1.1);border-color:var(--accent)}
/* setup */
.cats{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:560px){.cats{grid-template-columns:1fr 1fr}}
.cat{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1px solid var(--line);
  border-radius:10px;background:var(--card);cursor:pointer}
.cat:has(input:checked){border-color:var(--accent);background:var(--f1)}
.cat input{margin-top:5px;flex:none;accent-color:var(--accent)}
.cat .t{font-weight:600;font-size:.94rem}
.cat .d{color:var(--muted);font-size:.8rem;line-height:1.5}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0}
select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);color:var(--fg)}
label.inl{font-size:.9rem;color:var(--muted)}
/* quiz */
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:6px}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-bottom:16px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 18px 6px}
.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:99px;
  background:var(--f2);color:var(--muted);margin-bottom:10px}
.tag.multi{background:var(--f4);color:var(--warn);font-weight:600}
.tag.num{background:var(--f3);color:var(--ok);font-weight:600}
.qtext{font-size:1.02rem;font-weight:600;margin:0 0 14px;line-height:1.65}
.qtext .given{display:block;font-weight:400;font-size:.92rem;color:var(--muted);
  margin-top:8px;padding-left:12px;border-left:3px solid var(--line)}
.opts{display:grid;gap:8px;margin-bottom:14px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 13px;border:1px solid var(--line);
  border-radius:9px;cursor:pointer;font-size:.94rem;background:var(--bg)}
.opt:hover{border-color:var(--muted)}
.opt input{margin-top:4px;flex:none;accent-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--sel)}
.opt.right{border-color:var(--ok);background:var(--f3)}
.opt.wrong{border-color:var(--no);background:var(--f1)}
.opt .mk{margin-left:auto;font-weight:700;flex:none}
.opt.right .mk{color:var(--ok)}
.opt.wrong .mk{color:var(--no)}
.numin{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.numin input{font:inherit;width:150px;padding:9px 12px;border-radius:8px;
  border:1px solid var(--line);background:var(--bg);color:var(--fg);text-align:right}
.numin .u{color:var(--muted);font-size:.92rem}
.fb{border-radius:9px;padding:12px 14px;margin-bottom:14px;font-size:.9rem;line-height:1.7}
.fb.ok{background:var(--f3);border-left:4px solid var(--ok)}
.fb.no{background:var(--f1);border-left:4px solid var(--no)}
.fb .hd{font-weight:700;margin-bottom:4px}
.fb.ok .hd{color:var(--ok)}
.fb.no .hd{color:var(--no)}
.fb .ref{display:inline-block;margin-top:6px;font-size:.8rem;color:var(--muted);
  background:var(--card);padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
a{color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:.86rem;
  padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);
  color:var(--fg);transition:.12s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.go{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.btn.go:hover{filter:brightness(1.1);color:#fff}
.navbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.dgl{display:inline-flex;align-items:center;gap:6px;margin-top:8px;margin-left:8px;
  font-size:.8rem;text-decoration:none;padding:3px 10px;border-radius:99px;
  border:1px solid var(--accent);color:var(--accent);background:var(--card);font-weight:600}
.dgl:hover{background:var(--accent);color:#fff}
.rev{border:1px solid var(--accent);border-radius:10px;padding:14px 16px;margin:20px 0;
  background:var(--f1)}
.rev .h{font-weight:700;margin-bottom:4px}
.rev .s{font-size:.86rem;color:var(--muted);margin-bottom:10px}
.rev .lks{display:flex;flex-wrap:wrap;gap:8px}
.acts{display:flex;gap:10px;padding:0 0 16px;flex-wrap:wrap}
.kb{color:var(--muted);font-size:.76rem;margin-left:auto;align-self:center}
/* result */
.score{text-align:center;padding:26px 0 10px}
.score .big{font-size:3rem;font-weight:700;line-height:1;color:var(--accent)}
.score .lbl{color:var(--muted);font-size:.9rem}
.bd{display:grid;gap:8px;margin:20px 0}
.bd .r{display:flex;justify-content:space-between;padding:9px 13px;border:1px solid var(--line);
  border-radius:8px;background:var(--card);font-size:.9rem}
.wl{margin:22px 0}
.wq{border:1px solid var(--line);border-left:4px solid var(--no);border-radius:0 9px 9px 0;
  padding:12px 15px;margin-bottom:10px;background:var(--card);font-size:.88rem}
.wq .q{font-weight:600;margin-bottom:6px}
.wq .a{color:var(--ok)}
.wq .m{color:var(--muted);font-size:.84rem;margin-top:5px}
footer{margin-top:44px;padding-top:14px;border-top:1px solid var(--line);
  color:var(--muted);font-size:.78rem}
code{background:var(--f2);padding:1px 5px;border-radius:4px;font-size:.88em}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>消防設備設置標準 互動題庫</h1>
  <p class="sub">各類場所消防安全設備設置標準（pcode D0120029）民國 113 年 4 月 24 日修正版</p>
  <div class="navbar">
    <a class="btn" href="index.html">🏠 學習首頁</a>
    <a class="btn" href="04a-%E6%B3%A1%E6%B2%AB%E8%A8%AD%E5%82%99-%E5%9C%96%E8%A7%A3.html" target="_blank" rel="noopener">📐 泡沫設備圖解</a>
    <a class="btn" href="06-%E4%BA%8C%E6%B0%A7%E5%8C%96%E7%A2%B3%E8%A8%AD%E5%82%99-%E5%9C%96%E8%A7%A3.html" target="_blank" rel="noopener">📐 二氧化碳設備圖解</a>
  </div>
  <p class="sub" style="margin-top:8px">答錯時解析會直接帶你到對應的那張圖</p>
</header>

<!-- ===== SETUP ===== -->
<section id="setup">
  <h2>選擇練習範圍</h2>
  <div class="cats" id="cats"></div>

  <div class="row">
    <label class="inl" for="cnt">題數</label>
    <select id="cnt">
      <option value="10">10 題</option>
      <option value="20" selected>20 題</option>
      <option value="30">30 題</option>
      <option value="0">全部</option>
    </select>
    <label class="inl" for="ord">順序</label>
    <select id="ord">
      <option value="1" selected>隨機</option>
      <option value="0">依條號</option>
    </select>
    <button class="primary" id="start">開始練習</button>
  </div>
  <p class="sub" id="pool"></p>
</section>

<!-- ===== QUIZ ===== -->
<section id="quiz" class="hide">
  <div class="bar"><i id="prog"></i></div>
  <div class="meta"><span id="pos"></span><span id="live"></span></div>

  <div class="qcard">
    <span class="tag" id="tag"></span>
    <p class="qtext" id="qtext"></p>
    <div class="opts" id="opts"></div>
    <div class="numin hide" id="numin">
      <input type="text" id="numval" inputmode="decimal" placeholder="輸入數值" autocomplete="off">
      <span class="u" id="numunit"></span>
    </div>
    <div class="fb hide" id="fb"></div>
    <div class="acts">
      <button class="primary" id="submit">作答</button>
      <button id="next" class="hide">下一題 →</button>
      <button id="quit">結束</button>
      <span class="kb" id="kbhint"></span>
    </div>
  </div>
</section>

<!-- ===== RESULT ===== -->
<section id="result" class="hide">
  <div class="score">
    <div class="big" id="pct"></div>
    <div class="lbl" id="scoretxt"></div>
  </div>
  <div class="bd" id="bd"></div>
  <div class="row">
    <button class="primary" id="again">再練一次</button>
    <button id="redo">只做錯題</button>
    <button id="home">回到選單</button>
  </div>
  <div class="wl" id="wl"></div>
</section>

<footer>
  <p>題目與解析依據全國法規資料庫現行條文編寫，於 2026-08-03 擷取核對。法規以主管機關公布文字為準。</p>
  <p>原文：<code>https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0120029</code></p>
</footer>
</div>

<script>
/* ========== 題庫 ==========
   c 類別 | t 型別 single/multi/num | q 題幹 | g 已知條件(可省)
   o 選項 | a 答案(index / index陣列 / 數值) | u 單位 | tol 容許誤差
   e 解析 | r 條號                                              */
const CATS = [
  {k:'A', n:'第二編 消防設計', d:'場所分類與應設場所門檻（§12～§30-1）'},
  {k:'B', n:'滅火設備', d:'滅火器、消防栓、撒水、水霧（§31～§68）'},
  {k:'C', n:'警報＋避難逃生', d:'火警、廣播、瓦斯、標示、避難器具（§112～§179）'},
  {k:'D', n:'泡沫滅火設備', d:'四條計算路徑與實例演算（§69～§81）'},
  {k:'E', n:'二氧化碳設備', d:'藥劑量、開口部、放射時序（§82～§97，含惰性氣體）'},
  {k:'F', n:'乾粉設備', d:'四種乾粉、充填比、加壓／蓄壓（§98～§111-1）'}
];

const Q = [
/* ---------- A 第二編 ---------- */
{c:'A',t:'single',q:'下列何種場所應設置滅火器，且「不受樓地板面積門檻」限制？',
 o:['甲類場所、地下建築物、幼兒園','總樓地板面積 150 m² 以上之乙類場所','總樓地板面積 150 m² 以上之丙類場所','地下層樓地板面積 50 m² 以上之場所'],a:0,
 e:'§14 第 1 款將甲類場所、地下建築物、幼兒園並列，無面積門檻；其餘各款均有面積條件。幼兒園（乙類第十二目）被特別拉高到與甲類同級。',r:'§14'},
{c:'A',t:'single',q:'5 層以下建築物，供甲類第一目（戲院、KTV、酒店等）使用，任何一層樓地板面積達多少應設室內消防栓設備？',
 o:['150 m²','300 m²','500 m²','1,400 m²'],a:1,
 e:'§15 第 1 款：5 層以下，甲一目任一層 300 m²；甲類其他各目及乙～丁類 500 m²；學校教室 1,400 m²。',r:'§15①'},
{c:'A',t:'single',q:'高度危險工作場所，其建築物及儲存場所之第 1 層與第 2 層樓地板面積合計達多少，應設室外消防栓設備？',
 o:['3,000 m²','5,000 m²','10,000 m²','20,000 m²'],a:0,
 e:'§16：高度 3,000／中度 5,000／低度 10,000 m²。記法為 3-5-10。',r:'§16①'},
{c:'A',t:'single',q:'建築物在 11 層以上之樓層，樓地板面積達多少應設自動撒水設備？',
 o:['100 m²','300 m²','700 m²','1,000 m²'],a:0,
 e:'§17 第 1 款第 2 目：11 層以上之樓層 100 m² 以上。另第 4 款「11 層以上建築物供甲類或戊一目使用者」則無面積門檻。',r:'§17①②'},
{c:'A',t:'multi',q:'依 §17，下列何者應設自動撒水設備且「無樓地板面積門檻」？（複選）',
 o:['高層建築物','11 層以上建築物供甲類場所使用者','甲六目所定長照、老福、護理、身障等機構','總樓地板面積 1,000 m² 以上之地下建築物'],a:[0,1,2],
 e:'§17 第 8 款（高層建築物）、第 4 款（11 層以上供甲類或戊一目）、第 9 款（甲六目機構）均無面積門檻。地下建築物則明定 1,000 m² 以上。',r:'§17①'},
{c:'A',t:'single',q:'乙類第十一目之高架儲存倉庫，須同時符合哪兩個條件才應設自動撒水設備？',
 o:['樓層高度超過 10 m 且樓地板面積 700 m² 以上','樓層高度超過 5.5 m 且樓地板面積 500 m² 以上','樓層高度超過 6 m 且樓地板面積 1,000 m² 以上','樓層高度超過 10 m 且樓地板面積 1,500 m² 以上'],a:0,
 e:'§17 第 1 款第 6 款：樓層高度超過 10 m「且」樓地板面積 700 m² 以上之高架儲存倉庫。兩條件缺一不可。',r:'§17①⑥'},
{c:'A',t:'single',q:'§18 附表項目三，室內停車空間位於「地下層或第 2 層以上」，樓地板面積達多少應設滅火設備？',
 o:['200 m²','300 m²','500 m²','1,000 m²'],a:0,
 e:'§18 附表項目三三段式門檻：第 1 層 500 m²、地下層或第 2 層以上 200 m²、屋頂停車場 300 m²。',r:'§18 附表'},
{c:'A',t:'single',q:'§18 附表註一所稱「大量使用火源場所」，指最大消費熱量合計在每小時多少千卡以上？',
 o:['10 萬千卡','20 萬千卡','30 萬千卡','50 萬千卡'],a:2,
 e:'§18 附表註一：每小時 30 萬千卡以上。此定義同時影響 §14 第 5 款滅火器與 §31 的 25 m² 效能值核算。',r:'§18 附表註一'},
{c:'A',t:'single',q:'依 §18 附表註五，平時有特定或不特定人員使用之中央管理室、防災中心等處所，不得設置何種滅火設備？',
 o:['惰性氣體滅火設備','二氧化碳滅火設備','鹵化烴滅火設備','乾粉滅火設備'],a:1,
 e:'§18 附表註五明文禁止二氧化碳滅火設備——CO₂ 以窒息滅火，對常時有人處所有致命風險。',r:'§18 附表註五'},
{c:'A',t:'single',q:'§18 第 1 項但書：外牆常時開放之開口面積達該層樓地板面積多少以上時，得採移動式設置？',
 o:['10%','15%','20%','30%'],a:1,
 e:'§18 第 1 項但書：15% 以上者，除惰性氣體及鹵化烴外之滅火設備得採移動式。這是移動式泡沫設備的法源。',r:'§18Ⅰ但書'},
{c:'A',t:'multi',q:'依 §20，下列何者應設置手動報警設備？（複選）',
 o:['3 層以上建築物，任何一層樓地板面積 200 m² 以上','甲類第三目之場所（觀光旅館、飯店、旅館、招待所）','總樓地板面積 1,000 m² 以上之地下建築物','11 層以上建築物'],a:[0,1],
 e:'§20 只有兩款：① 3 層以上任一層 200 m² 以上；② 甲類第三目場所。其餘為其他條文的門檻。',r:'§20'},
{c:'A',t:'single',q:'依 §22，緊急廣播設備的應設條件為何？',
 o:['總樓地板面積 1,000 m² 以上之建築物','11 層以上之建築物','設有火警自動警報或瓦斯漏氣火警自動警報設備之建築物','甲類場所及地下建築物'],a:2,
 e:'§22：緊急廣播設備沒有自己的面積門檻，跟著火警自動警報或瓦斯漏氣火警自動警報設備走。',r:'§22'},
{c:'A',t:'single',q:'依 §26，下列何者應設置連結送水管？',
 o:['5 層以上建築物','5 或 6 層建築物總樓地板面積 6,000 m² 以上，及 7 層以上建築物','11 層以上建築物','總樓地板面積 3,000 m² 以上之建築物'],a:1,
 e:'§26 第 1 款：5 或 6 層總樓地板面積 6,000 m² 以上，以及 7 層以上建築物（7 層以上無面積門檻）。',r:'§26①'},
{c:'A',t:'single',q:'依 §28，樓地板面積 100 m² 以上之居室，其天花板下方 80 cm 範圍內有效通風面積未達該居室樓地板面積多少時，應設排煙設備？',
 o:['1%','2%','5%','10%'],a:1,
 e:'§28 第 2 款：未達 2%。注意「5%」是 §24 緊急照明的有效採光門檻，兩者常被混。',r:'§28②'},
{c:'A',t:'single',q:'依 §30-1，總樓地板面積達多少之建築物應設置防災監控系統綜合操作裝置？',
 o:['10,000 m²','25,000 m²','50,000 m²','100,000 m²'],a:2,
 e:'§30-1 第 2 款：50,000 m² 以上。另高層建築物、地下建築物 1,000 m² 以上亦應設。',r:'§30-1②'},
{c:'A',t:'single',q:'依 §25，避難器具應設於建築物之哪些樓層？',
 o:['全部樓層','除 11 層以上樓層及避難層外之各樓層','除地下層外之各樓層','僅 3 層以上之樓層'],a:1,
 e:'§25：除 11 層以上樓層及避難層外，各樓層應選設。11 層以上不設是因高處使用避難器具過於危險；避難層本就在地面。',r:'§25'},
{c:'A',t:'single',q:'「無開口樓層」定義中，10 層以下之樓層除有效開口合計面積須達樓地板面積 1/30 外，還須符合什麼？',
 o:['至少 2 個內切直徑 50 cm 以上圓孔','至少 2 個內切直徑 1 m 以上圓孔，或寬 75 cm 以上、高 120 cm 以上之開口','至少 1 個內切直徑 1 m 以上圓孔','開口須面臨寬度 4 m 以上道路'],a:1,
 e:'§4 第 1 項第 2 款第 2 目但書。11 層以上只要求 1/30；10 層以下多了這個附加條件——因為 10 層以下是雲梯車可及範圍，要求消防人員能實際進入。',r:'§4Ⅰ②'},
{c:'A',t:'single',q:'依 §4，「有效開口」採一般玻璃門窗時，厚度應在多少以下？',
 o:['3 mm','6 mm','10 mm','12 mm'],a:1,
 e:'§4 第 2 項第 4 款：厚度 6 mm 以下，才能由消防人員自外面輕易破壞進入。',r:'§4Ⅱ④'},
{c:'A',t:'single',q:'依 §4，儲存一般可燃性固體物質倉庫之高度超過多少，屬「高度危險工作場所」？',
 o:['4 m','5.5 m','6 m','10 m'],a:1,
 e:'§4 第 1 項第 3 款：超過 5.5 m 為高度危險；未超過 5.5 m 為中度危險。這個數字同時是丁類場所分級的依據。',r:'§4Ⅰ③④'},
{c:'A',t:'multi',q:'依 §13，各類場所增建、改建或變更用途時，下列哪些消防安全設備一律適用「變更後」之標準？（複選）',
 o:['滅火器','自動撒水設備','火警自動警報設備','緊急照明設備'],a:[0,2,3],
 e:'§13 第 1 款列舉七項：滅火器、火警自動警報、手動報警、緊急廣播、標示設備、避難器具、緊急照明。自動撒水設備不在其中，原則從舊。',r:'§13①'},
{c:'A',t:'single',q:'依 §5，建築物間設有過廊而視為另一場所時，過廊之有效寬度應在多少以下？',
 o:['3 m','4 m','6 m','10 m'],a:2,
 e:'§5 第 2 項第 2 款：有效寬度 6 m 以下。另須符合僅供通行搬運、且連接間距一樓超過 6 m、二樓以上超過 10 m。',r:'§5Ⅱ②'},
{c:'A',t:'single',q:'依 §16 第 2 項，設有下列何種設備者，在有效範圍內得免設室外消防栓設備？',
 o:['室內消防栓設備','自動撒水設備','滅火器','連結送水管'],a:1,
 e:'§16 第 2 項清單為：自動撒水、水霧、泡沫、CO₂、惰性氣體、鹵化烴、乾粉。「室內消防栓」不在其中——室內消防栓不能抵免室外消防栓，這是單向關係。',r:'§16Ⅱ'},
{c:'A',t:'single',q:'依 §15 第 2 項但書，設有室外消防栓設備時，室內消防栓限於哪些樓層得免設？',
 o:['全部樓層','第 1 層、第 2 層','第 1 層','地下層'],a:1,
 e:'§15 第 2 項但書：限第 1 層（水平距離 40 m 以下）、第 2 層（步行距離 40 m 以下）。注意兩層的距離定義不同。',r:'§15Ⅱ但書'},
{c:'A',t:'single',q:'依 §21，總樓地板面積達多少之地下建築物應設瓦斯漏氣火警自動警報設備？',
 o:['500 m²','1,000 m²','1,500 m²','3,000 m²'],a:1,
 e:'§21 第 3 款：1,000 m² 以上。§21 三款門檻都是 1,000 m²（第 2 款另要求其中甲類合計 500 m² 以上）。',r:'§21③'},
{c:'A',t:'single',q:'依 §27，各類場所建築基地面積達 20,000 m² 以上，且任何一層樓地板面積達多少時，應設消防專用蓄水池？',
 o:['1,000 m²','1,500 m²','2,500 m²','3,000 m²'],a:1,
 e:'§27 第 1 款：基地面積 20,000 m² 以上「且」任一層 1,500 m² 以上，兩條件並存。',r:'§27①'},

/* ---------- B 滅火設備 ---------- */
{c:'B',t:'single',q:'依 §31，供甲類及戊類場所使用者，各層樓地板面積每多少（含未滿）有一滅火效能值？',
 o:['25 m²','50 m²','100 m²','200 m²'],a:2,
 e:'§31 第 1 款：甲類及戊類 100 m²；乙、丙、丁類 200 m²；鍋爐房廚房等大量使用火源處所 25 m²。',r:'§31①'},
{c:'B',t:'single',q:'鍋爐房、廚房等大量使用火源之處所，樓地板面積每多少（含未滿）有一滅火效能值？',
 o:['25 m²','50 m²','100 m²','200 m²'],a:0,
 e:'§31 第 1 款第 3 目：25 m²。這是全條最嚴的密度，因為火源密集。',r:'§31①（三）'},
{c:'B',t:'single',q:'設有滅火器之樓層，自樓面居室任一點至滅火器之步行距離應在多少以下？',
 o:['15 m','20 m','25 m','30 m'],a:1,
 e:'§31 第 3 款：步行距離 20 m 以下。注意是「步行距離」，不是水平距離。',r:'§31③'},
{c:'B',t:'single',q:'懸掛於牆上之滅火器，重量 18 kg 以上者，其上端與樓地板面之距離應在多少以下？',
 o:['0.8 m','1 m','1.5 m','1.8 m'],a:1,
 e:'§31 第 5 款：18 kg 以上者 1 m 以下；未滿 18 kg 者 1.5 m 以下。越重掛越低，才搬得動。',r:'§31⑤'},
{c:'B',t:'single',q:'第一種室內消防栓，任一樓層全部消防栓同時使用時，各瞄子放水量應在多少以上？',
 o:['80 L/min','130 L/min','150 L/min','350 L/min'],a:1,
 e:'§34 第 1 款：第一種放水量 130 L/min、第二種 80 L/min。150／90 是「幫浦出水量」，兩組數字不可混用。',r:'§34①（二）'},
{c:'B',t:'single',q:'第二種室內消防栓之立管管徑應在多少以上？',
 o:['40 mm','50 mm','63 mm','100 mm'],a:1,
 e:'§32 第 1 款第 4 目：第一種 63 mm 以上、第二種 50 mm 以上。凡跟「量」有關的，第一種都比較大。',r:'§32Ⅰ④'},
{c:'B',t:'single',q:'第一種室內消防栓之屋頂水箱水量應在多少以上？',
 o:['0.3 m³','0.5 m³','1 m³','2 m³'],a:1,
 e:'§32 第 3 款：第一種 0.5 m³、第二種 0.3 m³。自動撒水設備的屋頂水箱則為 1 m³（§44③）。',r:'§32Ⅲ①'},
{c:'B',t:'num',q:'某建築物設第一種室內消防栓，某樓層設有 4 支。試求該設備所需之最低水源容量。',
 g:'第一種消防栓放水量 130 L/min；同時使用數超過 2 支時以 2 支計；放水時間 20 分鐘。',
 a:5.2,u:'m³',tol:0.05,
 e:'§36：2 支 × 130 L/min × 20 min = 5,200 L = 5.2 m³。陷阱在於實設 4 支，但法定以 2 支計算。',r:'§36'},
{c:'B',t:'single',q:'室內消防栓使用消防幫浦時，其全揚程公式為何？',
 o:['H = h₁ + h₂ + 10','H = h₁ + h₂ + h₃ + 17','H = h₁ + h₂ + h₃ + 25','H = h₁ + 10'],a:1,
 e:'§37 第 3 款第 2 目：H = 消防水帶摩擦損失 + 配管摩擦損失 + 落差 + 17 m。常數 17 = 放水壓力 1.7 kgf/cm² 換算之水頭。',r:'§37Ⅰ③（二）'},
{c:'B',t:'single',q:'室內消防栓瞄子放水壓力超過多少時，應採取有效之減壓措施？',
 o:['5 kgf/cm²','6 kgf/cm²','7 kgf/cm²','10 kgf/cm²'],a:2,
 e:'§37 第 2 項第 4 款：超過 7 kgf/cm²。室外消防栓則為超過 6 kgf/cm²（§42Ⅱ），撒水頭上限為 10 kgf/cm²（§58Ⅱ）。',r:'§37Ⅱ④'},
{c:'B',t:'single',q:'室外消防栓之瞄子出水壓力與出水量規定為何？',
 o:['1.7 kgf/cm² 以上、130 L/min 以上','2.5 kgf/cm² 以上、350 L/min 以上','2.7 kgf/cm² 以上、400 L/min 以上','3.5 kgf/cm² 以上、100 L/min 以上'],a:1,
 e:'§40 第 2 款：出水壓力 2.5 kgf/cm²（0.25 MPa）以上、出水量 350 L/min 以上。400 L/min 是幫浦出水量。',r:'§40②'},
{c:'B',t:'num',q:'試求室外消防栓設備所需之最低水源容量。',
 g:'室外消防栓出水量 350 L/min；水源以 2 具同時放水計算。',
 a:21,u:'m³',tol:0.2,
 e:'§41：2 具 × 350 L/min × 30 min = 21,000 L = 21 m³。注意室外消防栓是 30 分鐘，室內消防栓是 20 分鐘——這是唯二的時間例外之一。',r:'§41'},
{c:'B',t:'single',q:'汽車修理廠、室內停車空間及昇降機械式停車場，任一點至撒水頭之水平距離應在多少以下？',
 o:['1.7 m','2.1 m','2.3 m','2.6 m'],a:1,
 e:'§46 第 2 款：2.1 m 以下。1.7 m 適用舞臺道具室、放映室、易燃物品倉庫；2.3／2.6 m 為一般／快速反應型於防火構造之放寬值。',r:'§46②'},
{c:'B',t:'single',q:'採用小區劃型撒水頭時，下列敘述何者正確？',
 o:['限第二種感度，水平距離 2.1 m 以下','限第一種感度，水平距離 2.6 m 以下、間距 3 m 以上、防護面積 13 m² 以下','不限感度，水平距離 2.3 m 以下','限第一種感度，牆面二側 1.8 m 以下'],a:1,
 e:'§46 第 4 款：限第一種感度、水平距離 2.6 m 以下、撒水頭間距 3 m 以上、任一撒水頭防護面積 13 m² 以下。選項 4 是側壁型的規定。',r:'§46④'},
{c:'B',t:'single',q:'一般撒水頭之放水量與放水壓力規定為何？',
 o:['50 L/min 以上、1 kgf/cm² 以上','80 L/min 以上、1 kgf/cm² 以上','90 L/min 以上、1.7 kgf/cm² 以上','114 L/min 以上、1 kgf/cm² 以上'],a:1,
 e:'§50：一般 80 L/min、高架倉庫 114 L/min、小區劃型 50 L/min，放水壓力均為 1 kgf/cm²（0.1 MPa）以上。',r:'§50'},
{c:'B',t:'single',q:'密閉式撒水頭，裝置場所最高周圍溫度在 39°C 以上未滿 64°C 時，應選擇之標示溫度為何？',
 o:['75°C 未滿','75°C 以上未滿 121°C','121°C 以上未滿 162°C','162°C 以上'],a:1,
 e:'§48：39／64／106 三個分界，對應 75／121／162。',r:'§48'},
{c:'B',t:'num',q:'某 8 層建築物之辦公室（非甲四目、非地下層），採一般反應型密閉式撒水頭，濕式流水檢知裝置。試求所需最低水源容量。',
 g:'§57 表：10 樓以下「其他」場所，一般反應型 10 個；撒水頭放水量 80 L/min；放水時間 20 分鐘。',
 a:16,u:'m³',tol:0.2,
 e:'10 個 × 80 L/min × 20 min = 16,000 L = 16 m³。若改為快速反應型則為 8 個 → 12.8 m³；若採乾式或預動式流水檢知裝置，撒水頭數量須追加 50%（§57Ⅱ）。',r:'§57Ⅰ①'},
{c:'B',t:'single',q:'自動撒水設備使用乾式或預動式流水檢知裝置時，§57 表列之撒水頭數量應如何處理？',
 o:['減少 20%','不變','追加 50%','追加 100%'],a:2,
 e:'§57 第 2 項：追加 50%。因為乾式／預動式從動作到出水有延遲（§55 規定須在 1 分鐘內放水），火勢已擴大。',r:'§57Ⅱ'},
{c:'B',t:'single',q:'自動撒水設備使用消防幫浦時，一般撒水頭之幫浦出水量係依 §57 核算之撒水頭數量乘以多少？',
 o:['60 L/min','80 L/min','90 L/min','130 L/min'],a:2,
 e:'§58 第 3 款：一般 90 L/min、高架儲存倉庫 130 L/min、小區劃型 60 L/min。與 §50 的放水量（80／114／50）是兩組不同數字。',r:'§58Ⅰ③（一）'},
{c:'B',t:'single',q:'自動撒水設備之撒水頭放水壓力上限為多少？',
 o:['7 kgf/cm²','10 kgf/cm²','12 kgf/cm²','無上限'],a:1,
 e:'§58 第 2 項：10 kgf/cm²（1 MPa）以下。壓力過高會使水霧化過度、水滴無法穿透火羽流。',r:'§58Ⅱ'},
{c:'B',t:'single',q:'自動撒水設備之流水檢知裝置，各樓層樓地板面積在多少以下者裝設 1 套？（無隔間之情形除外）',
 o:['1,000 m²','3,000 m²','5,000 m²','10,000 m²'],a:1,
 e:'§51 第 1 款：3,000 m² 以下 1 套，超過裝 2 套。第 2 款：無隔間之樓層，3,000 m² 得增為 10,000 m²。',r:'§51①②'},
{c:'B',t:'multi',q:'依 §49，下列何者屬「得免裝撒水頭」之處所？（複選）',
 o:['電信機械室或電腦室','手術室、產房、X 光室、加護病房','鍋爐房、廚房','儲存鋁粉、碳化鈣、鈉、鎂粉等禁水性物質之倉庫'],a:[0,1,3],
 e:'§49 共 15 款。電氣類（第 5、6 款）、醫療類（第 8 款）、禁水性物質（第 12 款）均得免裝。鍋爐房、廚房不在免裝之列——反而是 §14、§18、§31 特別點名要加強的場所。',r:'§49'},
{c:'B',t:'single',q:'水霧滅火設備之水源容量，放射區域在 2 區域以上者，應保持多少以上？',
 o:['20 m³','40 m³','60 m³','80 m³'],a:1,
 e:'§64：1 區域 20 m³、2 區域以上 40 m³。水霧的水源是固定值，不隨面積變動——這是它與撒水、泡沫最大的差異。',r:'§64'},
{c:'B',t:'single',q:'水霧滅火設備之加壓送水裝置使用消防幫浦時，放射區域 2 個以上者，出水量應在多少以上？',
 o:['1,200 L/min','1,500 L/min','2,000 L/min','2,400 L/min'],a:2,
 e:'§65 第 1 款：1 區域 1,200 L/min、2 區域以上 2,000 L/min（非單純加倍）。',r:'§65①'},
{c:'B',t:'single',q:'水霧滅火設備用於防護電氣設備者，其出水壓力應達多少以上？',
 o:['1 kgf/cm²','2.5 kgf/cm²','2.7 kgf/cm²','3.5 kgf/cm²'],a:3,
 e:'§65 第 2 款：一般 2.7 kgf/cm²，防護電氣設備者 3.5 kgf/cm²。壓力越高、水滴越細，導電性越低。',r:'§65②'},
{c:'B',t:'single',q:'水霧噴頭之配置數量，供 §18 附表第三項、第四項（汽車修理廠、室內停車空間、昇降機械式停車場）使用時，每平方公尺放水量應在多少以上？',
 o:['10 L/min','15 L/min','20 L/min','30 L/min'],a:2,
 e:'§61 第 3 款：§18 附表第三、四項場所 20 L/min；其他場所 10 L/min。停車空間有油類火災風險，需求加倍。',r:'§61③'},
{c:'B',t:'single',q:'密閉乾式自動撒水設備竣工時之空氣壓試驗，壓力應達多少，且持續多久？',
 o:['1.5 kgf/cm²，2 小時','2.8 kgf/cm²，24 小時','2.8 kgf/cm²，2 小時','1 kgf/cm²，24 小時'],a:1,
 e:'§45 但書：空氣壓力達 2.8 kgf/cm²（0.28 MPa），持續 24 小時，漏氣減壓量 0.1 kgf/cm²（0.01 MPa）以下為合格。水壓試驗則為全閉揚程 1.5 倍、持續 2 小時（§33）。',r:'§45'},
{c:'B',t:'single',q:'補助撒水栓之放水壓力與放水量規定為何？',
 o:['1 kgf/cm² 以上、80 L/min 以上','1.7 kgf/cm² 以上、130 L/min 以上','2.5 kgf/cm² 以上、60 L/min 以上','3.5 kgf/cm² 以上、100 L/min 以上'],a:2,
 e:'§57 第 3 項第 2 款：2.5 kgf/cm²（0.25 MPa）以上、60 L/min 以上，水平距離 15 m 以下。',r:'§57Ⅲ②'},

/* ---------- C 警報＋避難逃生 ---------- */
{c:'C',t:'single',q:'火警分區之劃定，每一分區之樓地板面積原則上應在多少以下？',
 o:['300 m²','500 m²','600 m²','1,000 m²'],a:2,
 e:'§112 第 1 款：600 m² 以下。若由主要出入口或直通樓梯出入口能直接觀察該樓層任一角落，得增為 1,000 m²（第 3 款）。',r:'§112①'},
{c:'C',t:'single',q:'裝設光電式分離型探測器時，每一火警分區之任一邊長得在多少以下？',
 o:['50 m','60 m','100 m','150 m'],a:2,
 e:'§112 第 2 款：一般為 50 m 以下，光電式分離型得放寬為 100 m 以下——因為它是線型偵測，監視距離長。',r:'§112②'},
{c:'C',t:'single',q:'樓梯或斜坡通道，垂直距離每多少以下為一火警分區？',
 o:['15 m','30 m','45 m','50 m'],a:2,
 e:'§112 第 5 款：每 45 m 以下為一火警分區，且地下層部分應為另一火警分區。緊急廣播分區的安全梯也是 45 m（§134②）。',r:'§112⑤'},
{c:'C',t:'single',q:'依 §113，5 樓以上且總樓地板面積 3,000 m² 以上之建築物，起火層為地上 2 層以上時，其鳴動範圍為何？',
 o:['僅該樓層','該樓層與其直上層','該樓層與其直上 2 層及其直下 1 層','全區鳴動'],a:2,
 e:'§113 第 1 款：該層 + 直上 2 層 + 直下 1 層。火往上跑，所以上面警戒 2 層、下面 1 層。第 4 款：10 分鐘內或再接受火災信號時應立即全區鳴動。',r:'§113①'},
{c:'C',t:'single',q:'起火層為地下層時，火警自動警報設備之鳴動範圍為何？',
 o:['僅地下層各層','地面層及地下層各層','地面層、地下層各層及地上 2 層','全區鳴動'],a:1,
 e:'§113 第 3 款：地面層及地下層各層。地下層火災煙會沿樓梯竄上地面層，所以地面層一併鳴動。',r:'§113③'},
{c:'C',t:'multi',q:'裝置場所高度在 15 m 以上未滿 20 m 時，得選用下列哪些探測器？（複選）',
 o:['離子式局限型一種','光電式局限型一種','差動式局限型','火焰式'],a:[0,1,3],
 e:'§114 表：15～20 m 只剩離子式局限型一種、光電式局限型一種、光電式分離型一種、火焰式。差動式局限型在 8 m 以上就出局（只剩分布型）。',r:'§114'},
{c:'C',t:'single',q:'依 §116，探測器（除火焰式外）裝置面高度超過多少者得免設？',
 o:['15 m','20 m','25 m','30 m'],a:1,
 e:'§116 第 1 款：超過 20 m。§118 表亦規定天花板等高度超過 20 m 之場所只能選火焰式。',r:'§116①'},
{c:'C',t:'single',q:'天花板設有排氣口或回風口時，偵煙式探測器應裝置於何處？',
 o:['距離該處 1.5 m 以上','該處周圍 1 m 範圍內','距離該處 3 m 以上','不受限制'],a:1,
 e:'§115 第 3 款：排氣口／回風口周圍 1 m 範圍內（要靠近，因為煙會被吸過去）。而「出風口」則須距離 1.5 m 以上（要遠離，因為會吹散煙）。方向相反，最常考。',r:'§115③'},
{c:'C',t:'single',q:'差動式分布型及偵煙式探測器之探測區域，其四周樑或類似構造體之淨高應為多少以上？',
 o:['30 cm','40 cm','60 cm','80 cm'],a:2,
 e:'§119：一般為 40 cm 以上，差動式分布型及偵煙式為 60 cm 以上。',r:'§119'},
{c:'C',t:'single',q:'差動式局限型探測器（一種），裝置面高度未滿 4 m 且為防火構造建築物時，其有效探測範圍為多少？',
 o:['50 m²','70 m²','90 m²','150 m²'],a:2,
 e:'§120 表：差動式局限型一種、防火構造、未滿 4 m → 90 m²（全表最大值）。其他建築物為 50 m²，約為防火構造的 0.55 倍。',r:'§120②'},
{c:'C',t:'single',q:'偵煙式探測器（一種或二種），裝置面高度未滿 4 m 時，其有效探測範圍為多少？',
 o:['50 m²','75 m²','90 m²','150 m²'],a:3,
 e:'§122 第 4 款：未滿 4 m 為 150 m²（三種為 50 m²）；4 m 以上未滿 20 m 為 75 m²。偵煙式的探測範圍遠大於熱感知式。',r:'§122④'},
{c:'C',t:'single',q:'偵煙式探測器設於走廊及通道時，步行距離每多少至少設置一個？（使用第一種或第二種）',
 o:['15 m','20 m','30 m','50 m'],a:2,
 e:'§122 第 5 款：每 30 m 至少 1 個（第三種為每 20 m），且距盡頭牆壁 15 m 以下（第三種 10 m 以下）。',r:'§122⑤'},
{c:'C',t:'single',q:'偵煙式探測器設於樓梯、斜坡通道及電扶梯時，垂直距離每多少至少設置一個？',
 o:['10 m','15 m','30 m','45 m'],a:1,
 e:'§122 第 6 款：垂直距離每 15 m 至少 1 個（第三種每 10 m）。注意這與火警分區的 45 m 是不同的概念。',r:'§122⑥'},
{c:'C',t:'single',q:'偵煙式探測器（除光電式分離型外）之下端，應裝設在裝置面下方多少範圍內？',
 o:['30 cm','45 cm','60 cm','80 cm'],a:2,
 e:'§122 第 2 款：60 cm 範圍內。而差動式／補償式／定溫式局限型是 30 cm（§120①）。煙比熱輕、擴散慢，所以偵煙式可以裝得離裝置面遠一些。',r:'§122②'},
{c:'C',t:'single',q:'光電式分離型探測器之光軸，應設於天花板等高度多少以上之位置？',
 o:['50%','60%','80%','90%'],a:2,
 e:'§123 第 5 款：天花板等高度 80% 以上。另光軸與警戒區任一點之水平距離應在 7 m 以下（第 7 款）。',r:'§123⑤'},
{c:'C',t:'single',q:'P 型受信總機採數個分區共用一公用線方式配線時，該公用線供應之分區數不得超過幾個？',
 o:['5 個','7 個','10 個','15 個'],a:1,
 e:'§127 第 2 款：不得超過 7 個。另探測器回路電阻應在 50 Ω 以下（第 3 款）。',r:'§127②'},
{c:'C',t:'single',q:'受信總機、中繼器及偵煙式探測器設定蓄積時間時，其合計每一火警分區應在多少以下？',
 o:['20 秒','30 秒','60 秒','120 秒'],a:2,
 e:'§125 第 7 款：使用偵煙式探測器時合計 60 秒以下；使用其他探測器時 20 秒以下。',r:'§125Ⅰ⑦'},
{c:'C',t:'single',q:'火警自動警報設備之緊急電源應使用何種電源，容量須能有效動作多久？',
 o:['發電機設備，30 分鐘','蓄電池設備，10 分鐘','蓄電池設備，30 分鐘','發電機或蓄電池設備，20 分鐘'],a:1,
 e:'§128：蓄電池設備、10 分鐘。警報類（火警、緊急廣播、瓦斯漏氣）都是 10 分鐘；標示燈 20 分鐘；滅火與緊急照明 30 分鐘。',r:'§128'},
{c:'C',t:'single',q:'火警發信機離地板面之裝設高度應為多少？',
 o:['0.3 m 以上 1.5 m 以下','0.8 m 以上 1.5 m 以下','1.2 m 以上 1.5 m 以下','2 m 以上 2.5 m 以下'],a:2,
 e:'§132 第 2 款：1.2～1.5 m。而標示燈及火警警鈴為 2～2.5 m（第 3 款），室內消防栓開關為 0.3～1.5 m（§34Ⅱ①）。',r:'§132②'},
{c:'C',t:'single',q:'火警警鈴在規定電壓下，離開警鈴 100 cm 處所測得之音壓應在多少以上？',
 o:['70 分貝','84 分貝','90 分貝','92 分貝'],a:2,
 e:'§131 第 2 款：90 dB 以上（距 100 cm）。瓦斯漏氣之檢知區域警報裝置為 70 dB（距 1 m），緊急廣播 L 級揚聲器為 92 dB（距 1 m）。',r:'§131②'},
{c:'C',t:'single',q:'緊急廣播設備之揚聲器，廣播區域超過 100 m² 時應設何種等級？',
 o:['僅 S 級','L 級或 M 級','僅 L 級','L、M 或 S 級皆可'],a:2,
 e:'§133 第 2 款：超過 100 m² 僅 L 級；50～100 m² 為 L 或 M 級；50 m² 以下三種皆可。面積越大、要求音壓越高。',r:'§133②'},
{c:'C',t:'single',q:'緊急廣播設備之揚聲器設於樓梯或斜坡通道時，至少垂直距離每多少設一個 L 級揚聲器？',
 o:['10 m','15 m','30 m','45 m'],a:1,
 e:'§133 第 2 款第 5 目：垂直距離每 15 m 一個 L 級。而廣播「分區」的安全梯是每 45 m（§134②）——距離與分區是兩件事。',r:'§133②（五）'},
{c:'C',t:'single',q:'各樓層任一點至緊急廣播設備啟動裝置之步行距離應在多少以下？',
 o:['20 m','30 m','50 m','75 m'],a:2,
 e:'§136 第 1 款：50 m 以下。另 11 層以上各樓層、地下第 3 層以下各樓層、地下建築物應使用緊急電話方式啟動（第 3 款）。',r:'§136①'},
{c:'C',t:'single',q:'瓦斯對空氣之比重未滿 1 時（如天然氣），瓦斯漏氣檢知器應設於距瓦斯燃燒器具或導管貫穿牆壁處水平距離多少以內？',
 o:['4 m','6 m','8 m','10 m'],a:2,
 e:'§141 第 1 款：比重未滿 1（輕，往上飄）→ 8 m 以內，下端裝在天花板下方 30 cm 內。比重大於 1（重，往下沉）→ 4 m 以內，上端裝在距樓地板面 30 cm 內。',r:'§141①'},
{c:'C',t:'single',q:'瓦斯對空氣之比重大於 1 時（如液化石油氣），檢知器之「上端」應裝設在何處？',
 o:['天花板下方 30 cm 範圍內','距樓地板面 30 cm 範圍內','距樓地板面 60 cm 範圍內','天花板下方 60 cm 範圍內'],a:1,
 e:'§141 第 2 款：上端裝在距樓地板面 30 cm 範圍內。LPG 比空氣重會沉積在地面，所以檢知器要裝低。',r:'§141②'},
{c:'C',t:'single',q:'瓦斯漏氣之檢知區域警報裝置，其音壓在距多少處應有 70 分貝以上？',
 o:['0.5 m','1 m','1.5 m','3 m'],a:1,
 e:'§143 第 2 款：距 1 m 處 70 dB 以上。另瓦斯漏氣表示燈距樓地板面高度應在 4.5 m 以下，亮度須在前方 3 m 處能明確識別。',r:'§143②'},
{c:'C',t:'single',q:'瓦斯漏氣火警自動警報設備之絕緣電阻，應以直流多少伏特額定之絕緣電阻計測定？',
 o:['DC 100 V','DC 250 V','DC 500 V','DC 1000 V'],a:2,
 e:'§144 第 1 款：DC 500 V。而火警自動警報設備（§127④）與緊急廣播（§139①）都是 DC 250 V——這組數字最容易記反。',r:'§144①'},
{c:'C',t:'single',q:'A 級出口標示燈之標示面光度應在多少以上？',
 o:['10 cd','20 cd','50 cd','60 cd'],a:2,
 e:'§146-1 表：出口標示燈 A/B/C 級為 50／10／1.5 cd；避難方向指示燈為 60／13／5 cd。避難方向指示燈的光度要求較高。',r:'§146-1'},
{c:'C',t:'single',q:'出口標示燈有效範圍之計算式 D = kh 中，「未顯示避難方向符號」之出口標示燈其 k 值為何？',
 o:['50','100','150','200'],a:2,
 e:'§146-2 第 2 款：出口標示燈未顯示方向符號 k = 150；顯示方向符號 k = 100；避難方向指示燈 k = 50。顯示符號反而縮短有效範圍，因為畫面被符號占用、辨識性下降。',r:'§146-2②'},
{c:'C',t:'num',q:'某 A 級出口標示燈，標示面縱向尺度 h = 0.4 m，未顯示避難方向符號。試以計算法求其有效範圍（步行距離）。',
 g:'D = k·h；出口標示燈未顯示避難方向符號時 k = 150。',
 a:60,u:'m',tol:0.5,
 e:'D = 150 × 0.4 = 60 m，與 §146-2 第 1 款查表結果一致。但若有不易看清或識別該燈之情形，有效範圍一律為 10 m。',r:'§146-2'},
{c:'C',t:'single',q:'避難指標設於走廊或通道時，自任一點至指標之步行距離應在多少以下？',
 o:['5 m','7.5 m','10 m','15 m'],a:1,
 e:'§153 第 2 款：7.5 m 以下，且優先設於轉彎處。',r:'§153②'},
{c:'C',t:'single',q:'出口標示燈及避難方向指示燈之緊急電源，原則上容量應能使其有效動作多久？',
 o:['10 分鐘','20 分鐘','30 分鐘','60 分鐘'],a:1,
 e:'§155：原則 20 分鐘。但總樓地板面積 50,000 m² 以上、高層建築物 30,000 m² 以上、地下建築物 1,000 m² 以上者之「主要避難路徑」應達 60 分鐘。',r:'§155'},
{c:'C',t:'single',q:'緊急照明燈在地下建築物之地下通道，其地板面水平面照度應在多少以上？',
 o:['1 lx','2 lx','5 lx','10 lx'],a:3,
 e:'§178：地下建築物之地下通道 10 lx；其他場所 2 lx。另觀眾席引導燈為 0.2 lx（§146-6），樓梯避難方向指示燈為 1 lx（§146-5Ⅲ）。',r:'§178'},
{c:'C',t:'single',q:'緊急照明設備之緊急電源，採蓄電池設備與緊急發電機併設方式時，其容量應分別能持續動作多久？',
 o:['10 分鐘及 30 分鐘','20 分鐘及 30 分鐘','30 分鐘及 30 分鐘','10 分鐘及 60 分鐘'],a:0,
 e:'§177 第 2 項：單獨蓄電池為 30 分鐘；併設時分別為 10 分鐘（蓄電池）及 30 分鐘（發電機）——蓄電池只需撐到發電機啟動。',r:'§177Ⅱ'},
{c:'C',t:'single',q:'依 §157 附表，設於「地下層」之避難器具，僅得選設下列何者？',
 o:['緩降機','救助袋','避難梯','滑臺'],a:2,
 e:'§157 附表：地下層一律只能用避難梯——因為地下層要「往上逃」，只有梯子做得到，滑臺、緩降機、救助袋都是往下的器具。',r:'§157'},
{c:'C',t:'single',q:'依 §160，集合住宅、寄宿舍之收容人員如何計算？',
 o:['樓地板面積除 3 m²','樓地板面積除 6 m²','每戶以 3 人計算','實際居住人數'],a:2,
 e:'§160 表第 6 項：合計其居住人數，每戶以 3 人計算。',r:'§160'},
{c:'C',t:'single',q:'依 §162，供「避難橋」使用之開口部，其開口高度應在多少以上？',
 o:['60 cm','80 cm','100 cm','180 cm'],a:3,
 e:'§162 表：避難橋 180 cm（人站著走過去）；救助袋 60×60 cm；緩降機、避難梯、避難繩索、滑杆為高 80 且寬 50，或高 100 且寬 45。',r:'§162'},
{c:'C',t:'single',q:'依 §158，建築物主要構造為防火構造且設有二座以上不同避難方向之安全梯者，其應設避難器具數量如何處理？',
 o:['得免設','表列 100／200／300 人得以加倍數值重新核算','減設 2 具','減設一半'],a:1,
 e:'§158 第 1 款：以加倍數值重新核算應設數量（等於實質減半）。剪刀式樓梯視為一座，不能算兩座。',r:'§158①'},
{c:'C',t:'single',q:'依 §161，設置避難器具之開口部，上下層應如何配置？',
 o:['應在同一垂直線上以便管理','應交錯配置，不得在同一垂直線上','無限制','應設於建築物四角'],a:1,
 e:'§161 第 5 款：上下層交錯配置，不得在同一垂直線上（滑杆、避難繩索及避難橋除外）。避免上層逃生者掉落砸到下層使用者。',r:'§161⑤'},

/* ---------- D 泡沫 ---------- */
{c:'D',t:'single',q:'依 §70，膨脹比在 20 以下（低發泡）者，應選擇何種泡沫放出口？',
 o:['高發泡放出口','泡沫噴頭或泡水噴頭','泡沫瞄子','一齊開放閥'],a:1,
 e:'§70 表：膨脹比 20 以下（低發泡）→ 泡沫噴頭或泡水噴頭；80 以上 1000 以下（高發泡）→ 高發泡放出口。20～80 之間法規沒有規定，是空白區。',r:'§70'},
{c:'D',t:'single',q:'高發泡放出口之「第二種」，其膨脹比範圍為何？',
 o:['80 以上 250 未滿','250 以上 500 未滿','500 以上 1000 未滿','1000 以上'],a:1,
 e:'§73 表：第一種 80～250 未滿、第二種 250～500 未滿、第三種 500～1000 未滿。',r:'§73'},
{c:'D',t:'single',q:'飛機庫等場所使用泡水噴頭時，樓地板面積每多少設置一個？',
 o:['8 m²','9 m²','10 m²','20 m²'],a:0,
 e:'§71 第 1 款：飛機庫用泡水噴頭，每 8 m² 一個。室內停車空間或汽車修理廠用泡沫噴頭，每 9 m² 一個（第 2 款）。',r:'§71①'},
{c:'D',t:'single',q:'放射區域內任一點至泡沫噴頭之水平距離應在多少以下？',
 o:['1.7 m','2.1 m','2.3 m','2.6 m'],a:1,
 e:'§71 第 3 款：2.1 m 以下，與自動撒水設備在停車空間的規定相同。',r:'§71③'},
{c:'D',t:'single',q:'泡水噴頭之放射量應在多少以上？',
 o:['50 L/min','75 L/min','80 L/min','100 L/min'],a:1,
 e:'§72 第 1 款：泡水噴頭每個 75 L/min 以上。注意泡水噴頭算的是「個數 × 75」，不是「面積 × 單位放射量」——§72 那張 6.5／8／3.7 的表只適用泡沫噴頭。',r:'§72①'},
{c:'D',t:'single',q:'使用「水成膜泡沫液」時，泡沫噴頭之樓地板面積每平方公尺放射量應在多少以上？',
 o:['3.7 L/min','6.5 L/min','8 L/min','10 L/min'],a:0,
 e:'§72 第 2 款表：蛋白質 6.5、合成界面活性 8、水成膜 3.7 L/min·m²。水成膜（AFFF）滅火效率最高，所以要求放射量最低，水源與原液量都最省。',r:'§72②'},
{c:'D',t:'single',q:'使用「合成界面活性泡沫液」時，泡沫噴頭之每平方公尺放射量應在多少以上？',
 o:['3.7 L/min','6.5 L/min','8 L/min','20 L/min'],a:2,
 e:'§72 第 2 款表：合成界面活性泡沫液為 8 L/min·m²，是三者中最高的。',r:'§72②'},
{c:'D',t:'single',q:'§73 所稱「冠泡體積」，係指防護區域自樓地板面至何處所圍之體積？',
 o:['天花板','高出防護對象最高點 0.3 m','高出防護對象最高點 0.5 m','高出防護對象最高點 1 m'],a:2,
 e:'§73 第 1 款第 2 目：自樓地板面至「高出防護對象最高點 0.5 m」。用天花板高度計算是最常見的錯誤。',r:'§73Ⅰ①（二）'},
{c:'D',t:'single',q:'高發泡放出口在防護區域內，樓地板面積每多少至少設置一個？',
 o:['100 m²','200 m²','500 m²','1,000 m²'],a:2,
 e:'§73 第 1 款第 3 目：每 500 m² 至少 1 個，且應附設泡沫放出停止裝置。',r:'§73Ⅰ①（三）'},
{c:'D',t:'single',q:'防護對象位置距離樓地板面高度超過多少，且使用高發泡放出口時，應採全區放射方式？',
 o:['3 m','5 m','8 m','10 m'],a:1,
 e:'§73 第 1 款第 5 目：超過 5 m 時應為全區放射方式——太高的對象，局部放射的泡沫堆不上去。',r:'§73Ⅰ①（五）'},
{c:'D',t:'single',q:'高發泡局部放射時，其防護面積之計算方式為何？',
 o:['防護對象外周線外推 3 倍防護對象高度所包圍之面積，但不足 1 m 時以 1 m 計','防護對象之投影面積','防護對象外周線外推 2 m','防護區域之樓地板面積'],a:0,
 e:'§73 第 2 款第 3 目：外推「防護對象物高度之 3 倍」；但 3H 小於 1 m 時，以 1 m 計。這個 1 m 下限是為了避免矮的對象算出過小的防護面積。',r:'§73Ⅱ③'},
{c:'D',t:'single',q:'使用泡沫噴頭時，每一放射區域之樓地板面積應為多少？',
 o:['50 m² 以上 100 m² 以下','100 m² 以上 200 m² 以下','200 m² 以上','樓地板面積 1/3 以上'],a:0,
 e:'§75 第 1 款：泡沫噴頭 50～100 m²。泡水噴頭則為「占樓地板面積 1/3 以上，且至少 200 m²」（第 2 款）。放射區域的劃分方式是整個系統規模的決定因素。',r:'§75①'},
{c:'D',t:'single',q:'使用泡水噴頭時，其放射區域應如何劃定？',
 o:['每區 50～100 m²','每區至少 100 m²','占樓地板面積 1/3 以上，且至少 200 m²','占樓地板面積 1/2 以上'],a:2,
 e:'§75 第 2 款：占樓地板面積 1/3 以上且至少 200 m²；樓地板面積未達 200 m² 者依實際面積計。',r:'§75②'},
{c:'D',t:'single',q:'移動式泡沫滅火設備之水源容量，應為幾具泡沫瞄子同時放水多久之水量以上？',
 o:['2 具、15 分鐘','2 具、20 分鐘','2 具、30 分鐘','1 具、20 分鐘'],a:0,
 e:'§76 第 1 款第 3 目：2 具泡沫瞄子同時放水 15 分鐘。移動式是全部水系設備中唯一用 15 分鐘的（室外消防栓 30 分鐘是另一個例外）。',r:'§76Ⅰ③'},
{c:'D',t:'single',q:'高發泡「全區放射」時，其水源容量之計算方式為何？',
 o:['冠泡體積 × 單位水溶液量（不乘時間）','冠泡體積 × 單位放射量 × 20 分鐘','樓地板面積 × 2 L/min·m² × 20 分鐘','放射區域面積 × 單位放射量 × 20 分鐘'],a:0,
 e:'§76 第 1 款第 2 目第 1 小目：依表核算「每 1 m³ 冠泡體積之泡沫水溶液量」（第一種 0.04／第二種 0.013／第三種 0.008 m³），是體積比、不乘時間。而「局部放射」則要乘 20 分鐘。這是本節最大的分水嶺。',r:'§76Ⅰ②（1）'},
{c:'D',t:'single',q:'依 §76 第 2 項，各款計算之水溶液量還須做何種加算？',
 o:['僅加算充滿配管所需之泡沫水溶液量','僅加算 20%','加算充滿配管所需量，且加算總泡沫水溶液量之 20%','加算 50%'],a:2,
 e:'§76 第 2 項：兩次加算——加算配管充填量，再加算 20%。實務通式為 V = (V₀ + V_配管) × 1.2。漏掉這步是最常見的失分點。',r:'§76Ⅱ'},
{c:'D',t:'single',q:'固定式泡沫滅火設備之加壓送水裝置使用消防幫浦時，泡沫放射區域有 2 區域以上者，其出水量應如何計算？',
 o:['以全部放射區域出水量合計','以最大一個放射區域之最低出水量加倍計算','以最大一個放射區域之最低出水量計算','以平均值計算'],a:1,
 e:'§77 第 2 項第 1 款：最大一個放射區域之最低出水量「加倍」。若只有 1 個放射區域則不加倍。',r:'§77Ⅱ①'},
{c:'D',t:'single',q:'移動式泡沫滅火設備，同一樓層設 2 個以上泡沫消防栓箱時，幫浦出水量應在多少以上？',
 o:['100 L/min','130 L/min','200 L/min','260 L/min'],a:3,
 e:'§77 第 3 項第 1 款：1 個箱 130 L/min、2 個以上 260 L/min。注意這與 §80 的「瞄子放射量 100 L/min」是兩組不同數字——前者算幫浦、後者算水源。',r:'§77Ⅲ①'},
{c:'D',t:'single',q:'移動式泡沫滅火設備之泡沫瞄子放射壓力應在多少以上？',
 o:['1 kgf/cm²','1.7 kgf/cm²','2.5 kgf/cm²','3.5 kgf/cm²'],a:3,
 e:'§80 第 2 款：3.5 kgf/cm²（0.35 MPa）以上。而固定式的泡沫噴頭放射壓力為 1 kgf/cm² 以上（§77Ⅱ②）。',r:'§80②'},
{c:'D',t:'single',q:'依 §79，「合成界面活性泡沫液」與水混合使用之濃度為何？',
 o:['1% 或 3%','3% 或 6%','2% 或 4%','僅 3%'],a:0,
 e:'§79：蛋白質 3% 或 6%、合成界面活性 1% 或 3%、水成膜 3% 或 6%。只有合成界面活性有 1% 這個選項。',r:'§79'},
{c:'D',t:'single',q:'依 §80，移動式泡沫滅火設備之泡沫消防栓箱，其箱面表面積應在多少以上？',
 o:['0.5 m²','0.7 m²','0.8 m²','1 m²'],a:2,
 e:'§80 第 4 款：0.8 m² 以上（與室外消防栓水帶箱同）。室內消防栓箱則為 0.7 m² 以上（§35②）。',r:'§80④'},
{c:'D',t:'single',q:'泡沫原液儲槽應設置於溫度多少以下，且無日光曝曬之處？',
 o:['攝氏 30 度','攝氏 35 度','攝氏 40 度','攝氏 50 度'],a:2,
 e:'§81 第 3 款：40°C 以下且無日光曝曬。高溫與紫外線都會使泡沫原液變質、發泡性能下降。',r:'§81③'},
{c:'D',t:'multi',q:'依 §74，泡沫滅火設備之下列項目準用其他條文，請問準用了哪些條？（複選）',
 o:['§38 緊急電源','§45 竣工加壓試驗','§53 一齊開放閥','§58 加壓送水裝置'],a:[0,1,2],
 e:'§74 準用 §38、§44、§45、§51～§53。「加壓送水裝置」不在準用之列——泡沫的加壓送水裝置在 §77 自己另有規定。這是常見誤答點。',r:'§74'},
{c:'D',t:'single',q:'同一棟建築物內採用低發泡原液，分層配置固定式及移動式泡沫滅火設備而共用配管及消防幫浦時，幫浦出水量、揚程與原液儲存量應如何取值？',
 o:['兩者相加','取其中較大者','取平均值','取固定式者'],a:1,
 e:'§77 第 4 項：採其放射方式中「較大者」，不是相加。三個前提：同一棟建築物、採用低發泡、分層配置固定式及移動式。',r:'§77Ⅳ'},
{c:'D',t:'num',q:'某地下一層室內停車空間，樓地板面積 1,200 m²，採水成膜泡沫液，使用泡沫噴頭，放射區域取上限 100 m²。試求「最大一個放射區域」之放射量。',
 g:'§72：水成膜泡沫液放射量 3.7 L/min·m²。',
 a:370,u:'L/min',tol:1,
 e:'Q = 100 m² × 3.7 L/min·m² = 370 L/min。注意水源只算「最大一個放射區域」，不是全部 12 區。',r:'§72②、§75①、§76Ⅰ①'},
{c:'D',t:'num',q:'承上題（放射量 370 L/min），試求該設備之「總泡沫水溶液量」。（配管充填量不計）',
 g:'§76：泡沫頭放射時間 20 分鐘；加算配管量後再加算 20%。',
 a:8.88,u:'m³',tol:0.05,
 e:'V₀ = 370 × 20 = 7,400 L = 7.4 m³ → V = 7.4 × 1.2 = 8.88 m³。漏掉 ×1.2 就會答成 7.4，這是最常見的失分。',r:'§76'},
{c:'D',t:'num',q:'承上題（總泡沫水溶液量 8.88 m³），採水成膜泡沫液濃度 3%，試求泡沫原液儲存量。',
 g:'§78：原液儲存量依 §76 核算之水量與使用之泡沫原液濃度比核算。',
 a:266,u:'L',tol:3,
 e:'W = 8.88 m³ × 3% = 0.2664 m³ ≈ 266 L。注意要乘的是「加算後」的總量 8.88，不是加算前的 7.4——用 7.4 會少算 20%。',r:'§78、§79'},
{c:'D',t:'num',q:'某室內停車空間樓地板面積 600 m²，天花板高 4 m，防護對象（車輛）最高點 1.8 m。試求其冠泡體積。',
 g:'§73：冠泡體積 = 樓地板面積 ×（防護對象最高點 + 0.5 m）。',
 a:1380,u:'m³',tol:5,
 e:'V_c = 600 × (1.8 + 0.5) = 600 × 2.3 = 1,380 m³。用天花板高度 4 m 算會得到 2,400 m³，是錯的。',r:'§73Ⅰ①（二）'},
{c:'D',t:'num',q:'承上題（冠泡體積 1,380 m³），採第二種高發泡（膨脹比 250 以上 500 未滿）全區放射。試求「放射所需泡沫水溶液量」。（尚未加算配管量與 20%）',
 g:'§76 表：第一種 0.04、第二種 0.013、第三種 0.008 m³／每 1 m³ 冠泡體積。',
 a:17.94,u:'m³',tol:0.1,
 e:'V₀ = 1,380 × 0.013 = 17.94 m³。全區放射「不乘 20 分鐘」——它是體積比，不是時間積。加算後 V = 17.94 × 1.2 ≈ 21.53 m³。',r:'§76Ⅰ②（1）'},
{c:'D',t:'num',q:'某防護對象物長 6 m、寬 4 m、高 0.8 m，採高發泡局部放射。試求其防護面積。',
 g:'§73：防護面積為防護對象外周線外推「防護對象高度 3 倍」所包圍之面積；3 倍值小於 1 m 時以 1 m 計。',
 a:95.04,u:'m²',tol:0.5,
 e:'3H = 3 × 0.8 = 2.4 m（≥ 1，故取 2.4）。A_p = (6 + 2×2.4) × (4 + 2×2.4) = 10.8 × 8.8 = 95.04 m²。放射量 = 95.04 × 2 = 190.08 L/min。',r:'§73Ⅱ③'},
{c:'D',t:'num',q:'某防護對象物長 5 m、寬 5 m、高 0.25 m，採高發泡局部放射。試求其防護面積。',
 g:'§73：外推 3H，但 3H 小於 1 m 時以 1 m 計。',
 a:49,u:'m²',tol:0.5,
 e:'3H = 3 × 0.25 = 0.75 m < 1 m → 取 d = 1 m（不是 0.75）。A_p = (5+2) × (5+2) = 7 × 7 = 49 m²。這題就是在考 1 m 下限。',r:'§73Ⅱ③'},
{c:'D',t:'num',q:'某汽車修理廠採移動式泡沫滅火設備，同一樓層設置 3 個泡沫消防栓箱。試求其水源所需之「放射所需泡沫水溶液量」。（尚未加算配管量與 20%）',
 g:'§80：泡沫瞄子放射量 100 L/min 以上；箱數超過 2 個時以同時使用 2 支計算。§76：移動式放水 15 分鐘。',
 a:3,u:'m³',tol:0.05,
 e:'箱數 3 > 2 → 以 2 支計。V₀ = 2 × 100 L/min × 15 min = 3,000 L = 3 m³。加算後 V = 3 × 1.2 = 3.6 m³。另幫浦出水量因設 2 個以上箱體，須 ≥ 260 L/min。',r:'§76Ⅰ③、§80①'},
{c:'D',t:'num',q:'某飛機庫樓地板面積 900 m²，使用泡水噴頭。試求「一個放射區域」內應設之泡水噴頭數量。',
 g:'§71：飛機庫泡水噴頭每 8 m² 一個。§75：泡水噴頭放射區域占樓地板面積 1/3 以上且至少 200 m²。',
 a:38,u:'個',tol:0.5,
 e:'放射區域 = 900 ÷ 3 = 300 m²（≥ 200 ✓）。該區噴頭數 = 300 ÷ 8 = 37.5 → 38 個。放射量 = 38 × 75 = 2,850 L/min。',r:'§71①、§75②'},
{c:'D',t:'single',q:'某室內停車空間採高發泡全區放射，若將膨脹比由第一種提高到第三種，其所需泡沫水溶液量約變為原來的多少？',
 o:['約 1/2','約 1/5','約 2 倍','不變'],a:1,
 e:'§76 表：第一種 0.04 → 第三種 0.008，比值為 0.008/0.04 = 1/5。膨脹比越高、泡沫越蓬鬆，同樣的水能發出更多泡沫——這就是高發泡的價值。',r:'§76Ⅰ②（1）'},

/* ---------- E 二氧化碳及惰性氣體 ---------- */
{c:'E',t:'single',q:'二氧化碳滅火設備採「移動放射方式」時，皮管接頭至防護對象任一部分之水平距離應在多少以下？',
 o:['10 m','15 m','20 m','25 m'],a:1,
 e:'§82 第 1 項第 3 款：15 m 以下。與移動式泡沫滅火設備的水平距離規定（§69②）相同。',r:'§82Ⅰ③'},
{c:'E',t:'single',q:'惰性氣體滅火設備中，「IG-541」之藥劑組成為何？',
 o:['純氮氣','純氬氣','氮氣與氬氣容量比 50:50 之混合物','氮氣、氬氣及二氧化碳容量比 52:40:8 之混合物'],a:3,
 e:'§82 第 2 項：IG-100 為氮氣、IG-01 為氬氣、IG-55 為氮:氬 = 50:50、IG-541 為氮:氬:CO₂ = 52:40:8。',r:'§82Ⅱ'},
{c:'E',t:'single',q:'依 §82，惰性氣體滅火設備之放射方式為何？',
 o:['全區、局部、移動三者擇一','以全區放射方式為限','以局部放射方式為限','全區或局部擇一'],a:1,
 e:'§82 第 3 項：惰性氣體滅火設備之放射方式「以全區放射方式為限」。二氧化碳則有全區、局部、移動三種。',r:'§82Ⅲ'},
{c:'E',t:'single',q:'二氧化碳滅火設備全區放射方式，防護區域開口部原則應設自動關閉裝置。下列何種情形得免設？',
 o:['開口部面積在圍壁面積 1% 以下者','能有效補充開口部洩漏量者','設有排煙設備者','無免設規定'],a:1,
 e:'§82 第 1 項第 1 款但書：「能有效補充開口部洩漏量者，得免設自動關閉裝置」。注意惰性氣體（§82Ⅲ）沒有這個但書——開口部一律應於藥劑放射前自動關閉。',r:'§82Ⅰ①'},
{c:'E',t:'single',q:'二氧化碳滅火設備全區放射方式所需滅火藥劑量，其計算方式為何？',
 o:['防護區域體積 × 每 m³ 所需藥劑量','防護區域體積 × 每 m³ 所需藥劑量 ＋ 開口部面積 × 每 m² 追加量，且不得低於基本需要量','樓地板面積 × 13 kg/m²','假想防護空間體積 × Q'],a:1,
 e:'§83 第 1 款附表。三個要素缺一不可：體積項、開口部追加項、基本需要量下限。選項 3 是局部放射面積式，選項 4 是局部放射體積式。',r:'§83①'},
{c:'E',t:'single',q:'依 §83 附表，「電信機械室、總機室」每立方公尺防護區域所需滅火藥劑量為多少？',
 o:['0.8 kg/m³','1.0 kg/m³','1.2 kg/m³','1.33 kg/m³'],a:2,
 e:'§83 第 1 款附表：電信機械室、總機室為 1.2 kg/m³，開口部追加量 10 kg/m²。',r:'§83①'},
{c:'E',t:'single',q:'依 §83 附表，「乾式電器設備室（油浸機器除外）」未滿 50 m³ 者，每立方公尺所需滅火藥劑量為多少？',
 o:['1.0 kg/m³','1.2 kg/m³','1.6 kg/m³','2.0 kg/m³'],a:2,
 e:'§83 第 1 款附表：乾式電器設備室未滿 50 m³ 為 1.6 kg/m³（全表最高），50 m³ 以上為 1.33 kg/m³；開口部追加量 20 kg/m²（亦為全表最高）。',r:'§83①'},
{c:'E',t:'multi',q:'依 §83 附表，供「其他」場所使用時，下列敘述何者正確？（複選）',
 o:['未滿 50 m³ → 1.0 kg/m³','50 m³ 以上未滿 150 m³ → 0.9 kg/m³','150 m³ 以上未滿 1,500 m³ → 0.8 kg/m³','開口部追加量一律為 10 kg/m²'],a:[0,1,2],
 e:'其他場所的開口部追加量為 5 kg/m²。10 kg/m² 是電信機械室、總機室，20 kg/m² 是乾式電器設備室。另 1,500 m³ 以上為 0.75 kg/m³。',r:'§83①'},
{c:'E',t:'single',q:'依 §83 附表，防護區域體積 150 m³ 以上未滿 1,500 m³ 之「其他」場所，其滅火藥劑之基本需要量為多少？',
 o:['50 kg','135 kg','1,200 kg','無規定'],a:1,
 e:'§83 第 1 款附表：50／135／1,200 kg 分別對應其他場所的後三個級距。這三個數字剛好是「前一級距費率 × 該級距下界」（50 = 1.0×50、135 = 0.9×150、1,200 = 0.8×1,500），功能是補平跨級距時藥劑量反而下降的斷崖。',r:'§83①'},
{c:'E',t:'num',q:'電信機械室 10 m × 8 m × 高 3 m，開口部 2 m² 未設自動關閉裝置。試求所需滅火藥劑量。',
 g:'§83 附表：電信機械室 q = 1.2 kg/m³、開口部追加量 k = 10 kg/m²。',
 a:308,u:'kg',tol:1,
 e:'V = 10 × 8 × 3 = 240 m³。W = 240 × 1.2 + 2 × 10 = 288 + 20 = 308 kg。電信機械室無基本需要量規定，不必再比。',r:'§83①'},
{c:'E',t:'num',q:'某「其他」場所防護區域體積 150 m³，開口部全部設有自動關閉裝置。試求設計滅火藥劑量。',
 g:'§83 附表：150 m³ 以上未滿 1,500 m³ → q = 0.8 kg/m³，基本需要量 135 kg。',
 a:135,u:'kg',tol:1,
 e:'算式值 = 150 × 0.8 = 120 kg，低於基本需要量 135 kg → 取 135 kg。若體積是 149 m³ 會落在前一級距：149 × 0.9 = 134.1 kg——可見基本需要量正是用來把邊界接起來的。',r:'§83①'},
{c:'E',t:'single',q:'全區及局部放射方式，在同一建築物內有二個以上防護區域或防護對象時，所需滅火藥劑量應如何決定？',
 o:['各區域藥劑量相加','取其最大量者','取平均值','取最小量者'],a:1,
 e:'§83 第 4 款：取其最大量者。因為火災通常只發生在一個區域，藥劑可經選擇閥（§90）導向該區。',r:'§83④'},
{c:'E',t:'single',q:'局部放射方式，可燃性固體或易燃性液體存放於上方開放式容器、燃燒限於一面且可燃物無向外飛散之虞者，所需藥劑量依防護對象表面積每平方公尺以多少比例核算？',
 o:['8 kg','10 kg','13 kg','20 kg'],a:2,
 e:'§83 第 2 款第 1 目：每平方公尺 13 公斤。再乘追加倍數（高壓式 1.4、低壓式 1.1）。',r:'§83②（一）'},
{c:'E',t:'single',q:'前述面積式之表面積核算，防護對象邊長小於多少時，應以該數值計算？',
 o:['0.3 m','0.5 m','0.6 m','1 m'],a:2,
 e:'§83 第 2 款第 1 目但書：邊長小於 0.6 m 時以 0.6 m 計。同款第 2 目的「假想防護空間」也是 0.6 m，兩處數字相同。',r:'§83②（一）'},
{c:'E',t:'single',q:'局部放射方式（非上方開放式容器者）之假想防護空間單位體積滅火藥劑量 Q，其計算式為何？',
 o:['Q = 8 − 6a/A','Q = 6 − 8a/A','Q = 8 + 6a/A','Q = 13 − 6a/A'],a:0,
 e:'§83 第 2 款第 2 目。a 為防護對象周圍實存牆壁面積之合計，A 為假想防護空間牆壁面積之合計。Q 必定落在 2～8 kg/m³ 之間：a = 0 時 Q = 8，a = A 時 Q = 2。算出來不在此區間就是 a 或 A 取錯了。',r:'§83②（二）'},
{c:'E',t:'single',q:'§83 所稱「假想防護空間」，指距防護對象任一點多少範圍之空間？',
 o:['0.5 m','0.6 m','1 m','1.5 m'],a:1,
 e:'§83 第 2 款第 2 目：距防護對象任一點 0.6 m 範圍之空間。',r:'§83②（二）'},
{c:'E',t:'single',q:'局部放射方式所需滅火藥劑量之追加倍數，高壓式與低壓式分別為多少？',
 o:['高壓式 1.1、低壓式 1.4','高壓式 1.4、低壓式 1.1','高壓式 1.2、低壓式 1.35','兩者均為 1.4'],a:1,
 e:'§83 第 2 款：高壓式 1.4、低壓式 1.1。面積式與體積式共用同一組倍數。',r:'§83②'},
{c:'E',t:'num',q:'上方開放式油槽液面 1.2 m × 0.4 m，燃燒限於一面且無飛散之虞，採高壓式。試求所需滅火藥劑量。',
 g:'§83②（一）：表面積 × 13 kg/m² × 追加倍數；邊長小於 0.6 m 以 0.6 m 計；高壓式追加倍數 1.4。',
 a:13.1,u:'kg',tol:0.2,
 e:'短邊 0.4 m < 0.6 m → 以 0.6 m 計。表面積 = 1.2 × 0.6 = 0.72 m²。W = 0.72 × 13 × 1.4 = 13.10 kg。若忘記邊長修正會算成 1.2 × 0.4 × 13 × 1.4 = 8.74 kg，少了三成。',r:'§83②（一）'},
{c:'E',t:'num',q:'某局部放射之防護對象，其假想防護空間牆壁面積合計 A = 17.28 m²，防護對象周圍實存牆壁面積合計 a = 5.12 m²。試求假想防護空間單位體積滅火藥劑量 Q。',
 g:'Q = 8 − 6 × (a / A)',
 a:6.22,u:'kg/m³',tol:0.05,
 e:'a/A = 5.12 / 17.28 = 0.2963。Q = 8 − 6 × 0.2963 = 8 − 1.778 = 6.22 kg/m³，落在 2～8 區間內 ✓。再乘假想防護空間體積與追加倍數，才是所需藥劑量。',r:'§83②（二）'},
{c:'E',t:'single',q:'移動放射方式，每一具噴射瞄子所需滅火藥劑量應在多少以上？',
 o:['60 kg','75 kg','90 kg','100 kg'],a:2,
 e:'§83 第 3 款：每一具噴射瞄子 90 kg 以上。',r:'§83③'},
{c:'E',t:'single',q:'二氧化碳滅火設備移動式放射方式，每一具瞄子之藥劑放射量在溫度 20°C 時應在多少以上？',
 o:['每分鐘 45 kg','每分鐘 60 kg','每分鐘 90 kg','每分鐘 100 kg'],a:1,
 e:'§96 第 5 款：20°C 時每分鐘 60 kg 以上。注意與 §83③ 的「每具瞄子所需藥劑量 90 kg」是兩件事——90 kg ÷ 60 kg/min = 1.5 分鐘的放射時間。',r:'§96⑤'},
{c:'E',t:'multi',q:'依 §96，二氧化碳滅火設備移動式放射方式，下列敘述何者正確？（複選）',
 o:['儲存容器分設於各皮管設置處','儲存容器近旁設紅色標示燈並標明「移動式二氧化碳滅火設備」字樣','設於火災時濃煙不易籠罩之處所','儲存容器之容器閥僅能自動開啟'],a:[0,1,2],
 e:'§96 第 1 款：容器閥應「能在皮管出口處以手動開關者」，不是僅能自動開啟。移動式的設計前提就是人要靠近操作，所以第 4 款特別要求設在濃煙不易籠罩之處。',r:'§96'},
{c:'E',t:'single',q:'惰性氣體滅火設備之藥劑設計濃度，一般場所應為理論滅火濃度乘以多少安全係數以上？',
 o:['1.1 倍','1.2 倍','1.3 倍','1.35 倍'],a:1,
 e:'§83-1 第 1 款第 1 目：1.2 倍以上。含易燃液體之場所為 1.3 倍，含通電中電氣設備之場所為 1.35 倍。',r:'§83-1'},
{c:'E',t:'single',q:'惰性氣體滅火設備設於「常時有人之場所」時，藥劑最高設計濃度以多少為限？',
 o:['42%','48%','52%','60%'],a:2,
 e:'§83-1 第 1 款第 2 目：52% 為限。惰性氣體以稀釋氧氣滅火，濃度過高人員會缺氧。',r:'§83-1①（二）'},
{c:'E',t:'multi',q:'依 §83-1，關於惰性氣體設計濃度之安全係數，下列敘述何者正確？（複選）',
 o:['一般場所為理論滅火濃度 × 1.2 以上','防護對象為含易燃液體之場所時 × 1.3 以上','防護對象為含通電中電氣設備之場所時 × 1.35 以上','持續通電大於 480 伏特之電氣設備場所，一律 × 1.5'],a:[0,1,2],
 e:'§83-1 第 3 款但書：持續通電大於 480 V 之電氣設備場所，其設計濃度依「中央主管機關認可之值」核算，不是固定倍數。',r:'§83-1'},
{c:'E',t:'single',q:'惰性氣體滅火設備所需滅火藥劑量之計算公式為何？',
 o:['W = (V / S) × ln[100 / (100 − C)]','W = V × S × C','W = (V × S) / (100 − C)','W = 8 − 6a/A'],a:0,
 e:'§83-2 第 1 款。V 為防護空間淨體積（得扣除不滲透且不可移動固體之體積）、S 為防護空間最低溫度於一大氣壓下之比容積、C 為設計濃度百分比。',r:'§83-2'},
{c:'E',t:'num',q:'惰性氣體滅火設備，防護空間淨體積 200 m³、設計濃度 40%、該溫度下比容積 0.65 m³/kg。試求所需滅火藥劑量。',
 g:'W = (V / S) × ln[100 / (100 − C)]',
 a:157.2,u:'kg',tol:1.5,
 e:'W = (200 / 0.65) × ln(100/60) = 307.69 × 0.5108 = 157.2 kg。設計濃度 40% 未超過常時有人場所的 52% 上限 ✓',r:'§83-2'},
{c:'E',t:'single',q:'惰性氣體滅火設備之防護區域竣工時應做完整性測試，其合格標準為何？',
 o:['10 分鐘內之氣體洩漏量使滅火藥劑維持在設計濃度 85% 以上','30 分鐘內維持設計濃度 90% 以上','1 小時內維持設計濃度 80% 以上','無此規定'],a:0,
 e:'§96-1。這是惰性氣體滅火設備特有的竣工要求，二氧化碳滅火設備沒有對應規定。',r:'§96-1'},
{c:'E',t:'single',q:'二氧化碳滅火設備噴頭之放射壓力，高壓式與低壓式分別應達多少以上？',
 o:['高壓式 9、低壓式 14 kgf/cm²','高壓式 14、低壓式 9 kgf/cm²','高壓式 19、低壓式 14 kgf/cm²','兩者均為 14 kgf/cm²'],a:1,
 e:'§84 第 1 項第 2 款第 1 目：高壓式（常溫儲存）≥ 14 kgf/cm²（1.4 MPa）、低壓式（−18°C 以下儲存）≥ 9 kgf/cm²（0.9 MPa）。惰性氣體則為 ≥ 19 kgf/cm²（1.9 MPa）。',r:'§84Ⅰ②'},
{c:'E',t:'single',q:'二氧化碳滅火設備全區放射方式，設置於「電信機械室、總機室」者，應於多少時間內全部放射完畢？',
 o:['1 分鐘','2 分鐘','3.5 分鐘','7 分鐘'],a:2,
 e:'§84 第 1 項第 3 款附表：乾式電器設備室 7 分、電信機械室及總機室 3.5 分、其他 1 分。',r:'§84Ⅰ③'},
{c:'E',t:'single',q:'二氧化碳滅火設備全區放射方式設於「乾式電器設備室」者，除表列放射時間外，另有何要求？',
 o:['應於 1 分鐘內放射 50% 以上','應於 2 分鐘內放射 30% 以上','應於 3 分鐘內放射 60% 以上','無額外要求'],a:1,
 e:'§84 第 1 項第 3 款第 1 目：乾式電器設備室放射時間為 7 分鐘，並應於 2 分鐘內放射 30% 以上。放得慢是為了避免電氣設備熱衝擊，但初期仍要有足夠濃度。',r:'§84Ⅰ③'},
{c:'E',t:'single',q:'二氧化碳滅火設備「局部放射方式」所核算之滅火藥劑量，應於多少時間內全部放射完畢？',
 o:['30 秒','1 分鐘','2 分鐘','3.5 分鐘'],a:0,
 e:'§84 第 2 項第 3 款：30 秒內。局部放射沒有區劃可以蓄積濃度，必須瞬間覆蓋。',r:'§84Ⅱ③'},
{c:'E',t:'single',q:'惰性氣體滅火設備之滅火藥劑放射時間，於「非含易燃液體之場所」應如何規定？',
 o:['1 分鐘內放射 90% 以上','2 分鐘內放射 90% 以上','3.5 分鐘內全部放射完畢','30 秒內全部放射完畢'],a:1,
 e:'§84 第 1 項第 3 款第 2 目：含易燃液體之場所應於 1 分鐘內放射 90% 以上；其他場所應於 2 分鐘內放射 90% 以上。',r:'§84Ⅰ③'},
{c:'E',t:'single',q:'全區或局部放射方式防護區域內之通風換氣裝置，應於何時停止運轉？',
 o:['滅火藥劑放射前','滅火藥劑放射後','探測器動作後 5 分鐘','不必停止'],a:0,
 e:'§85：應在滅火藥劑放射前停止運轉。持續換氣等於一邊放藥劑一邊把它抽走。',r:'§85'},
{c:'E',t:'single',q:'二氧化碳滅火設備全區放射方式防護區域之開口部，位於距樓地板面高度多少以下部分，應在滅火藥劑放射前自動關閉？',
 o:['二分之一','三分之二','四分之三','全部高度'],a:1,
 e:'§86 第 2 款：距樓地板面高度三分之二以下部分。因為 CO₂ 比空氣重會沉積在下部，低處開口漏氣等於藥劑直接流失。',r:'§86②'},
{c:'E',t:'multi',q:'依 §86 第 3 款，不設自動關閉裝置之開口部總面積上限，下列敘述何者正確？（複選）',
 o:['供電信機械室使用時，應在圍壁面積 1% 以下','其他處所應在防護區域體積值或圍壁面積值二者中較小數值之 10% 以下','其他處所應在樓地板面積 10% 以下','圍壁面積指防護區域內牆壁、樓地板及天花板等面積之合計'],a:[0,1,3],
 e:'§86 第 3 款與第 2 項。「其他處所」比較的是防護區域「體積值」與「圍壁面積值」兩個數值的大小（單位不同、直接比數值），取較小者的 10%，不是樓地板面積。',r:'§86③'},
{c:'E',t:'single',q:'二氧化碳滅火設備全區放射方式防護區域之開口部，不得設於面對下列何種場所？',
 o:['走廊','安全梯間、特別安全梯間、緊急昇降機間或其他類似場所','廁所','機械室'],a:1,
 e:'§86 第 1 款。這些都是避難動線與消防搶救動線，CO₂ 洩入會直接危及避難人員與搶救人員。',r:'§86①'},
{c:'E',t:'single',q:'二氧化碳滅火設備儲存容器之充填比，高壓式與低壓式分別為何？',
 o:['高壓式 1.1 以上 1.4 以下、低壓式 1.5 以上 1.9 以下','高壓式 1.5 以上 1.9 以下、低壓式 1.1 以上 1.4 以下','兩者均為 1.5 以上 1.9 以下','兩者均為 1.1 以上 1.4 以下'],a:1,
 e:'§87 第 1 項第 1 款第 1 目：高壓式 1.5～1.9、低壓式 1.1～1.4。惰性氣體則規定充填壓力，於 15°C 時應在 300 kgf/cm²（30 MPa）以下。',r:'§87Ⅰ①'},
{c:'E',t:'single',q:'§87 所稱「充填比」，指下列何者之比值？',
 o:['容器內容積（公升）與液化氣體重量（公斤）','液化氣體重量與容器內容積','容器重量與滅火藥劑重量','防護區域體積與滅火藥劑量'],a:0,
 e:'§87 第 2 項：容器內容積（L）÷ 液化氣體重量（kg）。比值越小代表裝得越滿——低壓式（1.1～1.4）比高壓式（1.5～1.9）密實，因為它靠低溫維持液態，不需要那麼大的氣相空間。',r:'§87Ⅱ'},
{c:'E',t:'single',q:'二氧化碳及惰性氣體滅火設備之滅火藥劑儲存容器，應設置於溫度多少以下之場所？',
 o:['攝氏 30 度','攝氏 35 度','攝氏 40 度','攝氏 50 度'],a:2,
 e:'§87 第 1 項第 2 款：置於防護區域「外」、溫度 40°C 以下且溫度變化較少處、不得置於有日光曝曬或雨水淋濕之處。40°C 這個數字與泡沫原液儲槽（§81③）相同。',r:'§87Ⅰ②'},
{c:'E',t:'single',q:'低壓式二氧化碳滅火設備儲存容器應設置自動冷凍機，使容器內部溫度維持在何範圍？',
 o:['攝氏零下 20 度以上、零下 18 度以下','攝氏零下 30 度以上、零下 20 度以下','攝氏零下 18 度以上、0 度以下','攝氏 0 度以上、40 度以下'],a:0,
 e:'§87 第 1 項第 6 款：−20°C 以上 −18°C 以下。低壓式就是靠這個溫度把 CO₂ 維持在液態。',r:'§87Ⅰ⑥'},
{c:'E',t:'single',q:'低壓式二氧化碳滅火設備儲存容器之壓力警報裝置，應在何種壓力時發出警報？',
 o:['23 kgf/cm² 以上或 19 kgf/cm² 以下','19 kgf/cm² 以上或 14 kgf/cm² 以下','30 kgf/cm² 以上或 20 kgf/cm² 以下','僅在超壓時發出警報'],a:0,
 e:'§87 第 1 項第 5 款：壓力在 23 kgf/cm²（2.3 MPa）以上，或 19 kgf/cm²（1.9 MPa）以下時發出警報。上下限都要警報——壓力過低代表冷凍機失效或藥劑洩漏。',r:'§87Ⅰ⑤'},
{c:'E',t:'single',q:'容器閥使用電磁閥直接開啟時，同時開啟之儲存容器數在幾支以上者，該儲存容器應設 2 個以上之電磁閥？',
 o:['5 支','7 支','10 支','15 支'],a:1,
 e:'§87 第 1 項第 7 款第 2 目：7 支以上者應設 2 個以上電磁閥，避免單一電磁閥失效導致整組無法動作。',r:'§87Ⅰ⑦'},
{c:'E',t:'multi',q:'依 §88，二氧化碳及惰性氣體滅火設備使用氣體啟動者，下列敘述何者正確？（複選）',
 o:['啟動用氣體容器能耐 250 kgf/cm² 之壓力','啟動用氣體容器之內容積應有 1 公升以上','所儲存之二氧化碳重量在 0.6 公斤以上，且充填比在 1.5 以上','啟動用氣體容器得兼供防護區域之自動關閉裝置使用'],a:[0,1,2],
 e:'§88 第 4 款明文規定「啟動用氣體容器不得兼供防護區域之自動關閉裝置使用」——兼用會使啟動氣體不足，導致容器閥開不了。',r:'§88'},
{c:'E',t:'single',q:'二氧化碳及惰性氣體滅火設備之配管，最低配管與最高配管間之落差應在多少以下？',
 o:['20 m','30 m','50 m','100 m'],a:2,
 e:'§89 第 1 項第 2 款：依流量計算配置，並在 50 m 以下。落差過大會使各噴頭壓力差異過大。',r:'§89Ⅰ②'},
{c:'E',t:'single',q:'二氧化碳滅火設備之手動啟動裝置，應設於何處？',
 o:['防護區域內明顯處','能看清區域內部且操作後能容易退避之防護區域外','消防機關指定之處所','防災中心內'],a:1,
 e:'§91 第 1 項第 1 款第 1 目。CO₂ 對人致命，操作者必須既看得到區域內狀況、又能立刻退避。同款另規定操作部高度 0.8～1.5 m、外殼漆紅色、設透明保護裝置、操作時同時發出警報音響。',r:'§91Ⅰ①'},
{c:'E',t:'single',q:'二氧化碳滅火設備之自動啟動裝置，應與幾回路以上之火警探測器感應連動啟動？',
 o:['一回路','二回路','三回路','無規定'],a:1,
 e:'§91 第 1 項第 2 款：二回路以上。避免單一探測器誤報就放射致命氣體，這是交叉驗證的設計。',r:'§91Ⅰ②'},
{c:'E',t:'single',q:'二氧化碳滅火設備之自動、手動切換裝置，其切換方式為何？',
 o:['一般開關即可切換','必須以鑰匙或拉桿操作始能切換','僅能由消防機關切換','不得切換'],a:1,
 e:'§91 第 2 項第 3 款：必須以鑰匙或拉桿操作始能切換，並設自動及手動之表示燈、於近旁標明操作方法。防止誤觸。',r:'§91Ⅱ'},
{c:'E',t:'single',q:'二氧化碳滅火設備設於全區放射方式之音響警報裝置，應採何種方式？',
 o:['電鈴','蜂鳴器','人語發音','閃光警示'],a:2,
 e:'§92 第 3 款：全區放射方式採人語發音（平時無人駐守者除外）。另第 1 款規定藥劑未全部放射前不得中斷警報。',r:'§92'},
{c:'E',t:'single',q:'二氧化碳滅火設備全區放射方式，自啟動裝置開關或拉桿開始動作至儲存容器之容器閥開啟，應設多久以上之遲延裝置？',
 o:['10 秒','20 秒','30 秒','60 秒'],a:1,
 e:'§93 第 1 項第 1 款：20 秒以上。這段時間是給防護區域內人員退避用的，是整套 CO₂ 設備最關鍵的安全設計。同項第 2 款另規定採手動啟動時，延遲時間內滅火藥劑不得放射。',r:'§93Ⅰ①'},
{c:'E',t:'multi',q:'依 §94，全區或局部放射方式防護區域對已放射滅火藥劑之排放，下列敘述何者正確？（複選）',
 o:['應於 1 小時內將藥劑排出','採機械排放時，排風機為專用且具有每小時 5 次之換氣量','採自然排放時，開口部大小應占防護區域樓地板面積 10% 以上','排放裝置之操作開關應設於防護區域內便於操作處'],a:[0,1,2],
 e:'§94 第 2 款：操作開關須設於防護區域「外」便於操作處，且附近設有標示。人不能為了排放而走進充滿 CO₂ 的區域。',r:'§94'},
{c:'E',t:'single',q:'二氧化碳滅火設備全區及局部放射方式之緊急電源，其容量應能使該設備有效動作多久以上？',
 o:['10 分鐘','30 分鐘','1 小時','2 小時'],a:2,
 e:'§95：1 小時以上，是全部滅火設備中最長的。水系設備（室內外消防栓、自動撒水、水霧、泡沫）皆為 30 分鐘（§38），火警自動警報為 10 分鐘（§128）。',r:'§95'},

/* ---------- F 乾粉滅火設備及簡易自動滅火設備 ---------- */
{c:'F',t:'single',q:'依 §98，乾粉滅火設備之放射方式、開口部、啟動裝置、緊急電源等準用二氧化碳滅火設備之規定。下列何者「不在」準用之列？',
 o:['第八十二條（放射方式）','第八十六條（防護區域之開口部）','第九十四條（滅火藥劑之排放）','第九十五條（緊急電源）'],a:2,
 e:'§98 準用 §82、§85、§86、§90～§93、§95、§97。§94（排放）不在其中——乾粉是固體粉末，不像 CO₂ 會滯留成窒息性氣體。另 §87～§89（儲存容器、啟動用氣體、配管）也不準用，乾粉自己有 §102、§110、§105。',r:'§98'},
{c:'F',t:'single',q:'乾粉滅火設備之緊急電源，其容量應能使該設備有效動作多久以上？',
 o:['10 分鐘','30 分鐘','1 小時','2 小時'],a:2,
 e:'§98 準用 §95：1 小時以上，與二氧化碳滅火設備相同。水系設備（消防栓、撒水、水霧、泡沫）則為 30 分鐘。',r:'§98'},
{c:'F',t:'single',q:'依 §99 附表，使用「第一種乾粉」全區放射時，每立方公尺防護區域所需滅火藥劑量為多少？',
 o:['0.24 kg/m³','0.36 kg/m³','0.6 kg/m³','0.8 kg/m³'],a:2,
 e:'§99 第 1 款附表：第一種 0.6、第二種 0.36、第三種 0.36、第四種 0.24 kg/m³；開口部追加量分別為 4.5、2.7、2.7、1.8 kg/m²。第四種效率最高、用量最省。',r:'§99①'},
{c:'F',t:'multi',q:'關於乾粉滅火藥劑之主成份，下列敘述何者正確？（複選）',
 o:['第一種乾粉主成份為碳酸氫鈉','第二種乾粉主成份為碳酸氫鉀','第三種乾粉主成份為磷酸二氫銨','第四種乾粉主成份為碳酸氫鈉及尿素化合物'],a:[0,1,2],
 e:'§99 第 1 款附表：第四種乾粉主成份為「碳酸氫鉀及尿素化合物」，不是碳酸氫鈉。第三種（磷酸二氫銨）即一般所稱 ABC 乾粉。',r:'§99①'},
{c:'F',t:'single',q:'依 §99 附表，使用第二種或第三種乾粉全區放射時，每平方公尺開口部所需追加滅火藥劑量為多少？',
 o:['1.8 kg/m²','2.7 kg/m²','4.5 kg/m²','5.2 kg/m²'],a:1,
 e:'§99 第 1 款附表：第一種 4.5、第二種及第三種 2.7、第四種 1.8 kg/m²。開口部追加量剛好都是「每 m³ 藥劑量」的 7.5 倍。',r:'§99①'},
{c:'F',t:'single',q:'乾粉滅火設備全區放射方式之藥劑量計算，與二氧化碳滅火設備最大的差異為何？',
 o:['乾粉不必計算開口部追加量','乾粉沒有「滅火藥劑基本需要量」的下限規定','乾粉不必區分藥劑種類','乾粉不必乘防護區域體積'],a:1,
 e:'二氧化碳的 §83 附表有 50／135／1,200 kg 的基本需要量下限，乾粉的 §99 附表只有「每 m³」與「每 m² 開口部」兩列，算完就是答案，沒有下限要比。',r:'§99①'},
{c:'F',t:'num',q:'某室內停車空間防護區域體積 500 m³，開口部 3 m² 未設自動關閉裝置，採用第三種乾粉全區放射。試求所需滅火藥劑量。',
 g:'§99 附表：第三種乾粉 0.36 kg/m³、開口部追加量 2.7 kg/m²。',
 a:188.1,u:'kg',tol:0.5,
 e:'W = 500 × 0.36 + 3 × 2.7 = 180 + 8.1 = 188.1 kg。乾粉沒有基本需要量下限，不必再比。',r:'§99①'},
{c:'F',t:'single',q:'依 §99，局部放射方式（上方開放式容器、燃燒限於一面且無飛散之虞）使用第一種乾粉時，防護對象每平方公尺表面積所需滅火藥劑量為多少？',
 o:['3.6 kg','5.2 kg','8.8 kg','13 kg'],a:2,
 e:'§99 第 2 款第 1 目附表：第一種 8.8、第二種或第三種 5.2、第四種 3.6 kg/m²。13 kg/m² 是二氧化碳（§83②（一）），兩者常被混。',r:'§99②（一）'},
{c:'F',t:'single',q:'乾粉滅火設備局部放射方式之追加倍數為多少？',
 o:['不分藥劑種類一律 1.1','第一種 1.4、其餘 1.1','高壓式 1.4、低壓式 1.1','不分藥劑種類一律 1.4'],a:0,
 e:'§99 第 2 款附表：追加倍數一律 1.1。二氧化碳則依儲存方式區分——高壓式 1.4、低壓式 1.1（§83②）。',r:'§99②（一）'},
{c:'F',t:'single',q:'乾粉局部放射面積式之表面積核算，防護對象物之邊長在多少以下時，以該數值計？',
 o:['0.3 m','0.5 m','0.6 m','1 m'],a:2,
 e:'§99 第 2 款第 1 目附表備考：邊長在 0.6 m 以下時以 0.6 m 計。與二氧化碳（§83②（一））相同。',r:'§99②（一）'},
{c:'F',t:'num',q:'上方開放式容器液面 1.0 m × 0.5 m，燃燒限於一面且可燃物無向外飛散之虞，採第一種乾粉局部放射。試求所需滅火藥劑量。',
 g:'§99②（一）：第一種乾粉 8.8 kg/m²，追加倍數 1.1；防護對象物邊長在 0.6 m 以下者以 0.6 m 計。',
 a:5.81,u:'kg',tol:0.1,
 e:'短邊 0.5 m ≤ 0.6 m → 以 0.6 m 計。表面積 = 1.0 × 0.6 = 0.6 m²。W = 0.6 × 8.8 × 1.1 = 5.81 kg。忘記邊長修正會算成 1.0 × 0.5 × 8.8 × 1.1 = 4.84 kg。',r:'§99②（一）'},
{c:'F',t:'single',q:'乾粉滅火設備局部放射方式（非上方開放式容器者）之假想防護空間單位體積滅火藥劑量 Q，其計算式為何？',
 o:['Q = X − Y × a/A','Q = 8 − 6a/A','Q = X + Y × a/A','Q = Y − X × a/A'],a:0,
 e:'§99 第 2 款第 2 目。X、Y 值依藥劑種類而異：第一種 X=5.2 Y=3.9、第二種或第三種 X=3.2 Y=2.4、第四種 X=2.0 Y=1.5。二氧化碳則是固定的 Q = 8 − 6a/A（§83②（二））。',r:'§99②（二）'},
{c:'F',t:'multi',q:'依 §99，關於乾粉局部放射體積式之 X、Y 值，下列敘述何者正確？（複選）',
 o:['第一種乾粉 X = 5.2、Y = 3.9','第二種或第三種乾粉 X = 3.2、Y = 2.4','第四種乾粉 X = 2.0、Y = 1.5','各種乾粉之 X、Y 值均相同'],a:[0,1,2],
 e:'§99 第 2 款第 2 目附表。X 是「完全無牆」時的單位體積藥劑量，Y 是牆壁包圍的折減斜率。',r:'§99②（二）'},
{c:'F',t:'single',q:'乾粉滅火設備局部放射方式（體積式），供「電信機器室」使用者，所核算出之滅火藥劑量須再乘以多少？',
 o:['0.5','0.7','1.1','1.4'],a:1,
 e:'§99 第 2 款第 2 目但書：供電信機器室使用者，核算出之滅火藥劑量須乘以 0.7。這是乾粉特有的折減規定，二氧化碳沒有對應條文。',r:'§99②（二）'},
{c:'F',t:'num',q:'某局部放射防護對象採第二種乾粉，其防護對象周圍實存牆壁面積與假想防護空間牆壁面積之比 a/A = 0.25。試求假想防護空間單位體積滅火藥劑量 Q。',
 g:'Q = X − Y × (a / A)；第二種乾粉 X = 3.2、Y = 2.4。',
 a:2.6,u:'kg/m³',tol:0.05,
 e:'Q = 3.2 − 2.4 × 0.25 = 3.2 − 0.6 = 2.6 kg/m³。再乘假想防護空間體積與追加倍數 1.1，才是所需藥劑量。',r:'§99②（二）'},
{c:'F',t:'num',q:'某電信機器室採乾粉局部放射方式（體積式），依 Q 值與假想防護空間體積核算出滅火藥劑量為 200 kg。試求最終應設之滅火藥劑量。',
 g:'§99②（二）但書：供電信機器室使用者，所核算出之滅火藥劑量須乘以 0.7。',
 a:140,u:'kg',tol:1,
 e:'200 × 0.7 = 140 kg。注意這個 0.7 是「折減」，方向與追加倍數 1.1 相反，兩者不要弄混。',r:'§99②（二）'},
{c:'F',t:'single',q:'依 §99，移動放射方式使用第一種乾粉時，每一具噴射瞄子所需滅火藥劑量應在多少以上？',
 o:['20 kg','30 kg','50 kg','90 kg'],a:2,
 e:'§99 第 3 款附表：第一種 50、第二種或第三種 30、第四種 20 kg。90 kg 是二氧化碳（§83③）。',r:'§99③'},
{c:'F',t:'single',q:'依 §111，移動式乾粉滅火設備使用第一種乾粉時，每一具噴射瞄子每分鐘之藥劑放射量應為多少？',
 o:['18 kg/min','27 kg/min','45 kg/min','60 kg/min'],a:2,
 e:'§111 第 5 款附表：第一種 45、第二種或第三種 27、第四種 18 kg/min。60 kg/min 是二氧化碳（§96⑤）。與 §99③ 的「所需藥劑量」（50／30／20 kg）是兩組不同數字。',r:'§111⑤'},
{c:'F',t:'single',q:'乾粉滅火設備全區及局部放射方式，同一建築物內有二個以上防護區域或防護對象時，所需滅火藥劑量應如何決定？',
 o:['各區域藥劑量相加','取其最大量者','取平均值','取最小量者'],a:1,
 e:'§99 第 4 款：取其最大量者。與二氧化碳（§83④）相同。',r:'§99④'},
{c:'F',t:'single',q:'乾粉噴頭之放射壓力應在多少以上？',
 o:['每平方公分 1 公斤（0.1 MPa）','每平方公分 9 公斤','每平方公分 14 公斤','每平方公分 19 公斤'],a:0,
 e:'§100 第 2 款：1 kgf/cm²（0.1 MPa）以上。二氧化碳為高壓式 14、低壓式 9 kgf/cm²，惰性氣體 19 kgf/cm²——乾粉的放射壓力要求低得多。',r:'§100②'},
{c:'F',t:'single',q:'乾粉滅火設備「全區放射方式」與「局部放射方式」所核算之滅火藥劑量，應於多少時間內全部放射完畢？',
 o:['30 秒','1 分鐘','3.5 分鐘','7 分鐘'],a:0,
 e:'§100 第 3 款：全區與局部「都」是 30 秒內全部放射完畢。二氧化碳則是全區依場所 1／3.5／7 分鐘、局部才 30 秒——這是兩者最容易混淆的地方。',r:'§100③'},
{c:'F',t:'single',q:'供「室內停車空間」使用之乾粉滅火藥劑，以何者為限？',
 o:['第一種乾粉','第二種乾粉','第三種乾粉','第四種乾粉'],a:2,
 e:'§101 明文規定以第三種乾粉（主成份磷酸二氫銨，即 ABC 乾粉）為限。因為停車空間可能同時發生 A 類（座椅內裝）與 B 類（油料）火災。',r:'§101'},
{c:'F',t:'multi',q:'依 §102，關於乾粉滅火藥劑儲存容器之充填比，下列敘述何者正確？（複選）',
 o:['第一種乾粉為 0.85 以上 1.45 以下','第二種或第三種乾粉為 1.05 以上 1.75 以下','第四種乾粉為 1.5 以上 2.5 以下','各種乾粉之充填比均相同'],a:[0,1,2],
 e:'§102 第 1 款附表。乾粉依「藥劑種類」區分充填比；二氧化碳則依「儲存方式」區分——高壓式 1.5～1.9、低壓式 1.1～1.4（§87Ⅰ①）。',r:'§102①'},
{c:'F',t:'single',q:'乾粉滅火藥劑儲存容器之設置場所，應符合下列何項規定？',
 o:['置於防護區域內便於操作處','置於防護區域外、溫度攝氏 40 度以下且溫度變化較少處、不得有日光曝曬或雨水淋濕','置於防護區域外、溫度攝氏 50 度以下','無特別規定'],a:1,
 e:'§102 第 2 款。40°C 這個數字與二氧化碳儲存容器（§87Ⅰ②）、泡沫原液儲槽（§81③）、簡易自動滅火設備鋼瓶（§111-1⑤）完全一致。',r:'§102②'},
{c:'F',t:'multi',q:'依 §102，乾粉滅火藥劑儲存容器應於明顯處所標示下列何者？（複選）',
 o:['充填藥劑量','滅火藥劑種類','最高使用壓力（限於加壓式）','防護區域樓地板面積'],a:[0,1,2],
 e:'§102 第 3 款：充填藥劑量、滅火藥劑種類、最高使用壓力（限加壓式）、製造年限及製造廠商。',r:'§102③'},
{c:'F',t:'single',q:'蓄壓式儲存容器，內壓在多少以上者，應設置符合 CNS 規定之容器閥？',
 o:['每平方公分 10 公斤（1 MPa）','每平方公分 25 公斤','每平方公分 42 公斤','每平方公分 250 公斤'],a:0,
 e:'§102 第 5 款：內壓在 10 kgf/cm²（1 MPa）以上者設容器閥。',r:'§102⑤'},
{c:'F',t:'single',q:'依 §102，乾粉滅火藥劑儲存容器應設置下列何種裝置？',
 o:['為排除殘留氣體設排出裝置，為處理配管殘留藥劑設清洗裝置','僅需設排出裝置','僅需設清洗裝置','兩者皆免設'],a:0,
 e:'§102 第 6 款。乾粉是固體粉末，殘留在配管內受潮會結塊阻塞，所以特別要求清洗裝置——這是氣體系統沒有的需求。',r:'§102⑥'},
{c:'F',t:'single',q:'乾粉滅火設備之加壓或蓄壓用氣體，應使用何者？',

/* ===== 圖解連動 =====
   依題目的條號自動歸段，答錯（或答對）時在解析區帶出對應圖解段落的連結。
   目前有兩份圖解：D 泡沫設備、E 二氧化碳設備。 */
const DOCS = {
  D: { file:'04a-%E6%B3%A1%E6%B2%AB%E8%A8%AD%E5%82%99-%E5%9C%96%E8%A7%A3.html',
       name:'泡沫設備圖解',
       secs:{ paths:'01 四條計算路徑', volume:'02 冠泡體積與高發泡',
              area:'03 局部放射防護面積', zone:'04 放射區域與噴頭配置',
              mobile:'05 移動式配置', calc:'06 計算流程（加算與原液量）',
              system:'07 系統組成與 §74 準用' } },
  E: { file:'06-%E4%BA%8C%E6%B0%A7%E5%8C%96%E7%A2%B3%E8%A8%AD%E5%82%99-%E5%9C%96%E8%A7%A3.html',
       name:'二氧化碳設備圖解',
       secs:{ modes:'01 三種放射方式', agent:'02 全區放射藥劑量',
              opening:'03 開口部規定', local:'04 局部放射',
              inert:'05 惰性氣體', timing:'06 放射時序與安全',
              system:'07 系統組成' } }
};
const DGRULES = {
  D: [
    [/§76Ⅰ③|§77Ⅲ|§80/, 'mobile'],
    [/§73Ⅱ/,            'area'],
    [/§73Ⅰ|§76Ⅰ②/,     'volume'],
    [/§74|§77Ⅳ|§81/,    'system'],
    [/§76Ⅱ|§77Ⅱ|§78|§79|^§76$/, 'calc'],
    [/§71|§72|§75/,      'zone'],
    [/§69|§70/,          'paths'],
    [/§73/,              'volume']
  ],
  E: [
    [/§83-1|§83-2|§96-1/,                     'inert'],
    [/§86/,                                    'opening'],
    [/§83②/,                                   'local'],
    [/§83①|§83④/,                              'agent'],
    [/§84Ⅰ③|§84Ⅱ③|§85|§91|§92|§93|§94|§95/,  'timing'],
    [/§84Ⅰ②|§87|§88|§89|§90/,                 'system'],
    [/§82|§83③|§96/,                           'modes']
  ]
};
Q.forEach(q=>{
  const rules = DGRULES[q.c]; if(!rules) return;
  for(const [re,k] of rules){ if(re.test(q.r)){ q.dg = q.c + ':' + k; break; } }
});
/* 同時帶 ?s= 與 #：一般瀏覽器用 fragment 定位，
   會剝掉 fragment 的檢視環境則由 query 參數接手。 */
const dgLink = (tag, cls) => {
  const [c,k] = tag.split(':'), d = DOCS[c];
  return `<a class="${cls||'dgl'}" href="${d.file}?s=${k}#${k}" target="_blank" rel="noopener">📐 看圖解　${d.secs[k]}</a>`;
};

/* ========== 邏輯 ========== */
const $ = id => document.getElementById(id);
let sel = new Set(CATS.map(c=>c.k)), list = [], i = 0, answered = false, wrong = [], score = 0;

// 建立類別卡
$('cats').innerHTML = CATS.map(c=>{
  const n = Q.filter(q=>q.c===c.k).length;
  return `<label class="cat"><input type="checkbox" value="${c.k}" checked>
    <span><span class="t">${c.n}　<span style="color:var(--muted);font-weight:400">${n} 題</span></span>
    <span class="d">${c.d}</span></span></label>`;
}).join('');
$('cats').addEventListener('change', e=>{
  if(e.target.checked) sel.add(e.target.value); else sel.delete(e.target.value);
  pool();
});
function pool(){
  const n = Q.filter(q=>sel.has(q.c)).length;
  $('pool').textContent = `目前範圍共 ${n} 題`;
  $('start').disabled = n===0;
}
pool();

const shuf = a => { for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]];} return a; };

function begin(src){
  list = src || Q.filter(q=>sel.has(q.c));
  if(!src){
    if($('ord').value==='1') list = shuf([...list]); else list = [...list];
    const n = parseInt($('cnt').value,10);
    if(n>0) list = list.slice(0,n);
  }
  i=0; score=0; wrong=[];
  $('setup').classList.add('hide'); $('result').classList.add('hide'); $('quiz').classList.remove('hide');
  render();
}

function render(){
  answered=false;
  const q = list[i];
  $('prog').style.width = (i/list.length*100)+'%';
  $('pos').textContent = `第 ${i+1} / ${list.length} 題　·　${CATS.find(c=>c.k===q.c).n}`;
  $('live').textContent = `答對 ${score}`;
  const tg = $('tag');
  tg.className='tag'+(q.t==='multi'?' multi':q.t==='num'?' num':'');
  tg.textContent = q.t==='multi'?'複選題':q.t==='num'?'計算題':'單選題';
  $('qtext').innerHTML = q.q + (q.g?`<span class="given">已知：${q.g}</span>`:'');
  $('fb').className='fb hide';
  $('next').classList.add('hide');
  $('submit').classList.remove('hide'); $('submit').disabled=false;

  if(q.t==='num'){
    $('opts').classList.add('hide'); $('numin').classList.remove('hide');
    $('numval').value=''; $('numval').disabled=false; $('numunit').textContent=q.u;
    $('kbhint').textContent='Enter 送出';
    setTimeout(()=>$('numval').focus(),30);
  } else {
    $('numin').classList.add('hide'); $('opts').classList.remove('hide');
    const type = q.t==='multi'?'checkbox':'radio';
    $('opts').innerHTML = q.o.map((o,k)=>
      `<label class="opt" data-k="${k}"><input type="${type}" name="o" value="${k}"><span>${o}</span><span class="mk"></span></label>`).join('');
    $('opts').querySelectorAll('.opt').forEach(el=>{
      el.addEventListener('click',()=>{ if(answered) return;
        setTimeout(()=>$('opts').querySelectorAll('.opt').forEach(x=>
          x.classList.toggle('sel', x.querySelector('input').checked)),0);
      });
    });
    $('kbhint').textContent = q.t==='multi'?'數字鍵 1-4 勾選，Enter 送出':'數字鍵 1-4 作答';
  }
}

function check(){
  if(answered) return;
  const q = list[i]; let ok=false, given;

  if(q.t==='num'){
    const raw = $('numval').value.trim().replace(/[,，\s]/g,'');
    if(raw==='') return;
    const v = parseFloat(raw);
    if(isNaN(v)) return;
    given = v; ok = Math.abs(v - q.a) <= (q.tol ?? 0.01);
    $('numval').disabled=true;
  } else {
    const picked = [...$('opts').querySelectorAll('input:checked')].map(x=>+x.value).sort();
    if(!picked.length) return;
    given = picked;
    const ans = (q.t==='multi'? [...q.a].sort() : [q.a]);
    ok = picked.length===ans.length && picked.every((v,k)=>v===ans[k]);
    $('opts').querySelectorAll('.opt').forEach(el=>{
      const k=+el.dataset.k, isAns = ans.includes(k), isPick = picked.includes(k);
      el.classList.remove('sel');
      el.querySelector('input').disabled=true;
      if(isAns){ el.classList.add('right'); el.querySelector('.mk').textContent='✓'; }
      else if(isPick){ el.classList.add('wrong'); el.querySelector('.mk').textContent='✕'; }
    });
  }

  answered=true;
  if(ok) score++;
  else wrong.push({q, given});

  const ansTxt = q.t==='num' ? `${q.a} ${q.u}`
    : q.t==='multi' ? q.a.map(k=>q.o[k]).join('、') : q.o[q.a];
  const fb = $('fb');
  fb.className = 'fb '+(ok?'ok':'no');
  fb.innerHTML = `<div class="hd">${ok?'✓ 答對':'✕ 答錯'}</div>`
    + (ok?'':`<div style="margin-bottom:6px">正確答案：<b>${ansTxt}</b>`
        + (q.t==='num'?`　你的答案：${given} ${q.u}`:'')+`</div>`)
    + `<div>${q.e}</div><span class="ref">${q.r}</span>`
    + (q.dg ? dgLink(q.dg) : '');
  $('submit').classList.add('hide');
  $('next').classList.remove('hide');
  $('next').textContent = (i===list.length-1)?'看結果 →':'下一題 →';
  $('next').focus();
  $('live').textContent = `答對 ${score}`;
}

function next(){
  if(i < list.length-1){ i++; render(); } else finish();
}

function finish(){
  $('quiz').classList.add('hide'); $('result').classList.remove('hide');
  const done = i + (answered?1:0);
  const pct = done? Math.round(score/done*100):0;
  $('pct').textContent = pct+'%';
  $('scoretxt').textContent = `${done} 題中答對 ${score} 題`
    + (pct>=90?'　·　條號與數字掌握得很紮實':pct>=70?'　·　主幹沒問題，把錯題的數字補起來':'　·　建議回頭把該章節的速記表再過一遍');
  // 分類統計
  const stat={};
  list.slice(0,done).forEach(q=>{ stat[q.c]=stat[q.c]||{t:0,w:0}; stat[q.c].t++; });
  wrong.forEach(w=>{ stat[w.q.c].w++; });
  $('bd').innerHTML = Object.keys(stat).map(k=>{
    const s=stat[k], r=s.t-s.w;
    return `<div class="r"><span>${CATS.find(c=>c.k===k).n}</span>
      <span><b style="color:${r===s.t?'var(--ok)':'var(--fg)'}">${r} / ${s.t}</b>
      <span style="color:var(--muted)">（${Math.round(r/s.t*100)}%）</span></span></div>`;
  }).join('');
  $('redo').disabled = wrong.length===0;

  // 依錯題自動推薦該複習的圖解段落
  const need = [...new Set(wrong.map(w=>w.q.dg).filter(Boolean))];
  const perfect = Object.keys(DOCS).filter(c => stat[c] && !wrong.some(w=>w.q.c===c));
  let rev = '';
  if(need.length){
    rev = `<div class="rev"><div class="h">📐 建議複習這幾張圖</div>
      <div class="s">答錯的題目集中在下列觀念，點開圖解對照一次，比重看條文有效率。</div>
      <div class="lks">${need.map(k=>dgLink(k,'btn')).join('')}</div></div>`;
  } else if(perfect.length){
    rev = `<div class="rev" style="background:var(--f3);border-color:var(--ok)">
      <div class="h" style="color:var(--ok)">✓ ${perfect.map(c=>CATS.find(x=>x.k===c).n).join('、')} 全數答對</div>
      <div class="s" style="margin:0">計算路徑掌握住了，可以到速查數字卡做最後確認：
      ${perfect.map(c=>`<a href="${DOCS[c].file}?s=card#card" target="_blank" rel="noopener">${DOCS[c].name}</a>`).join('　／　')}</div></div>`;
  }

  $('wl').innerHTML = rev + (wrong.length? '<h2>錯題回顧</h2>' + wrong.map(w=>{
    const q=w.q;
    const a = q.t==='num'?`${q.a} ${q.u}`:q.t==='multi'?q.a.map(k=>q.o[k]).join('、'):q.o[q.a];
    return `<div class="wq"><div class="q">${q.q}</div>
      <div class="a">正解：${a}</div><div class="m">${q.e}　<b>${q.r}</b></div>
      ${q.dg?dgLink(q.dg):''}</div>`;
  }).join('') : '');
}

$('start').onclick = ()=>begin();
$('submit').onclick = check;
$('next').onclick = next;
$('quit').onclick = finish;
$('again').onclick = ()=>begin();
$('redo').onclick = ()=>begin(shuf(wrong.map(w=>w.q)));
$('home').onclick = ()=>{ $('result').classList.add('hide'); $('setup').classList.remove('hide'); };

document.addEventListener('keydown', e=>{
  if($('quiz').classList.contains('hide')) return;
  const q = list[i];
  if(e.key==='Enter'){ e.preventDefault(); answered?next():check(); return; }
  if(answered || q.t==='num') return;
  const n = parseInt(e.key,10);
  if(n>=1 && n<=q.o.length){
    e.preventDefault();
    const el = $('opts').querySelector(`.opt[data-k="${n-1}"]`), inp = el.querySelector('input');
    if(q.t==='multi'){ inp.checked=!inp.checked; el.classList.toggle('sel',inp.checked); }
    else { inp.checked=true; $('opts').querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===el)); check(); }
  }
});
</script>
</body>
</html>
