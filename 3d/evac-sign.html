<body>
<script type="module">
import { createAnim } from './engine.js?v=2026111905';

createAnim({
  title: '出口標示燈・避難方向指示燈・緊急照明',
  page: '19-%E6%A8%99%E7%A4%BA%E8%A8%AD%E5%82%99-%E5%9C%96%E8%A7%A3.html',
  kind: 'notes',
  steps: [
    {t:'停電、濃煙中怎麼找到出口', d:'一層樓的居室、L 形走廊與直通樓梯。停電後靠標示設備指路、緊急照明照亮地面。', tip:'§146～§156 標示設備；§175～§179 緊急照明。'},
    {t:'出口標示燈：設在出入口上方', d:'出口標示燈設於通往戶外、通往直通樓梯的出入口，以及由室內往走廊的出入口上方或其緊鄰處。', tip:'§146-3 第 1 項：①通往戶外 ②通往直通樓梯 ③室內往走廊或通道 ④走廊上跨防火區劃之防火門。設有排煙室者為該室之出入口。'},
    {t:'避難方向指示燈：優先設於轉彎處', d:'避難方向指示燈裝設於走廊、樓梯及通道，優先設在轉彎處，並把走廊各部分都納入有效範圍。', tip:'§146-3 第 2 項。設於樓梯或坡道者，級面或坡道表面照度 1 lx 以上。'},
    {t:'有效範圍：D = k × h', d:'步行距離 D＝k × 標示面縱向尺度 h。出口標示燈未顯示方向符號 k = 150、有方向符號 k = 100；避難方向指示燈 k = 50。', tip:'§146-2。A 級 h ≥ 0.4 m：出口燈 60 m（有符號 40 m）、方向燈 20 m；不易看清者一律 10 m。'},
    {t:'避難指標：步行 7.5 m 內', d:'避難指標設於走廊或通道時，任一點至指標的步行距離 7.5 m 以下，優先設於轉彎處；設於出入口時高度 1.5 m 以下。', tip:'§153。避難指標是不發光的標示，周圍不得有影響視線的裝潢及廣告招牌。'},
    {t:'停電：標示燈改由蓄電池點亮', d:'出口標示燈及避難方向指示燈的緊急電源為蓄電池設備，能有效動作 20 分鐘以上。', tip:'§155：總樓地板 ≥ 50,000 m²、高層建築物 ≥ 30,000 m²、地下建築物 ≥ 1,000 m² 之主要避難路徑為 60 分鐘。'},
    {t:'緊急照明：≥ 2 lx、30 分鐘', d:'緊急照明燈在地面水平面照度 2 lx 以上（地下建築物之地下通道 10 lx 以上），走廊曲折點應增設；蓄電池持續 30 分鐘以上。', tip:'§177、§178。蓄電池與緊急發電機併設時分別為 10 分鐘及 30 分鐘；照明器具直接接分路配線，不得裝插座或開關（§176）。'},
  ],
  groundY: -0.01, minDist: 2, sun:[5,14,8],
  views: {
    def:{dir:[0.35,0.75,0.56], dist:24, target:[0,0,0]},
    1:{dir:[0.4,0.3,0.86], dist:10, target:[-2,2,1.5]},
    2:{dir:[0.6,0.35,0.72], dist:10, target:[5,2,-1]},
    3:{dir:[0.2,0.6,0.77], dist:18, target:[1,0,0]},
    4:{dir:[0.5,0.4,0.77], dist:10, target:[4,1,2]},
    5:{dir:[0.35,0.6,0.71], dist:20, target:[1,0,0]},
    6:{dir:[0.35,0.6,0.71], dist:20, target:[1,0,0]},
  },
  build({THREE, scene, mat, span, pipe, group, label, add, fixed, plate, dim, flow, pulse}) {
    const M = {
      floor: mat('#d6d0c7',{roughness:1}), wall: mat('#e7e2da',{roughness:1}), door: mat('#64748b',{metalness:.3}),
      box: mat('#f8fafc'), path: mat('#22c55e',{emissive:'#22c55e',emissiveIntensity:.7}), dark: mat('#0f172a',{transparent:true,opacity:.55,depthWrite:false}),
      el: mat('#fefce8',{emissive:'#fde047',emissiveIntensity:1.2}), pool: mat('#fef08a',{transparent:true,opacity:.35,depthWrite:false}),
      stair: mat('#a8a29e'), smoke: mat('#6b7280',{transparent:true,opacity:.3,depthWrite:false}),
    };
    const NE={edges:false, shadow:false}, H=3;
    // 平面：居室 x -8～-2、走廊沿 z = 2 往 +x 後在 x = 6 轉向 -z；樓梯在 x 6～8, z -5～-2
    fixed(span(-9,-0.1,-6,9,0,5,M.floor));
    fixed(span(-8,0,-4,-7.85,H,3,M.wall)); fixed(span(-8,0,-4.15,-2,H,-4,M.wall));
    fixed(span(-2.15,0,-4,-2,H,0.8,M.wall)); fixed(span(-2.15,2.2,0.8,-2,H,1.8,M.wall));                  // 居室門 z 0.8～1.8
    fixed(span(-8,0,3,8,H,3.15,M.wall));                                                           // 走廊外牆
    fixed(span(-2,0,0.6,4.6,H,0.75,M.wall));                                                      // 走廊內牆
    fixed(span(4.6,0,-5,4.75,H,0.75,M.wall)); fixed(span(7.85,0,-5,8,H,3,M.wall));
    fixed(span(4.75,0,-5.15,6,H,-5,M.wall)); fixed(span(7,2.2,-5.15,7.85,H,-5,M.wall)); fixed(span(6,2.2,-5.15,7,H,-5,M.wall));
    for(let i=0;i<6;i++) fixed(span(6,0,-5.2-(i+1)*0.13,7.85,0.18*(i+1),-5.2-i*0.13,M.stair));
    fixed(label('居室',-5,H+0.6,-0.5,.6)); fixed(label('走廊',1,H+0.6,1.8,.6)); fixed(label('直通樓梯',7,H+0.6,-5.5,1.0));

    const exitSign=(x,y,z,n)=>{ const g=group(); const p=plate('出口 EXIT',0.8,0.32,{bg:'#15803d',fg:'#ffffff',normal:n,glow:.8}); p.position.set(x,y,z); g.add(p); return g; };
    const dirSign=(x,y,z,n,txt)=>{ const g=group(); const p=plate(txt,0.7,0.26,{bg:'#f0fdf4',fg:'#15803d',normal:n,glow:.6}); p.position.set(x,y,z); g.add(p); return g; };

    /* ① 出口標示燈 */
    add(1, exitSign(-1.98,2.45,1.3,'x'), {drop:0});
    add(1, exitSign(6.4,2.45,-4.98,'z'), {drop:0, delay:.2});
    add(1, label('③ 由室內往走廊的出入口上方',-0.6,3.6,1.6,1.8,'good'),{until:1, drop:0, glow:false});
    add(1, label('② 通往直通樓梯的出入口',6.4,3.6,-4.4,1.6,'good'),{until:1, drop:0, glow:false, delay:.3});

    /* ② 避難方向指示燈 */
    add(2, dirSign(6.2,1.0,2.98,'-z','→ 出口'), {drop:0});
    add(2, dirSign(1,1.0,2.98,'-z','→ 出口'), {drop:0, delay:.2});
    add(2, dirSign(4.77,1.0,-2,'x','↑ 出口'), {drop:0, delay:.4});
    add(2, label('優先設於轉彎處',6.2,2.2,2.2,1.2,'good'),{until:2, drop:0, glow:false});

    /* ③ 有效範圍 */
    add(3, dim([-1.8,0.2,1.3],[4.4,0.2,1.8],'出口燈 A 級：D = 150 × 0.4 = 60 m',{w:2.2, off:[0,1.4,0]}), {until:3, drop:0, glow:false});
    add(3, dim([6.2,0.2,2.6],[6.2,0.2,-2],'方向燈 A 級：50 × 0.4 = 20 m',{w:2.0, off:[1.6,.8,0]}), {until:3, drop:0, glow:false, delay:.3});
    add(3, label('顯示方向符號的出口燈 k = 100（範圍反而縮短）',0,5.2,0,2.6,'bad'),{until:3, drop:0, glow:false, delay:.5});

    /* ④ 避難指標 */
    add(4, dirSign(3,1.0,0.77,'z','避難指標 →'), {drop:0});
    add(4, dim([0,0.15,1.8],[3,0.15,1.8],'步行 ≤ 7.5 m',{w:1.0, off:[0,.5,0]}), {until:4, drop:0, glow:false, delay:.2});
    add(4, label('出入口處：高度 ≤ 1.5 m',3,2.4,1.6,1.4),{until:4, drop:0, glow:false, delay:.4});

    /* ⑤ 停電 */
    add(5, span(-8,0.02,-4,8,0.04,3,M.dark,NE), {until:5, drop:0, glow:false});
    const P=[[-5,0.1,-1],[-2.5,0.1,1.3],[2,0.1,1.8],[6.2,0.1,1.6],[6.3,0.1,-3],[6.5,0.1,-4.6]];
    add(5, flow(P,M.path,{n:16,r:.12,speed:3}), {drop:0, glow:false});
    add(5, label('蓄電池 20 分鐘以上（大型場所主要路徑 60 分）',0,5.2,0,2.6,'good'),{until:5, drop:0, glow:false});

    /* ⑥ 緊急照明 */
    [[-5,-1],[-0.5,1.8],[3.5,1.8],[6.2,1.8],[6.2,-2.5]].forEach(([x,z],i)=>{
      const g=group(span(x-0.25,H-0.08,z-0.12,x+0.25,H,z+0.12,M.el,{edges:false}));
      const c=new THREE.Mesh(new THREE.CircleGeometry(1.5,32),M.pool.clone()); c.rotation.x=-Math.PI/2; c.position.set(x,0.05,z); g.add(c);
      add(6, g, {drop:0, glow:false, delay:i*.12});
    });
    add(6, label('地面照度 ≥ 2 lx（地下通道 10 lx）',0,5.4,0,2.2,'good'),{until:6, drop:0, glow:false});
    add(6, label('走廊曲折點應增設',6.2,3.8,2,1.3),{until:6, drop:0, glow:false, delay:.3});
    add(6, label('蓄電池 30 分鐘以上',0,4.4,0,1.4),{until:6, drop:0, glow:false, delay:.5});
  },
});
</script>
