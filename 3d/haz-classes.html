<script type="module">
import { createAnim } from './engine.js?v=2026111905';
import { hazKit } from './haz-kit.js?v=2026112602';

createAnim({
  title: '第四編②　滅火設備分類與效能值（§197～§206-1）',
  page: '22-%E5%85%AC%E5%85%B1%E5%8D%B1%E9%9A%AA%E7%89%A9%E5%93%81%E5%A0%B4%E6%89%80-%E5%9C%96%E8%A7%A3.html',
  kicker: '各類場所消防安全設備設置標準　第四編　逐條 3D',
  kind: 'notes',
  steps: [
    {t:'公共危險物品場所的滅火設備分五種', d:'第四編不用「滅火器、消防栓…」的一般分類，而是把滅火設備分成第一種到第五種，再依滅火困難等級決定要設哪幾種、設多少。', tip:'先記分類（§197），再記效能值（§199、§200），最後記各級要設什麼（§201～§203）。'},
    {t:'§197　第一種至第五種滅火設備', d:'第一種：室內或室外消防栓。第二種：自動撒水。第三種：水霧、泡沫、二氧化碳、惰性氣體、鹵化烴、乾粉。第四種：大型滅火器。第五種：滅火器、水桶、水槽、乾燥砂、膨脹蛭石或膨脹珍珠岩。', tip:'§197Ⅰ。可燃性高壓氣體製造場所、加氣站、天然氣及可燃性高壓氣體儲槽另有「防護設備」：冷卻撒水設備、射水設備（§197Ⅱ）。'},
    {t:'§198　依場所與物品種類選擇適當設備', d:'製造、儲存、處理場所及爆竹煙火場所，要依表選擇「對該類物品有效」的滅火設備。例如禁水性物質不能用水系設備，要用乾燥砂、膨脹蛭石等；第四類易燃液體適合泡沫、乾粉、二氧化碳。', tip:'§198 表列。選錯設備可能擴大災害（如水遇禁水性物質）。本頁示意兩種典型對應，完整對照請看條文表。'},
    {t:'§199　第五種滅火設備的最低滅火效能值', d:'製造或處理場所：外牆防火構造每 100 m²（含未滿）1 單位，非防火構造每 50 m² 1 單位。儲存場所：防火構造每 150 m²，非防火構造每 75 m²。另外，公共危險物品每達管制量 10 倍（含未滿）再加 1 單位。', tip:'§199①～④。室外附屬設施以水平最大面積當樓地板面積，準用防火構造的數值。'},
    {t:'§200　水桶、水槽、乾燥砂、蛭石的效能值', d:'8 公升消防專用水桶每 3 個 = 1 單位；水槽每 80 公升 = 1.5 單位；乾燥砂每 50 公升 = 0.5 單位；膨脹蛭石或膨脹珍珠岩每 160 公升 = 1 單位。', tip:'§200。常考換算：100 公升乾燥砂 = 1 單位；800 公升膨脹蛭石 = 5 單位。'},
    {t:'§201　顯著滅火困難場所', d:'依表設置第一、二或三種滅火設備，並應再設第四種及第五種。例外：高閃火點物品操作溫度未滿 100°C 的製造處理場所，在第一～三種有效範圍內可免第四種；第四類室內外儲槽設第五種 2 具以上；室內加油站應設第五種。', tip:'§201。顯著 = 一～三種擇一 ＋ 四種 ＋ 五種。'},
    {t:'§202　一般滅火困難場所', d:'製造、一般處理、室內外儲存、第二種販賣場所及室內加油站：設第四種及第五種，第五種的效能值達最低效能值 1/5 以上。室內及室外儲槽：第四種及第五種各 1 具以上。', tip:'§202。已設第一～三種者，在其有效範圍內得免設第四種。'},
    {t:'§203　其他滅火困難場所', d:'設第五種滅火設備，效能值達最低效能值以上；已設第一～四種之一者，在有效範圍內可減到 1/5。地下儲槽場所應設第五種滅火設備 2 具以上。', tip:'§203。'},
    {t:'§204　電氣設備使用之處所', d:'電氣設備使用之處所，每 100 m²（含未滿）應設第五種滅火設備 1 具以上。', tip:'§204。與 §199 的效能值另外計算。'},
    {t:'§205　火警自動警報設備', d:'製造及一般處理場所 500 m² 以上或 100 倍以上；室內儲存場所 100 倍以上、150 m² 以上、或高 6 m 以上一層建築物；顯著滅火困難的室內儲槽；一面開放或上方有其他用途的室內加油站。其餘達管制量 10 倍以上者設手動報警或緊急通報裝置。', tip:'§205。高閃火點物品操作溫度未滿 100°C、以無開口 1 小時防火時效區劃者有除外規定；平日無作業人員者免設手動報警。'},
    {t:'§206　加油站所在建築物', d:'加油站所在建築物，二樓以上供其他用途使用者，應設置標示設備。', tip:'§206。標示設備的設置方式回到第三編 §146～§156（§227）。'},
    {t:'§206-1　爆竹煙火場所', d:'爆竹煙火製造場所有火藥區之作業區或庫儲區、達管制量以上之儲存或販賣場所，應設第五種滅火設備。建築物供這些場所使用之樓地板面積合計 150 m² 以上者，應設第一種滅火設備之室外消防栓（販賣場所除外）。', tip:'§206-1。'},
  ],
  groundY: -0.01, minDist: 3, sun:[14,26,16], labelMax: 5,
  views: {
    def:{dir:[0.5,0.5,0.7], dist:30, target:[0,2,0]},
    1:{dir:[0.25,0.45,0.86], dist:30, target:[0,2,0]},
    4:{dir:[0.35,0.5,0.8], dist:16, target:[0,0.6,0]},
    8:{dir:[0.5,0.5,0.7], dist:26, target:[0,2,0]},
  },
  build(k) {
    const H = hazKit(k), {S, L, D, M} = H;
    H.ground();

    /* 0 */
    S(0, H.bld(0,0,12,8,5)); S(0, H.drums(-4,-2,4,2)); L(0,'第一種 ～ 第五種',0,8,0,1.8,'good',.2,0);

    /* 1 §197 五種一字排開 */
    const xs=[-10,-5,0,5,10];
    S(1, H.hydOut(xs[0]-0.6,0),0); S(1, H.hydIn(xs[0]+0.6,0.5,-0.2),.05); L(1,'第一種 消防栓',xs[0],3.6,0,1.6);
    S(1, H.span(xs[1]-1.6,3,-1.2,xs[1]+1.6,3.2,1.2,M.conc),.1); [[-0.8,-0.5],[0.8,-0.5],[0,0.6]].forEach(([a,b])=>S(1, H.head(xs[1]+a,3,b),.12)); L(1,'第二種 自動撒水',xs[1],4.6,0,1.7);
    S(1, H.cyls(xs[2]-0.9,0,4),.15); L(1,'第三種 水霧泡沫氣體乾粉',xs[2],3.4,0,2.3);
    S(1, H.ext(xs[3],0,{big:true}),.2); L(1,'第四種 大型滅火器',xs[3],3,0,1.8);
    S(1, H.ext(xs[4]-1,0),.25); S(1, H.bucket(xs[4]-0.3,0.4),.25); S(1, H.sandBox(xs[4]+0.7,0),.25); L(1,'第五種 滅火器、砂…',xs[4],2.6,0,1.9);

    /* 2 §198 選設 */
    S(2, H.drums(-7,-1,3,2,M.drumY),0); L(2,'禁水性物質',-6.3,3,-0.5,1.4,'bad');
    S(2, H.sandBox(-6,3),.1); L(2,'乾燥砂、膨脹蛭石',-6,2,3.6,1.8,'good');
    S(2, H.flow([[-3.5,2.5,-0.5],[-4.5,2,-0.5],[-5.4,1.3,-0.5]],M.drop,{n:8,r:.1,speed:1}),.2); L(2,'水系 ✕',-3.4,3.4,-0.5,1,'bad');
    S(2, H.tank(5,0,2,4),.15); L(2,'第四類易燃液體',5,6,0,1.7);
    S(2, H.span(4,4.05,-1,6,4.25,1,M.foam,{edges:false}),.3); L(2,'泡沫、乾粉、CO₂',5,7.3,0,1.7,'good',.35);

    /* 3 §199 效能值 */
    S(3, H.bld(-6,0,8,6,4),0); L(3,'製造：防火 100 m²／1',-6,6.5,0,2.2,'good'); L(3,'非防火 50 m²／1',-6,5.3,0,1.7,'bad');
    S(3, H.bld(5,0,8,6,4,{m:M.conc}),.1); L(3,'儲存：防火 150 m²／1',5,6.5,0,2.2,'good'); L(3,'非防火 75 m²／1',5,5.3,0,1.7,'bad');
    S(3, H.drums(-2,5,4,1),.2); L(3,'＋ 每 10 倍管制量 1 單位',0,2.2,6,2.4);

    /* 4 §200 第五種效能值 */
    for(let i=0;i<3;i++) S(4, H.bucket(-4.6+i*.45,0),.05*i); L(4,'8 L 水桶 ×3 = 1',-4.2,1.2,0,1.4);
    S(4, H.trough(-1.4,0),.15); L(4,'水槽 80 L = 1.5',-1.4,1.5,0,1.4);
    S(4, H.sandBox(1.4,0),.2); L(4,'乾燥砂 50 L = 0.5',1.4,1.5,0,1.5);
    S(4, H.span(3.6,0,-.3,4.6,.5,.3,mat2(H,'#cbd5e1')),.25); L(4,'蛭石 160 L = 1',4.1,1.2,0,1.4);

    /* 5 §201 顯著 */
    S(5, H.tank(0,0,3.2,7),0); S(5, H.dike(0,0,10,10),.05);
    S(5, H.hydOut(6.5,3),.1); L(5,'一～三種擇一',6.5,2.6,3,1.4,'good');
    S(5, H.ext(6.5,-3,{big:true}),.15); L(5,'＋ 第四種',6.5,2.8,-3,1.1);
    S(5, H.ext(-6,-3),.2); S(5, H.ext(-6.5,-3),.2); L(5,'＋ 第五種（儲槽 ≥ 2 具）',-6.2,2,-3,2.4);
    L(5,'顯著 = 一～三＋四＋五',0,10.4,0,2.4,'bad');

    /* 6 §202 一般 */
    S(6, H.bld(-5,0,9,7,4.5),0); S(6, H.ext(-2.5,4.2,{big:true}),.1); S(6, H.ext(-7,4.2),.15);
    L(6,'第四種＋第五種',-5,7,0,1.7,'good'); L(6,'第五種效能值 ≥ 1/5',-5,5.8,0,2);
    S(6, H.tank(6,0,2.2,5),.2); S(6, H.ext(9,1.5,{big:true}),.25); S(6, H.ext(9,-1.5),.25); L(6,'儲槽：四、五種各 1 具',6,7.5,0,2.2);

    /* 7 §203 其他 */
    S(7, H.canopy(-4,0,7,5,4),0); S(7, H.dispenser(-4,0),.05); S(7, H.ext(-1.5,2),.1); L(7,'第五種 ≥ 最低效能值',-4,6.5,0,2.2,'good');
    S(7, H.pad(3,-3,9,3,M.conc),.15); S(7, H.span(5.6,.05,-.4,6.4,.6,.4,M.steel),.2); S(7, H.ext(8,1.5),.25); S(7, H.ext(8.4,1.5),.25);
    L(7,'地下儲槽：第五種 ≥ 2 具',6,2.6,0,2.4);

    /* 8 §204 電氣設備 */
    S(8, H.bld(0,0,10,7,4,{open:true,roof:'glass'}),0);
    for(let i=0;i<3;i++) S(8, H.span(-3.5+i*2.2,0,-2.6,-2.3+i*2.2,2,-1.8,mat2(H,'#475569')),.05*i);
    S(8, H.pad(-5,-3.5,0,3.5,M.zoneB),.15); S(8, H.pad(0,-3.5,5,3.5,M.zoneY),.15);
    S(8, H.ext(-2.5,1),.2); S(8, H.ext(2.5,1),.2); L(8,'每 100 m² ≥ 1 具',0,6,0,1.8,'good'); L(8,'電氣設備處所',0,4.8,0,1.5);

    /* 9 §205 火警 */
    S(9, H.bld(-5,0,9,7,4.5,{roof:'glass'}),0); for(let i=0;i<3;i++){ const d=new k.THREE.Mesh(new k.THREE.CylinderGeometry(.18,.18,.12,14), mat2(H,'#f8fafc')); d.position.set(-7+i*2,4.4,0); S(9,d,.1); }
    L(9,'製造 ≥ 500 m² 或 100 倍',-5,7.4,0,2.4,'bad'); L(9,'室內儲存 ≥ 150 m²',-5,6.2,0,2);
    S(9, H.bld(6,0,6,5,3),.2); S(9, H.span(8.9,1.2,-.2,9.05,1.6,.2,M.red),.25); L(9,'≥ 10 倍：手動報警',6,5.2,0,2,'good');

    /* 10 §206 加油站建築物 */
    S(10, H.bld(0,-2,10,6,3.2,{open:true}),0); S(10, H.bld(0,-2,10,6,3,{open:false}).translateY(3.4),.05);
    S(10, H.canopy(0,4,9,5,4),.1); S(10, H.dispenser(-1.5,4),.12); S(10, H.dispenser(1.5,4),.12);
    S(10, H.board('出口',0,5.4,1.05,1.2,.45,{bg:'#15803d'}),.2); L(10,'二樓以上他用 → 標示設備',0,9.2,-2,2.6,'good');

    /* 11 §206-1 爆竹煙火 */
    S(11, H.bld(-4,0,9,6,3.5),0); S(11, H.board('爆竹煙火',-4,2.6,3.05,2.2,.6,{bg:'#be185d'}),.05);
    for(let i=0;i<4;i++) S(11, H.span(-7+i*1.4,0,-1.5,-6.2+i*1.4,.8,-.7,M.pink),.08);
    S(11, H.ext(-6,2),.15); L(11,'第五種滅火設備',-4,6,0,1.7,'good');
    S(11, H.hydOut(4.5,1),.2); L(11,'≥ 150 m²：室外消防栓',3.5,3.2,1,2.2,'bad');
  },
});
function mat2(H,c){ return H.mat(c); }
</script>
