<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>緊急廣播設備｜3D 消防設備動畫</title>
<meta name="description" content="§133～§139 緊急廣播設備 3D 互動動畫：揚聲器 L／M／S 級音壓 92／87／84 dB、廣播區域面積選級、任一點 10 m、樓梯每垂直 15 m 一個 L 級、廣播分區、啟動裝置 50 m・0.8～1.5 m、11 層以上緊急電話、語音播放、遮斷其他廣播、緊急電源 10 分鐘。">
<link rel="icon" href="../icons/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="theme-color" content="#3b1e1a">
<link rel="stylesheet" href="anim.css?v=2026111905">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import { createAnim } from './engine.js?v=2026111905';

createAnim({
  title: '緊急廣播設備',
  page: '18-%E7%B7%8A%E6%80%A5%E5%BB%A3%E6%92%AD%E8%88%87%E7%93%A6%E6%96%AF%E6%BC%8F%E6%B0%A3-%E5%9C%96%E8%A7%A3.html',
  steps: [
    {t:'用人聲告訴大家發生什麼事', d:'緊急廣播以語音告知火災位置與避難方向，比警鈴更清楚，適合人多、不熟悉環境的場所。', tip:'§133～§139。常與火警自動警報設備連動。'},
    {t:'揚聲器分級：L 92／M 87／S 84 dB', d:'距揚聲器 1 m 處測得音壓：L 級 92 dB 以上；M 級 87 dB 以上未滿 92 dB；S 級 84 dB 以上未滿 87 dB。', tip:'§133①。'},
    {t:'依廣播區域面積選級', d:'廣播區域超過 100 m² 設 L 級；超過 50 m² 至 100 m² 設 L 或 M 級；50 m² 以下 L、M、S 級都可以。', tip:'§133②（一）～（三）。'},
    {t:'任一點至揚聲器 ≤ 10 m', d:'各廣播區域內任一點至揚聲器的水平距離在 10 m 以下；樓梯或斜坡通道至少每垂直距離 15 m 設一個 L 級揚聲器。', tip:'§133②。小面積居室（6 m²）、走廊通道（6 m²）、其他非居室（30 m²）有但書可免設；亦可用音壓計算式驗算替代 10 m。'},
    {t:'廣播分區：不超過一樓層', d:'每一廣播分區不得超過一樓層；室內安全梯或特別安全梯每垂直 45 m 單獨設一分區，地下層部分另設一分區。', tip:'§134。挑空部分音壓符合規定時得為一分區。'},
    {t:'啟動裝置：步行 50 m・0.8～1.5 m', d:'各樓層任一點至啟動裝置步行距離 50 m 以下，設於距樓地板 0.8～1.5 m；11 層以上、地下第 3 層以下或地下建築物應使用緊急電話方式啟動。', tip:'§136。'},
    {t:'操作裝置：選樓層、語音廣播', d:'擴音機與操作裝置設於值日室或防災中心，與啟動裝置或火警設備連動、標示動作樓層，能選擇必要樓層或區域廣播；音響警報以語音播放，並遮斷其他廣播。', tip:'§135、§137、§138：操作開關 0.8～1.5 m（座式 0.6 m）；與火警連動時鳴動方式準用 §113 分區鳴動。'},
    {t:'緊急電源：蓄電池 10 分鐘', d:'緊急廣播設備的緊急電源準用火警自動警報設備，使用蓄電池設備，有效動作 10 分鐘以上。', tip:'§135 準用 §128。'},
  ],
  groundY: -0.01, minDist: 2, sun:[6,16,10],
  views: {
    def:{dir:[0.5,0.4,0.77], dist:22, target:[0,4,0]},
    1:{dir:[0.35,0.15,0.92], dist:6, target:[-2,3.5,-1]},
    2:{dir:[0.1,0.9,0.42], dist:22, target:[0,3.5,0]},
    3:{dir:[0.3,0.75,0.6], dist:16, target:[-1,3.5,0]},
    4:{dir:[0.55,0.3,0.78], dist:22, target:[0,4,0]},
    5:{dir:[0.35,0.2,0.92], dist:8, target:[-4,1.4,-2]},
    6:{dir:[0.45,0.3,0.84], dist:20, target:[0,4,-1]},
    7:{dir:[0.45,0.25,0.86], dist:8, target:[3.5,1.3,-2.2]},
  },
  build({THREE, mat, span, pipe, group, label, add, fixed, plate, dim, flow, pulse}) {
    const M = {
      slab: mat('#d6d0c7',{roughness:1}), wall: mat('#e7e2da',{roughness:1}), part: mat('#cbd5e1',{roughness:.9}), stair: mat('#a8a29e'),
      spk: mat('#f8fafc'), spkOn: mat('#facc15',{emissive:'#facc15',emissiveIntensity:1}), wave: mat('#facc15',{transparent:true,opacity:.35,depthWrite:false}),
      zA: mat('#fca5a5',{transparent:true,opacity:.35,depthWrite:false}), zB: mat('#93c5fd',{transparent:true,opacity:.35,depthWrite:false}), zC: mat('#86efac',{transparent:true,opacity:.4,depthWrite:false}),
      ring: mat('#16a34a',{transparent:true,opacity:.3,depthWrite:false}), red: mat('#c81e1e'), panel: mat('#e5e7eb'), panelF: mat('#1f2937'),
      sig: mat('#facc15',{emissive:'#f59e0b',emissiveIntensity:1}), lamp: mat('#ef4444',{emissive:'#ef4444',emissiveIntensity:1.2}),
    };
    const NE={edges:false, shadow:false}, FH=3.5;
    [0,FH].forEach(y=>fixed(span(-7,y-0.15,-4,7,y,4,M.slab)));
    fixed(span(-7,0,-4.15,7,7,-4,M.wall)); fixed(span(-7.15,0,-4,-7,7,4,M.wall));
    fixed(span(-1,FH,-4,-0.9,7,1,M.part)); fixed(span(2.5,FH,-4,2.6,7,1,M.part)); fixed(span(-7,FH,1,7,7,1.1,M.part));
    fixed(span(5,0,-4,7,7,-1.5,M.stair,{edges:true}));
    fixed(label('1F',-7.7,1.6,0,.6)); fixed(label('2F',-7.7,5.1,0,.6)); fixed(label('樓梯',6,7.7,-2.7,.7));
    // 2F：大會議室 6×5 (30 m²)、中房 3.5×5、走廊
    const spk=(x,y,z)=>group(pipe([x,y,z],[x,y-0.08,z],.2,M.spk));

    /* ① 分級 */
    add(1, spk(-4,7,-1.5), {drop:0});
    add(1, label('L 級：1 m 處 ≥ 92 dB',-2.2,6.2,-1,1.4,'good'),{until:1, drop:0, glow:false});
    add(1, label('M 級：87～92 dB',-2.2,5.4,-1,1.2),{until:1, drop:0, glow:false, delay:.2});
    add(1, label('S 級：84～87 dB',-2.2,4.6,-1,1.2),{until:1, drop:0, glow:false, delay:.4});
    add(1, dim([-4,6.9,-1.5],[-4,5.9,-1.5],'1 m',{w:.4, off:[-.4,0,0]}),{until:1, drop:0, glow:false});

    /* ② 依面積 */
    add(2, span(-7,FH+0.02,-4,-1,FH+0.04,1,M.zA,NE), {until:2, drop:0, glow:false});
    add(2, span(-0.9,FH+0.02,-4,2.5,FH+0.04,1,M.zB,NE), {until:2, drop:0, glow:false, delay:.2});
    add(2, span(2.6,FH+0.02,-4,5,FH+0.04,1,M.zC,NE), {until:2, drop:0, glow:false, delay:.4});
    add(2, label('> 100 m²：L 級',-4,FH+1.2,-1.5,1.1),{until:2, drop:0, glow:false});
    add(2, label('50～100 m²：L 或 M',0.8,FH+1.2,-1.5,1.3),{until:2, drop:0, glow:false, delay:.2});
    add(2, label('≤ 50 m²：L、M、S',3.8,FH+1.2,-1.5,1.2),{until:2, drop:0, glow:false, delay:.4});

    /* ③ 10 m・樓梯 15 m */
    [[0.8,-1.5],[3.8,-1.5],[-3,2.5],[3,2.5]].forEach(([x,z],i)=>add(3, spk(x,7,z), {drop:0, delay:i*.1}));
    [[-4,-1.5],[0.8,-1.5]].forEach(([x,z])=>{ const r=new THREE.Mesh(new THREE.CircleGeometry(2.5,40),M.ring.clone()); r.rotation.x=-Math.PI/2; r.position.set(x,FH+0.05,z); add(3,r,{until:3,drop:0,glow:false}); });
    add(3, label('任一點至揚聲器 ≤ 10 m',-2,FH+1.6,2.5,1.5,'good'),{until:3, drop:0, glow:false});
    add(3, spk(6,7,-2.7), {drop:0, delay:.3});
    add(3, label('樓梯：每垂直 15 m 一個 L 級',6,FH+1.2,-0.8,1.8),{until:3, drop:0, glow:false, delay:.4});

    /* ④ 廣播分區 */
    add(4, span(-7,0.02,-4,5,0.04,4,M.zB,NE), {until:4, drop:0, glow:false});
    add(4, span(-7,FH+0.05,-4,5,FH+0.07,4,M.zA,NE), {until:4, drop:0, glow:false, delay:.2});
    add(4, span(5,0.02,-4,7,7,-1.5,M.zC,NE), {until:4, drop:0, glow:false, delay:.4});
    add(4, label('每一廣播分區不超過一樓層',-1,8.4,0,1.8,'good'),{until:4, drop:0, glow:false});
    add(4, label('安全梯每垂直 45 m 一分區・地下另設',6,8.2,-1,2.2),{until:4, drop:0, glow:false, delay:.3});

    /* ⑤ 啟動裝置 */
    add(5, group(span(-4.3,0.9,-4,-3.7,1.45,-3.9,M.red)), {drop:0});
    add(5, dim([-4.6,0,-3.9],[-4.6,1.45,-3.9],'0.8～1.5 m',{w:.8, off:[-.5,0,0]}),{until:5, drop:0, glow:false});
    add(5, label('任一點步行 ≤ 50 m',-4,2.3,-3.4,1.3,'good'),{until:5, drop:0, glow:false, delay:.2});
    add(5, label('11 層以上・地下 3 層以下：緊急電話啟動',-4,3.0,-3.4,2.4),{until:5, drop:0, glow:false, delay:.4});

    /* ⑥ 操作裝置・廣播 */
    add(6, group(span(2.8,0,-4,4.2,1.4,-3.4,M.panel), span(2.9,1.0,-3.4,4.1,1.35,-3.38,M.panelF,{edges:false})), {drop:0});
    add(6, flow([[3.5,1.4,-3.6],[3.5,3.4,-3.8],[0,3.4,-3.8],[0,6.9,-1.5]],M.sig,{n:16,r:.05,speed:4}), {until:6, drop:0, glow:false});
    [[-4,-1.5],[0.8,-1.5],[3.8,-1.5]].forEach(([x,z],i)=>{ const w=new THREE.Mesh(new THREE.SphereGeometry(1.0,20,12,0,Math.PI*2,0,Math.PI/2),M.wave.clone()); w.rotation.x=Math.PI; w.position.set(x,6.9,z); add(6,pulse(w,1.5),{until:6,drop:0,glow:false,delay:i*.1}); });
    add(6, label('「2 樓發生火災，請由樓梯避難」',0,8.4,0,2.3,'bad'),{until:6, drop:0, glow:false});
    add(6, label('值日室：選樓層廣播・操作開關 0.8～1.5 m',3.5,2.2,-2.8,2.4,'good'),{until:6, drop:0, glow:false, delay:.3});

    /* ⑦ 緊急電源 */
    add(7, group(span(4.5,0,-4,5,1.0,-3.5,M.panel)), {drop:.3});
    add(7, label('蓄電池 10 分鐘以上（準用 §128）',3.5,2.2,-2.8,2.0,'good'),{until:7, drop:0, glow:false});
  },
});
</script>
</body>
</html>
