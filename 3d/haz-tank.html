<body>
<script type="module">
import { createAnim } from './engine.js?v=2026111905';

createAnim({
  title: '公共危險物品場所：室外儲槽',
  page: '22-%E5%85%AC%E5%85%B1%E5%8D%B1%E9%9A%AA%E7%89%A9%E5%93%81%E5%A0%B4%E6%89%80-%E5%9C%96%E8%A7%A3.html',
  kicker: '各類場所消防安全設備設置標準　第四編',
  steps: [
    {t:'油槽區：第四編的數字全部加嚴', d:'公共危險物品場所的火災規模大、延燒快，第四編把一般場所的設備數字全部加嚴，儲槽還要加設泡沫與冷卻撒水。', tip:'§193 適用：公共危險物品製造儲存處理場所、加油站、加氣站、天然氣及可燃性高壓氣體儲槽、爆竹煙火場所。'},
    {t:'固定式泡沫放出口：泡沫蓋住油面', d:'儲槽在槽壁頂部設固定式泡沫放出口，起火時把泡沫送進槽內覆蓋油面。', tip:'§213、§218：泡沫放出口、放射量、原液儲存量與濃度等準用第三編泡沫規定，儲槽用放出口依 §213。'},
    {t:'補助泡沫消防栓：距槽壁 ≥ 15 m', d:'補助泡沫消防栓設在防液堤外圍、距槽壁 15 m 以上便於救災處，至任一泡沫消防栓步行距離 75 m 以下。', tip:'§214①：瞄子放射量 400 L/min 以上、放射壓力 3.5 kgf/cm² 以上；超過 3 支以同時使用 3 支計算。'},
    {t:'連結送液口：N = A × q ÷ C', d:'消防車由連結送液口補送泡沫水溶液。數量 N＝儲槽最大水平斷面積 A × 每 m² 放射量 q ÷ 每口標準送液量 C（800 L/min）。', tip:'§214②。浮頂儲槽得以環狀面積核算 A。'},
    {t:'冷卻撒水：槽壁每 m² 2 L/min', d:'閃火點 70°C 以下第四類公共危險物品的顯著滅火困難儲槽，加設冷卻撒水：撒水管設於槽壁頂部，撒水量按槽壁總防護面積每 m² 每分鐘 2 L 以上，噴孔孔徑 4 mm 以上。', tip:'§216①～③。有風樑或補強環時，下方要增設撒水管。'},
    {t:'水源：最大一座儲槽連續 4 小時', d:'冷卻撒水的水源容量為最大一座儲槽連續放水 4 小時以上；選擇閥設在防液堤外，操作高度 0.8～1.5 m。', tip:'§216⑤⑥：全法最長的放水時間。送水區域距加壓送水裝置超過 300 m 時要設遠隔啟動裝置。'},
    {t:'第四編加嚴：3.5 kgf/cm²、45 分鐘', d:'室內消防栓限第一種，3.5 kgf/cm²、260 L/min、最多 5 支 × 30 分；室外消防栓 3.5 kgf/cm²、450 L/min、最多 4 支 × 30 分；緊急電源都改為 45 分鐘。', tip:'§209、§210、§212：水霧放射區域 ≥ 150 m²、20 L/min·m²、30 分、3.5 kgf/cm²。對照第三編：1.7／2.5 kgf/cm²、30 分鐘電源。'},
  ],
  groundY: -0.01, minDist: 2, sun:[14,26,16],
  views: {
    def:{dir:[0.5,0.5,0.71], dist:46, target:[0,4,0]},
    1:{dir:[0.4,0.6,0.7], dist:34, target:[0,7,0]},
    2:{dir:[0.2,0.9,0.4], dist:52, target:[4,0,4]},
    3:{dir:[0.55,0.3,0.78], dist:16, target:[10,1,8]},
    4:{dir:[0.45,0.3,0.84], dist:44, target:[0,6,0]},
    5:{dir:[0.6,0.3,0.74], dist:18, target:[12,1,-6]},
    6:{dir:[0.5,0.5,0.71], dist:46, target:[0,4,0]},
  },
  build({THREE, mat, span, pipe, group, label, add, fixed, plate, dim, flow, pulse}) {
    const M = {
      ground: mat('#d6d3cc',{roughness:1}), dike: mat('#a8a29e',{roughness:1}), tank: mat('#e5e7eb',{metalness:.3,roughness:.5}), roof: mat('#cbd5e1',{metalness:.3}),
      pipe: mat('#dc2626',{metalness:.4,roughness:.4}), foamP: mat('#f59e0b',{metalness:.4}), hyd: mat('#dc2626',{metalness:.3}),
      foam: mat('#ffffff',{roughness:.9}), foamF: mat('#fef3c7',{emissive:'#fde68a',emissiveIntensity:.5}), fireM: mat('#f97316',{emissive:'#f97316',emissiveIntensity:1}),
      ring15: mat('#dc2626',{transparent:true,opacity:.18,depthWrite:false}), ring75: mat('#16a34a',{transparent:true,opacity:.12,depthWrite:false}),
      spray: mat('#93c5fd',{transparent:true,opacity:.45,depthWrite:false}), drop: mat('#60a5fa',{emissive:'#2563eb',emissiveIntensity:.6}),
      water: mat('#3b82f6',{transparent:true,opacity:.55,depthWrite:false}), conc: mat('#9ca3af',{roughness:1}), valve: mat('#ca8a04',{metalness:.7,roughness:.3}),
      truck: mat('#b91c1c',{roughness:.4}), cab: mat('#e5e7eb'), wheel: mat('#111827'), hose: mat('#f5f5f4'), bld: mat('#e7e2da',{roughness:1}),
    };
    const NE={edges:false, shadow:false}, R=6, TH=10;
    fixed(span(-40,-0.1,-40,40,0,40,M.ground,{edges:false}));
    // 防液堤 20 × 20 m
    [[-10,-10,10,-9.6],[-10,9.6,10,10],[-10,-10,-9.6,10],[9.6,-10,10,10]].forEach(([x0,z0,x1,z1])=>fixed(span(x0,0,z0,x1,1.2,z1,M.dike)));
    const T=new THREE.Mesh(new THREE.CylinderGeometry(R,R,TH,48),M.tank.clone()); T.position.set(0,TH/2,0); T.castShadow=true; fixed(T);
    const C=new THREE.Mesh(new THREE.ConeGeometry(R+0.1,1.2,48),M.roof.clone()); C.position.set(0,TH+0.6,0); fixed(C);
    fixed(label('室外儲槽（第四類）',0,TH+2.6,0,1.5)); fixed(label('防液堤',9.8,2.2,9.8,.8));

    /* ① 泡沫放出口 */
    for(let i=0;i<4;i++){ const a=i*Math.PI/2+Math.PI/4, x=Math.cos(a)*R, z=Math.sin(a)*R;
      add(1, group(pipe([x*1.02,0.5,z*1.02],[x*1.02,TH-0.3,z*1.02],.12,M.foamP), pipe([x*1.02,TH-0.3,z*1.02],[x*0.9,TH-0.6,z*0.9],.2,M.foamP)), {drop:0, delay:i*.12}); }
    add(1, pulse(new THREE.Mesh(new THREE.CylinderGeometry(R-0.3,R-0.3,0.4,40),M.fireM.clone()).translateY(TH-1.2),3), {until:1, drop:0, glow:false});
    add(1, (()=>{ const f=new THREE.Mesh(new THREE.CylinderGeometry(R-0.3,R-0.3,0.5,40),M.foam.clone()); f.position.set(0,TH-0.9,0); return f; })(), {until:1, drop:0, glow:false, delay:.8});
    add(1, label('槽壁頂部：固定式泡沫放出口',0,TH+4,4,2.0,'good'),{until:1, drop:0, glow:false});

    /* ② 補助泡沫消防栓 */
    const r15=new THREE.Mesh(new THREE.RingGeometry(R,R+15,64),M.ring15.clone()); r15.rotation.x=-Math.PI/2; r15.position.y=0.03;
    add(2, r15, {until:2, drop:0, glow:false});
    const HY=[[13,13],[-13,13],[13,-13]];
    HY.forEach(([x,z],i)=>add(2, group(pipe([x,0,z],[x,1,z],.2,M.hyd), pipe([x-0.3,0.8,z],[x+0.3,0.8,z],.08,M.valve)), {drop:.3, delay:i*.1}));
    const r75=new THREE.Mesh(new THREE.CircleGeometry(75*0.35,64),M.ring75.clone()); r75.rotation.x=-Math.PI/2; r75.position.set(13,0.05,13);
    add(2, r75, {until:2, drop:0, glow:false, delay:.3});
    add(2, label('防液堤外・距槽壁 ≥ 15 m',13,3,13,1.7,'good'),{until:2, drop:0, glow:false});
    add(2, label('步行 ≤ 75 m・400 L/min・3.5 kgf/cm²',-6,3,16,2.4),{until:2, drop:0, glow:false, delay:.3});

    /* ③ 連結送液口 */
    add(3, group(span(10.4,0,6.6,11.2,1.1,7.4,M.conc), pipe([11.2,0.7,6.8],[11.6,0.7,6.8],.08,M.valve), pipe([11.2,0.7,7.2],[11.6,0.7,7.2],.08,M.valve), pipe([10.4,0.7,7],[R*0.72,0.7,R*0.72],.1,M.foamP)), {drop:0});
    const TR=group(span(13,0,4,15,1.8,11,M.truck), span(13,0,11,15,2.2,12.6,M.cab));
    [[13,5],[15,5],[13,9],[15,9]].forEach(([x,z])=>{ const w=new THREE.Mesh(new THREE.CylinderGeometry(.45,.45,.3,16),M.wheel.clone()); w.rotation.z=Math.PI/2; w.position.set(x,.45,z); TR.add(w); });
    add(3, TR, {drop:0, delay:.2});
    add(3, pipe([13,0.6,6.5],[11.6,0.7,6.9],.07,M.hose), {drop:0, delay:.4});
    add(3, flow([[13,0.6,6.5],[11.6,0.7,6.9],[10.4,0.7,7],[R*0.72,0.7,R*0.72]],M.foamF,{n:12,r:.1,speed:3}), {until:3, drop:0, glow:false});
    add(3, label('N = A × q ÷ C（C = 800 L/min）',11,3.4,7,2.2,'good'),{until:3, drop:0, glow:false});

    /* ④ 冷卻撒水 */
    const ringPipe=new THREE.Mesh(new THREE.TorusGeometry(R+0.25,0.08,8,64),M.pipe.clone()); ringPipe.rotation.x=Math.PI/2; ringPipe.position.y=TH+0.05;
    add(4, ringPipe, {drop:0});
    const sh=new THREE.Mesh(new THREE.CylinderGeometry(R+0.35,R+0.6,TH,48,1,true),M.spray.clone()); sh.position.y=TH/2;
    add(4, sh, {until:5, drop:0, glow:false, delay:.3});
    for(let i=0;i<8;i++){ const a=i*Math.PI/4; add(4, flow([[Math.cos(a)*(R+0.3),TH,Math.sin(a)*(R+0.3)],[Math.cos(a)*(R+0.45),TH/2,Math.sin(a)*(R+0.45)],[Math.cos(a)*(R+0.6),0.1,Math.sin(a)*(R+0.6)]],M.drop,{n:6,r:.07,speed:2}), {until:5, drop:0, glow:false, delay:.3}); }
    add(4, label('槽壁每 m² ≥ 2 L/min・孔徑 ≥ 4 mm',0,TH+4.2,R,2.4,'good'),{until:4, drop:0, glow:false});
    add(4, label('閃火點 ≤ 70°C 第四類・顯著滅火困難',0,TH+3,R,2.4),{until:4, drop:0, glow:false, delay:.3});

    /* ⑤ 水源與選擇閥 */
    add(5, group(span(12,0,-12,20,0.3,-4,M.conc), span(12.4,0.3,-11.6,19.6,3.6,-4.4,M.water,NE)), {drop:0});
    add(5, group(pipe([12,0.5,-8],[10.6,0.5,-8],.12,M.pipe), pipe([10.6,0.5,-8],[10.6,1.2,-8],.12,M.pipe), pipe([10.3,1.2,-8],[10.9,1.2,-8],.14,M.valve), pipe([10.6,1.2,-8],[6.3,TH,-2],.08,M.pipe)), {drop:0, delay:.2});
    add(5, label('最大一座儲槽連續放水 4 小時',16,5.4,-8,2.0,'good'),{until:5, drop:0, glow:false});
    add(5, dim([11.2,0,-7.6],[11.2,1.2,-7.6],'選擇閥：堤外・0.8～1.5 m',{w:1.8, off:[1.4,.6,0]}),{until:5, drop:0, glow:false, delay:.3});

    /* ⑥ 第四編加嚴 */
    add(6, group(span(-22,0,-6,-14,5,6,M.bld)), {drop:0});
    add(6, label('室內栓：3.5 kgf・260 L・5 支 × 30 分',-18,8.6,0,2.4,'good'),{until:6, drop:0, glow:false});
    add(6, label('室外栓：3.5 kgf・450 L・4 支 × 30 分',-18,7.4,0,2.4),{until:6, drop:0, glow:false, delay:.2});
    add(6, label('緊急電源 45 分鐘',-18,6.2,0,1.3,'bad'),{until:6, drop:0, glow:false, delay:.4});
  },
});
</script>
