<script type="module">
import { createAnim } from './engine.js?v=2026111903';

createAnim({
  title: '瓦斯漏氣檢知器：比重決定裝哪裡',
  page: '18-%E7%B7%8A%E6%80%A5%E5%BB%A3%E6%92%AD%E8%88%87%E7%93%A6%E6%96%AF%E6%BC%8F%E6%B0%A3-%E5%9C%96%E8%A7%A3.html',
  kind: 'notes',
  steps: [
    {t:'兩間廚房：天然氣 vs 液化石油氣', d:'左邊廚房用天然氣，右邊用桶裝液化石油氣。瓦斯比空氣輕還是重，決定檢知器裝在上面還是下面。', tip:'§141：比重（對空氣）是唯一分水嶺——< 1 往上飄、> 1 往下沉。'},
    {t:'天然氣（比重 < 1）往上飄', d:'天然氣洩漏後上升聚積在天花板下方。', tip:'天然氣主成分甲烷，比空氣輕。'},
    {t:'檢知器：8 m 內、下端在天花板下 30 cm 內', d:'檢知器距瓦斯燃燒器具或導管貫穿牆壁處水平距離 8 m 以內，下端裝在天花板下方 30 cm 範圍內。', tip:'§141。天花板附近有吸氣口時，設在吸氣口 1.5 m 範圍內；有淨高 60 cm 以上的樑時，設在靠燃燒器具這一側。'},
    {t:'液化石油氣（比重 > 1）往下沉', d:'液化石油氣洩漏後沉積在地板附近，不易散去。', tip:'液化石油氣主成分丙烷、丁烷，比空氣重。'},
    {t:'檢知器：4 m 內、上端在樓地板上 30 cm 內', d:'檢知器距燃燒器具或導管貫穿牆壁處水平距離 4 m 以內，上端裝在距樓地板面 30 cm 範圍內。', tip:'§141。記法：輕的 8 m／天花板；重的 4 m／地板。重的跑不遠，所以距離只有一半。'},
    {t:'警報：檢知區域 1 m 處 ≥ 70 dB', d:'檢知器動作後，受信總機顯示警報分區，檢知區域警報裝置鳴動，瓦斯漏氣表示燈亮起。', tip:'§143：檢知區域警報裝置距 1 m 處 70 dB 以上；瓦斯漏氣表示燈距樓地板面 4.5 m 以下。'},
    {t:'緊急電源：蓄電池 10 分鐘', d:'蓄電池設備能使二回路有效動作 10 分鐘以上，其他回路能監視 10 分鐘以上。', tip:'§145。與火警自動警報同為 10 分鐘。'},
  ],
  groundY: -0.01, minDist: 2, sun:[5,12,9],
  views: {
    def:{dir:[0.3,0.4,0.87], dist:16, target:[0,1.4,0]},
    1:{dir:[0.35,0.2,0.92], dist:9, target:[-3.5,1.6,0]},
    2:{dir:[0.35,0.15,0.92], dist:7, target:[-3,2.2,-1]},
    3:{dir:[0.35,0.2,0.92], dist:9, target:[3.5,1.2,0]},
    4:{dir:[0.35,0.15,0.92], dist:7, target:[3.5,0.6,-1]},
    5:{dir:[0.3,0.3,0.9], dist:13, target:[0,1.6,0]},
  },
  build({THREE, mat, span, pipe, group, label, add, fixed, plate, dim, flow, pulse}) {
    const M = {
      floor: mat('#d6d0c7',{roughness:1}), wall: mat('#e7e2da',{roughness:1}), ceil: mat('#f8fafc',{transparent:true,opacity:.3,depthWrite:false}),
      stove: mat('#6b7280'), top: mat('#1f2937'), pipe: mat('#ca8a04',{metalness:.6,roughness:.3}), tank: mat('#9ca3af',{metalness:.5}),
      det: mat('#f8fafc'), led: mat('#ef4444',{emissive:'#ef4444',emissiveIntensity:1.2}),
      ng: mat('#a3e635',{transparent:true,opacity:.55,depthWrite:false}), lpg: mat('#c084fc',{transparent:true,opacity:.6,depthWrite:false}),
      layerN: mat('#a3e635',{transparent:true,opacity:.25,depthWrite:false}), layerL: mat('#c084fc',{transparent:true,opacity:.3,depthWrite:false}),
      bell: mat('#facc15',{emissive:'#facc15',emissiveIntensity:1}), panel: mat('#e5e7eb'),
    };
    const NE={edges:false, shadow:false}, H=3;
    fixed(span(-7,-0.1,-2.5,7,0,2.5,M.floor));
    fixed(span(-7,0,-2.65,7,H,-2.5,M.wall)); fixed(span(-0.08,0,-2.5,0.08,H,2.5,M.wall));
    fixed(span(-7,H,-2.5,7,H+0.08,2.5,M.ceil,NE));
    fixed(label('天然氣廚房',-3.5,H+0.8,0,1.1)); fixed(label('液化石油氣廚房',3.5,H+0.8,0,1.3));
    const range=(x)=>group(span(x-0.9,0,-2.5,x+0.9,0.85,-1.8,M.stove), span(x-0.8,0.85,-2.4,x+0.8,0.9,-1.9,M.top));
    fixed(range(-5.2)); fixed(range(5.2));
    fixed(pipe([-5.2,0.5,-2.5],[-6.99,0.5,-2.5],.04,M.pipe));
    fixed(group(pipe([6.5,0,-1.2],[6.5,1.2,-1.2],.25,M.tank), pipe([6.5,0.6,-1.2],[6.1,0.6,-2.0],.025,M.pipe)));

    /* ① 天然氣上飄 */
    add(1, flow([[-5.2,0.9,-2.1],[-4.6,1.8,-1.8],[-4,2.6,-1.2],[-3,H-0.15,-0.5]],M.ng,{n:14,r:.16,speed:.9}), {until:2, drop:0, glow:false});
    add(1, span(-7,H-0.45,-2.5,-0.1,H-0.01,2.5,M.layerN,NE), {until:2, drop:0, glow:false, delay:.3});
    add(1, label('比重 < 1：聚積在天花板下',-3.5,1.0,1.5,1.6,'bad'),{until:1, drop:0, glow:false});

    /* ② 天然氣檢知器 */
    const DN=[-2.2,H-0.18,-2.45];
    add(2, group(span(DN[0]-0.12,H-0.28,-2.5,DN[0]+0.12,H-0.08,-2.42,M.det)), {drop:0});
    add(2, dim([-5.2,H-0.6,-2.3],[-2.2,H-0.6,-2.3],'水平距離 ≤ 8 m',{w:1.1, off:[0,-.35,0]}), {until:2, drop:0, glow:false});
    add(2, dim([-1.8,H,-2.4],[-1.8,H-0.3,-2.4],'下端在天花板下 30 cm 內',{w:1.6, off:[.9,0,0]}), {until:2, drop:0, glow:false, delay:.3});

    /* ③ 液化石油氣下沉 */
    add(3, flow([[6.2,0.7,-1.9],[5.6,0.35,-1.4],[4.6,0.12,-0.6],[3,0.08,0.4],[1.5,0.08,1]],M.lpg,{n:14,r:.16,speed:.9}), {until:4, drop:0, glow:false});
    add(3, span(0.1,0.01,-2.5,7,0.4,2.5,M.layerL,NE), {until:4, drop:0, glow:false, delay:.3});
    add(3, label('比重 > 1：沉積在地板附近',3.5,1.8,1.5,1.6,'bad'),{until:3, drop:0, glow:false});

    /* ④ LPG 檢知器 */
    const DL=[3.2,0.2,-2.45];
    add(4, group(span(DL[0]-0.12,0.08,-2.5,DL[0]+0.12,0.28,-2.42,M.det)), {drop:0});
    add(4, dim([6.1,0.55,-2.3],[3.2,0.55,-2.3],'水平距離 ≤ 4 m',{w:1.1, off:[0,.4,0]}), {until:4, drop:0, glow:false});
    add(4, dim([2.8,0,-2.4],[2.8,0.3,-2.4],'上端在樓地板上 30 cm 內',{w:1.6, off:[-.9,.3,0]}), {until:4, drop:0, glow:false, delay:.3});

    /* ⑤ 警報 */
    [DN,[DL[0],0.3,DL[2]]].forEach((p,i)=>{ const l=new THREE.Mesh(new THREE.SphereGeometry(.06,10,8),M.led.clone()); l.position.set(p[0],p[1],-2.38); add(5,pulse(l,3),{until:5,drop:0,glow:false}); });
    [-2,2].forEach(x=>{ const b=new THREE.Mesh(new THREE.SphereGeometry(.16,14,10),M.bell.clone()); b.position.set(x,2.2,-2.4); add(5,pulse(b,5),{until:5,drop:0,glow:false}); });
    add(5, label('檢知區域警報：1 m 處 ≥ 70 dB',0,H+1.6,0.5,1.9,'bad'),{until:5, drop:0, glow:false});
    add(5, label('瓦斯漏氣表示燈 ≤ 4.5 m',0,H+0.9,0.5,1.5),{until:5, drop:0, glow:false, delay:.3});

    /* ⑥ 緊急電源 */
    add(6, group(span(-0.6,0,-2.5,0.6,1.2,-2.1,M.panel)), {drop:.3});
    add(6, label('蓄電池：二回路動作 10 分・其他監視 10 分',0,2.0,-1.6,2.4,'good'),{until:6, drop:0, glow:false});
  },
});
</script>
