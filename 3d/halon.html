<body>
<script type="module">
import { createAnim } from './engine.js?v=2026111905';

createAnim({
  title: '鹵化烴滅火設備（海龍替代品）',
  page: '08-%E9%B9%B5%E5%8C%96%E7%83%B4%E8%A8%AD%E5%82%99-%E5%9C%96%E8%A7%A3.html',
  steps: [
    {t:'電腦機房：化學抑制、濃度低', d:'鹵化烴是海龍的替代品，靠化學抑制打斷燃燒連鎖反應，設計濃度約 10% 上下，對人相對安全，常用於電腦機房、電信機房。', tip:'§97-1～§97-10。海龍因破壞臭氧層被蒙特婁議定書禁用。'},
    {t:'三種藥劑、限全區放射', d:'藥劑只有 HFC-23、HFC-227ea、FK-5-1-12 三種，放射方式以全區放射為限。', tip:'§97-1。二氧化碳、乾粉有全區／局部／移動三種；鹵化烴與惰性氣體只有全區。'},
    {t:'常時有人：濃度上限 30／10.5／10%', d:'常時有人之場所，最高設計濃度：HFC-23 30%、HFC-227ea 10.5%、FK-5-1-12 10%。', tip:'§97-2（安全係數準用 §83-1）。惰性氣體常時有人上限是 52%，不可互相套用。'},
    {t:'藥劑量 W = (V/S) × C/(100−C)', d:'W 藥劑量（kg）、V 防護空間淨體積（m³）、S 最低溫度下的比容積（m³/kg）、C 設計濃度（%）。同一建築物有兩個以上防護區域時取最大量。', tip:'§97-3。記法：鹵化烴用分式，惰性氣體用對數。'},
    {t:'啟動・警報・排放準用二氧化碳', d:'選擇閥、啟動裝置、音響警報裝置、安全裝置及排放裝置，準用二氧化碳的規定；使用氣體啟動者準用 §88。', tip:'§97-7：準用 §90～§92、§93 第 2 項、§94；緊急電源準用 §95（§97-8），1 小時以上。'},
    {t:'10 秒內放射 95% 以上', d:'噴頭放射壓力：HFC-23 9 kgf/cm² 以上；HFC-227ea、FK-5-1-12 3 kgf/cm² 以上；並應於 10 秒內放射 95% 以上。', tip:'§97-4。全法最快：靠化學抑制，要在火勢成長前瞬間建立設計濃度。'},
    {t:'儲存容器：充填比與蓄壓', d:'充填比：HFC-23 0.5～1.5；HFC-227ea、FK-5-1-12 0.5～1.6。蓄壓式以氮氣加壓至 25 kgf/cm² 以上；最低與最高配管落差 50 m 以下。', tip:'§97-5、§97-6。HFC-23 的鋼管要 Sch 80 以上，另外兩種 Sch 40 以上。'},
    {t:'竣工：完整性測試 10 分鐘 ≥ 85%', d:'防護區域竣工時做完整性測試，10 分鐘內的氣體洩漏量能使藥劑維持在設計濃度 85% 以上為合格。', tip:'§97-9。開口、管線貫穿處、天花板上方都可能漏，測試不合格要找出洩漏點補強。'},
  ],
  groundY: -0.01, minDist: 2, sun:[6,14,9],
  views: {
    def:{dir:[0.5,0.5,0.71], dist:16, target:[1,1.2,0]},
    2:{dir:[0.4,0.4,0.82], dist:12, target:[-0.5,1.4,0]},
    3:{dir:[0.4,0.45,0.8], dist:12, target:[-0.5,1.6,0]},
    4:{dir:[0.6,0.3,0.74], dist:10, target:[3,1.4,0.5]},
    5:{dir:[0.45,0.35,0.82], dist:12, target:[0,1.5,0]},
    6:{dir:[0.6,0.3,0.74], dist:7, target:[5.4,1,-1]},
    7:{dir:[0.45,0.45,0.77], dist:14, target:[0,1.5,0]},
  },
  build({THREE, mat, span, pipe, group, label, add, fixed, plate, dim, flow, pulse}) {
    const M = {
      floor: mat('#cbd5e1',{roughness:1}), wall: mat('#e7e2da',{roughness:1}), glass: mat('#cbd5e1',{transparent:true,opacity:.25,depthWrite:false}),
      rack: mat('#1f2937',{metalness:.4}), led: mat('#22c55e',{emissive:'#22c55e',emissiveIntensity:1}), cyl: mat('#dc2626',{metalness:.4,roughness:.35}),
      pipe: mat('#a16207',{metalness:.5,roughness:.4}), red: mat('#c81e1e'), spk: mat('#facc15',{emissive:'#facc15',emissiveIntensity:1}),
      agent: mat('#c4b5fd',{emissive:'#8b5cf6',emissiveIntensity:.4}), cloud: mat('#ddd6fe',{transparent:true,opacity:.35,depthWrite:false}),
      leak: mat('#f97316',{emissive:'#f97316',emissiveIntensity:1}), fireM: mat('#f97316',{emissive:'#f97316',emissiveIntensity:1}),
      gauge: mat('#f8fafc'), fan: mat('#475569',{metalness:.5}),
    };
    const NE={edges:false, shadow:false}, H=3.2;
    fixed(span(-4.2,-0.1,-2.6,7.4,0,2.6,M.floor));
    fixed(span(-4.2,0,-2.6,7.4,H,-2.45,M.wall)); fixed(span(-4.35,0,-2.6,-4.2,H,2.6,M.wall));
    fixed(span(3,0,-2.6,3.15,H,0.6,M.wall)); fixed(span(3,2.2,0.6,3.15,H,1.6,M.wall)); fixed(span(3,0,1.6,3.15,H,2.6,M.wall));
    fixed(span(-4.2,H,-2.6,3.15,H+0.12,2.6,M.glass,NE));
    for(let i=0;i<4;i++){ const x=-3.6+i*1.3; fixed(group(span(x,0,-2.2,x+0.9,2.1,-1.3,M.rack))); for(let j=0;j<4;j++){ const l=new THREE.Mesh(new THREE.SphereGeometry(.03,8,6),M.led.clone()); l.position.set(x+0.2+j*0.15,1.7,-1.29); fixed(l); } }
    fixed(label('電腦機房（防護區域）',-0.6,H+0.7,0,1.4)); fixed(label('容器室',5.3,H+0.7,0,.8));
    const CY=[[4.6,-2],[5.15,-2],[5.7,-2],[4.6,-1.45],[5.15,-1.45]];
    CY.forEach(([x,z])=>fixed(group(pipe([x,0,z],[x,1.5,z],.22,M.cyl), pipe([x,1.5,z],[x,1.7,z],.06,M.pipe))));
    fixed(pipe([4.4,1.85,-1.7],[6.8,1.85,-1.7],.08,M.pipe)); fixed(pipe([6.8,1.85,-1.7],[6.8,H-0.3,-1.7],.06,M.pipe)); fixed(pipe([6.8,H-0.3,-1.7],[-3,H-0.3,-1.7],.06,M.pipe));
    const NZ=[-2.5,-0.2,2];
    NZ.forEach(x=>fixed(group(pipe([x,H-0.3,-1.7],[x,H-0.3,0.4],.05,M.pipe), pipe([x,H-0.3,0.4],[x,H-0.5,0.4],.07,M.pipe))));

    /* ① 三種藥劑 */
    add(1, label('HFC-23',4.2,2.4,-0.4,.8),{until:3, drop:0, glow:false});
    add(1, label('HFC-227ea',5.2,2.4,-0.4,.9),{until:3, drop:0, glow:false, delay:.15});
    add(1, label('FK-5-1-12',6.2,2.4,-0.4,.9),{until:3, drop:0, glow:false, delay:.3});
    add(1, label('以全區放射為限',-0.5,H+1.6,1,1.2,'good'),{until:1, drop:0, glow:false, delay:.5});

    /* ② 濃度上限 */
    add(2, label('常時有人：HFC-23 ≤ 30%',-0.5,H+2.4,1,1.7),{until:2, drop:0, glow:false});
    add(2, label('HFC-227ea ≤ 10.5%',-0.5,H+1.6,1,1.4),{until:2, drop:0, glow:false, delay:.2});
    add(2, label('FK-5-1-12 ≤ 10%',-0.5,H+0.8,1,1.3),{until:2, drop:0, glow:false, delay:.4});

    /* ③ 藥劑量 */
    add(3, span(-4.2,0.01,-2.45,3,H-0.05,2.6,M.cloud,NE), {until:3, drop:0, glow:false});
    add(3, label('W = (V / S) × C / (100 − C)',-0.5,H+1.6,1,2.0,'good'),{until:3, drop:0, glow:false});
    add(3, label('V：淨體積　S：比容積　C：設計濃度',-0.5,H+0.8,1,2.2),{until:3, drop:0, glow:false, delay:.3});

    /* ④ 啟動警報 */
    add(4, pulse(span(-1.2,1.5,-1.29,-0.6,2.1,-1.2,M.fireM,NE),3), {until:5, drop:0, glow:false});
    add(4, group(span(3.15,0.9,1.8,3.3,1.45,2.25,M.red)), {drop:0});
    const sp=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.08,20),M.spk.clone()); sp.position.set(0.5,H-0.1,1.2);
    add(4, pulse(sp,3), {until:5, drop:0, glow:false});
    add(4, label('啟動・音響警報・排放 → 準用 CO₂ 條文',1.2,H+1.4,1.4,2.4,'good'),{until:4, drop:0, glow:false});
    add(4, label('緊急電源 1 小時（準用 §95）',3.6,2.2,2.6,1.8),{until:4, drop:0, glow:false, delay:.3});

    /* ⑤ 10 秒 95% */
    add(5, flow([[4.6,1.85,-1.7],[6.8,1.85,-1.7],[6.8,H-0.3,-1.7],[-0.2,H-0.3,-1.7],[-0.2,H-0.5,0.4]],M.agent,{n:30,r:.09,speed:6}), {until:5, drop:0, glow:false});
    NZ.forEach((x,i)=>{ const c=new THREE.Mesh(new THREE.ConeGeometry(1.7,H-0.5,24,1,true),M.cloud.clone()); c.position.set(x,(H-0.5)/2,0.4); add(5,c,{until:5,drop:0,glow:false,delay:.1*i}); });
    add(5, label('10 秒內放射 95% 以上',-0.5,H+1.6,1,1.5,'bad'),{until:5, drop:0, glow:false});
    add(5, label('放射壓力 HFC-23 ≥ 9・其他 ≥ 3 kgf/cm²',-0.5,H+0.8,1,2.4),{until:5, drop:0, glow:false, delay:.3});

    /* ⑥ 容器 */
    add(6, group(span(6.1,1.6,-1.6,6.3,1.8,-1.4,M.gauge)), {drop:0});
    add(6, label('充填比 HFC-23 0.5～1.5・其他 0.5～1.6',5.2,3.1,-0.6,2.4,'good'),{until:6, drop:0, glow:false});
    add(6, label('蓄壓：氮氣 ≥ 25 kgf/cm²',5.2,2.3,-0.6,1.6),{until:6, drop:0, glow:false, delay:.3});
    add(6, label('配管落差 ≤ 50 m',5.2,0.6,0.4,1.1),{until:6, drop:0, glow:false, delay:.5});

    /* ⑦ 完整性測試 */
    add(7, span(-4.2,0.01,-2.45,3,H-0.05,2.6,M.cloud,NE), {until:7, drop:0, glow:false});
    add(7, group(span(1.8,0,1.9,2.6,0.9,2.5,M.fan)), {drop:.3});
    [[3.05,2.2,1.1],[-2,H,0.8],[0.5,H,-2.3]].forEach((p,i)=>{ const l=new THREE.Mesh(new THREE.SphereGeometry(.09,10,8),M.leak.clone()); l.position.set(...p); add(7,pulse(l,2),{until:7,drop:0,glow:false,delay:.15*i}); });
    add(7, label('10 分鐘後仍 ≥ 設計濃度 85% → 合格',-0.5,H+1.6,1,2.3,'good'),{until:7, drop:0, glow:false});
    add(7, label('漏點：門縫・天花板・管線貫穿',-0.5,H+0.8,1,1.9,'bad'),{until:7, drop:0, glow:false, delay:.3});
  },
});
</script>
