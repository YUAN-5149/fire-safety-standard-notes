<script type="module">
import { createAnim } from './engine.js?v=2026111905';
import { hazKit } from './haz-kit.js?v=2026112602';

createAnim({
  title: '第四編⑥　可燃性高壓氣體場所（§207、§208、§228～§233）',
  page: '22-%E5%85%AC%E5%85%B1%E5%8D%B1%E9%9A%AA%E7%89%A9%E5%93%81%E5%A0%B4%E6%89%80-%E5%9C%96%E8%A7%A3.html',
  kicker: '各類場所消防安全設備設置標準　第四編　逐條 3D',
  kind: 'notes',
  steps: [
    {t:'可燃性高壓氣體：滅火器＋防護設備', d:'可燃性高壓氣體場所、加氣站、天然氣及可燃性高壓氣體儲槽，重點不是把火撲滅，而是用冷卻撒水與射水設備保護儲槽不被燒到爆裂，再配滅火器處理初期火災。', tip:'防護設備＝冷卻撒水設備、射水設備（§197Ⅱ）。'},
    {t:'§207　應設置滅火器', d:'可燃性高壓氣體製造、儲存或處理場所，以及加氣站、天然氣儲槽、可燃性高壓氣體儲槽，應設置滅火器。', tip:'§207。數量與配置見 §228。'},
    {t:'§208　應設置防護設備的場所', d:'①可燃性高壓氣體製造場所　②儲存可燃性高壓氣體或天然氣之儲槽在 3,000 kg 以上者　③氣槽車之卸收區　④加氣站之加氣車位、儲氣槽人孔、壓縮機、幫浦。已設置水噴霧裝置者得免設。', tip:'§208。例：10 m³ 儲槽、液化石油氣比重 0.5 → 5,000 kg ≥ 3,000 kg，應設防護設備。'},
    {t:'§228　滅火器的數量與配置', d:'製造、儲存或處理場所設 2 具，200 m² 以上每 50 m²（含未滿）增設 1 具；儲槽 3 具以上。加氣站：儲氣槽區 4 具以上、加氣機每臺 1 具以上、用火設備處所 1 具以上，建築物每層 100 m² 以下 2 具、每增加 100 m² 增 1 具。', tip:'§228④～⑥：儲存場所任一點步行 15 m 以下；屋外者放箱內或防雨；每具對普通火災 4 以上、油類火災 10 以上滅火效能值。'},
    {t:'§229　冷卻撒水設備', d:'撒水噴頭或配管穿孔方式均勻撒水；穿孔孔徑 4 mm 以上。撒水量為防護面積每 m² 每分鐘 5 L 以上；以 25 mm 以上岩棉等隔熱材被覆，外覆 0.35 mm 以上鋅鐵板者，撒水量得減半。水源為連續撒水 30 分鐘。', tip:'§229。構造及手動啟動裝置準用 §216。對照：油槽冷卻撒水是 2 L/min·m²、4 小時（§216）。'},
    {t:'§230　防護面積的計算', d:'儲槽：本體外表面積（圓筒形含端板）＋液面計、閥類露出表面積。其他設備：露出之表面積；製造設備離地面超過 5 m 者，以 5 m 間隔水平切割求露出面積。', tip:'§230③ 加氣站：加氣機每臺 3.5 m²、加氣車位每處 2 m²、儲氣槽人孔每座 3 處共 3 m²、壓縮機每臺 3 m²、幫浦每臺 2 m²、氣槽車卸收區每處 30 m²。'},
    {t:'§231　射水設備的規格', d:'室外消防栓設於屋外並具水帶箱，箱內配置瞄子、開關把手及 63 mm、20 m 水帶 2 條。全部射水設備同時使用時，各放水壓力 3.5 kgf/cm² 以上、放水量 450 L/min 以上（超過 2 支以 2 支計）；水源為 2 具同時放水 30 分鐘。', tip:'§231。射水設備＝固定式射水槍、移動式射水槍或室外消防栓（§197Ⅱ②）。水源例：2 × 450 × 30 = 27 m³。'},
    {t:'§232　射水設備的位置與數量', d:'設置 2 支以上，設在距防護對象外圍 40 m 以內、能自任何方向對儲槽放射之位置。依儲槽表面積每 50 m²（含未滿）設 1 具；依 §229 但書設隔熱措施者，每 100 m² 1 具。', tip:'§232。例：表面積 230 m² → 5 具；有隔熱 → 3 具。'},
    {t:'§233　射水設備準用第三編', d:'射水設備之配管、試壓、加壓送水裝置及緊急電源，準用第三編室外消防栓 §39 及 §42 之規定。', tip:'§233。'},
  ],
  groundY: -0.01, minDist: 3, sun:[14,26,16], labelMax: 5,
  views: {
    def:{dir:[0.5,0.5,0.7], dist:40, target:[0,3,0]},
    3:{dir:[0.4,0.65,0.65], dist:44, target:[0,1,0]},
    5:{dir:[0.55,0.4,0.73], dist:26, target:[0,3,0]},
    7:{dir:[0.3,0.75,0.6], dist:60, target:[0,2,0]},
  },
  build(k) {
    const H = hazKit(k), {S, L, D, M} = H, {THREE} = k;
    H.ground();
    S(0, H.sphere(0,0,4)); L(0,'冷卻＋射水 保護儲槽',0,12,0,2.4,'good',.2,0);

    /* 1 §207 */
    S(1, H.sphere(-8,0,3),0); S(1, H.canopy(6,0,8,6,4.5),.05); S(1, H.dispenser(6,0),.1);
    S(1, H.ext(-3.5,3),.15); S(1, H.ext(2,3),.15); L(1,'高壓氣體場所、加氣站、儲槽',0,10,0,2.8); L(1,'→ 應設滅火器',0,8.8,0,1.6,'good');

    /* 2 §208 */
    S(2, H.sphere(-10,-4,3),0); L(2,'儲槽 ≥ 3,000 kg',-10,10,-4,1.8,'bad');
    S(2, H.bld(0,-4,7,5,4),.05); L(2,'製造場所',0,6.4,-4,1.2,'bad');
    S(2, H.hTank(-4,7,1,6,1.6),.1); S(2, H.span(-7.6,0,6,-.6,1,8,M.red),.1); S(2, H.pad(-9,5,1,9,M.zoneR),.15); L(2,'槽車卸收區',-4,4.5,7,1.4,'bad');
    S(2, H.canopy(9,5,7,5,4.5),.15); S(2, H.dispenser(9,5),.2); L(2,'加氣站：車位、人孔、壓縮機、幫浦',9,7.6,5,3.2,'bad');
    L(2,'已設水噴霧裝置 → 得免設',0,12,0,2.6,'good');

    /* 3 §228 滅火器數量 */
    S(3, H.bld(-9,-3,10,8,4,{roof:'glass'}),0);
    S(3, H.ext(-12,-3),.1); S(3, H.ext(-11,-3),.1); S(3, H.ext(-7,-3),.15); S(3, H.ext(-6,-3),.15);
    L(3,'2 具；200 m² 以上每 50 m² +1',-9,6.6,-3,2.8);
    S(3, H.sphere(5,-6,2.5),.15); [3,5,7].forEach((x,i)=>S(3, H.ext(x,-2.2),.2+i*.03)); L(3,'儲槽 ≥ 3 具',5,8.6,-6,1.4);
    S(3, H.canopy(4,7,8,5,4),.2); S(3, H.dispenser(2.5,7),.22); S(3, H.dispenser(5.5,7),.22); S(3, H.ext(2.5,8.2),.25); S(3, H.ext(5.5,8.2),.25);
    L(3,'加氣機每臺 ≥ 1 具',4,6.6,7,1.9,'good'); L(3,'步行 ≤ 15 m・A4／B10',-3,2,8,2.4);

    /* 4 §229 冷卻撒水 */
    S(4, H.sphere(0,0,4),0);
    const rp=new THREE.Mesh(new THREE.TorusGeometry(1.5,.07,8,40),M.red.clone()); rp.rotation.x=Math.PI/2; rp.position.y=9.6; S(4,rp,.1);
    S(4, H.pipe([0,0,6],[0,9.6,6],.1,M.red),.1); S(4, H.pipe([0,9.6,6],[0,9.6,1.5],.1,M.red),.1);
    const sh=new THREE.Mesh(new THREE.SphereGeometry(4.35,32,20,0,Math.PI*2,0,Math.PI*.75),M.spray.clone()); sh.position.y=5.4; S(4,sh,.2,{glow:false});
    L(4,'每 m² ≥ 5 L/min',0,12.4,0,1.8,'good'); L(4,'隔熱被覆 → 減半',0,11.2,0,1.8); L(4,'水源 30 分鐘',6,2.4,6,1.5);

    /* 5 §230 防護面積 */
    S(5, H.hTank(-4,0,1.4,7,2),0); S(5, H.pipe([-4,3.4,0],[-4,4.2,0],.15,M.brass),.05);
    L(5,'儲槽：外表面積＋端板',-4,6.2,0,2.2,'good'); L(5,'＋液面計、閥類',-4,5,0,1.6);
    S(5, H.pipe([6,0,0],[6,13,0],.8,M.steel),.1);
    [5,10].forEach((y,i)=>{ const p=new THREE.Mesh(new THREE.PlaneGeometry(4,4),M.zoneR.clone()); p.rotation.x=-Math.PI/2; p.position.set(6,y,0); S(5,p,.15+i*.05,{glow:false}); });
    L(5,'製造設備 > 5 m：每 5 m 切割',6,14.6,0,2.6,'bad');

    /* 6 §231 射水設備 */
    S(6, H.sphere(0,0,3.5),0); S(6, H.hydOut(9,3),.1); S(6, H.span(10,0,2.4,11,1.2,3.6,M.red),.12);
    S(6, H.person(7.5,2.5),.15); S(6, H.flow([[7.5,1.3,2.5],[5,5,1.5],[2.6,5.6,.6]],M.drop,{n:12,r:.14,speed:2}),.2);
    L(6,'3.5 kgf/cm²・450 L/min',8,6.4,3,2.4,'good'); L(6,'63 mm × 20 m 水帶 2 條',8,5.2,3,2.4); L(6,'水源 2 具 × 30 分',8,4,3,1.9);

    /* 7 §232 位置數量 */
    S(7, H.sphere(0,0,4),0); S(7, H.ring(0,0,4,22,M.zoneB),.05); L(7,'防護對象外圍 40 m 以內',0,1.5,-21,2.6);
    [[16,8],[-16,8],[0,-17]].forEach(([x,z],i)=>S(7, H.hydOut(x,z),.1+i*.05));
    L(7,'≥ 2 支・任何方向可放射',0,12,0,2.6,'good'); L(7,'每 50 m² 1 具（隔熱 100 m²）',0,13.4,0,3);

    /* 8 §233 準用 */
    S(8, H.pump(-4,0),0); S(8, H.pipe([-3.4,.65,0],[6,.65,0],.15,M.red),.05); S(8, H.hydOut(6,0),.1);
    L(8,'配管、試壓、加壓送水、電源',0,4,0,2.8); L(8,'準用 §39、§42',0,2.8,0,1.6,'good');
  },
});
</script>
