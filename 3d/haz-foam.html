<script type="module">
import { createAnim } from './engine.js?v=2026111905';
import { hazKit } from './haz-kit.js?v=2026112602';

createAnim({
  title: '第四編④　泡沫滅火設備（§213～§221）',
  page: '04a-%E6%B3%A1%E6%B2%AB%E8%A8%AD%E5%82%99-%E5%9C%96%E8%A7%A3.html',
  kicker: '各類場所消防安全設備設置標準　第四編　逐條 3D',
  kind: 'notes',
  steps: [
    {t:'油槽的主力：泡沫滅火設備', d:'第四類易燃液體儲槽靠泡沫蓋住液面、隔絕空氣。第四編從放出口、補助栓、射水槍、冷卻撒水，一路規定到水源與加壓送水。', tip:'§213～§221。另見 3D「公共危險物品場所：室外儲槽」總覽。'},
    {t:'§213　儲槽固定式泡沫放出口', d:'泡沫放出口依儲槽構造、直徑及物品種類，按表設置種類與數量，以等間隔裝在不因火災或地震損壞的側板外圍上。固定頂儲槽：Ⅰ型、Ⅱ型由上部注入，Ⅲ型、Ⅳ型由槽底注入；外浮頂儲槽：特殊型。', tip:'§213①～③。泡沫水溶液量與放射率依物品閃火點、是否溶於水按表規定；Ⅲ型的適用物品另有表註限制，詳見條文。'},
    {t:'§214　補助泡沫消防栓與連結送液口', d:'補助泡沫消防栓設在防液堤外圍、距槽壁 15 m 以上，至任一泡沫消防栓步行距離 75 m 以下；瞄子放射量 400 L/min 以上、壓力 3.5 kgf/cm² 以上（超過 3 支以 3 支計）。連結送液口數量 N = A × q ÷ C，C 為 800 L/min。', tip:'§214。A：儲槽最大水平斷面積（浮頂可用環狀面積）；q：固定式放出口每 m² 放射量。例：1,200 m² × 4 ÷ 800 = 6 個。'},
    {t:'§215　碼頭、岸壁：泡沫射水槍', d:'閃火點 40°C 以下第四類之顯著滅火困難室外儲槽，設在岸壁、碼頭並連接輸送設備者，加設固定式泡沫射水槍：能防護海面前端 15 m 以內海面，距注入口及附屬處理設備各部分 30 m 以內，2 具以上。', tip:'§215。同時放射時每具泡沫放射量 1,900 L/min 以上，有效水平放射距離 30 m 以上。'},
    {t:'§216　儲槽冷卻撒水設備', d:'閃火點 70°C 以下第四類之顯著滅火困難儲槽，加設冷卻撒水：噴孔孔徑 4 mm 以上，撒水管設在槽壁頂部（有風樑、補強環時下方增設），撒水量每 m² 槽壁 2 L/min 以上，水源為最大一座儲槽連續放水 4 小時。', tip:'§216。選擇閥設防液堤外、操作高度 0.8～1.5 m；送水區域距加壓送水裝置超過 300 m 要設遠隔啟動；啟動後 5 分鐘內有效撒水、距離 500 m 以下；電源容量 ≥ 連續放水時間。'},
    {t:'§217　泡沫噴頭方式', d:'防護對象在噴頭有效範圍內；防護對象表面積（建築物為樓地板面積）每 9 m² 設 1 個泡沫噴頭；每一放射區域 100 m² 以上（未滿以實際面積）。', tip:'§217。對照第三編 §71：停車空間每 9 m² 一個泡沫噴頭；飛機庫泡水噴頭每 8 m²。'},
    {t:'§218　準用第三編泡沫規定', d:'泡沫放出口、放射量、配管、試壓、流水檢知裝置、啟動裝置、一齊開放閥、泡沫原液儲存量、濃度及原液槽，準用第三編 §69、§70、§72～§74、§78、§79、§81；儲槽用放出口依 §213。', tip:'§218。濃度：蛋白質 3% 或 6%、合成界面活性 1% 或 3%、水成膜 3% 或 6%（§79）。'},
    {t:'§219　移動式泡沫滅火設備', d:'泡沫瞄子放射壓力 3.5 kgf/cm² 以上。泡沫消防栓設於室內者準用 §34、§35（如水平距離 25 m）；設於室外者準用 §40 第 1、4 款（如 40 m 以內、5 m 內附水帶箱）。', tip:'§219。第三編移動式（§80）是 100 L/min；第四編的放水量規定在 §220：室內 200、室外 400 L/min。'},
    {t:'§220　泡沫滅火設備的水源', d:'泡沫頭：最大放射區域射水 10 分鐘。移動式：4 具瞄子同時放水 30 分鐘（室內 200 L/min、室外 400 L/min）。泡沫射水槍：2 具連續 30 分鐘。儲槽固定式：放出口水溶液量 × 液面積，加補助泡沫消防栓放射 20 分鐘。', tip:'§220。都要再加計配管內所需水溶液量。例：室外移動式 4 × 400 × 30 = 48 m³。'},
    {t:'§221　加壓送水裝置', d:'重力水箱：落差 H = h1 水帶 + h2 配管 + h3 放射壓力換算水頭。壓力水箱：P = P1 + P2 + P3 落差 + P4 放射壓力。消防幫浦：全揚程 H = h1 + h2 + h3 落差 + h4 放射壓力，應為專用並接緊急電源。', tip:'§221。緊急電源供電容量為所需放射時間之 1.5 倍以上——第四編特有的倍數。'},
  ],
  groundY: -0.01, minDist: 3, sun:[14,26,16], labelMax: 5,
  views: {
    def:{dir:[0.5,0.5,0.7], dist:36, target:[0,3,0]},
    2:{dir:[0.3,0.75,0.6], dist:50, target:[4,0,4]},
    3:{dir:[0.55,0.5,0.66], dist:48, target:[0,1,6]},
    5:{dir:[0.5,0.55,0.67], dist:26, target:[0,2,0]},
    6:{dir:[0.5,0.45,0.74], dist:22, target:[0,1.5,0]},
    9:{dir:[0.5,0.4,0.76], dist:30, target:[0,4,0]},
  },
  build(k) {
    const H = hazKit(k), {S, L, D, M} = H, {THREE} = k;
    H.ground();
    S(0, H.tank(0,0,5,9)); S(0, H.dike(0,0,16,16)); L(0,'泡沫覆蓋液面・隔絕空氣',0,13,0,2.4,'good',.2,0);

    /* 1 §213 放出口型式 */
    S(1, H.tank(-8,0,3.5,8),0); for(let i=0;i<4;i++){ const a=i*Math.PI/2+.6, x=-8+Math.cos(a)*3.6, z=Math.sin(a)*3.6;
      S(1, H.pipe([x,0.4,z],[x,7.7,z],.1,mat(H,'#f59e0b')),.1); S(1, H.pipe([x,7.7,z],[-8+Math.cos(a)*3.1,7.4,Math.sin(a)*3.1],.16,mat(H,'#f59e0b')),.1); }
    L(1,'Ⅰ、Ⅱ 型：上部注入',-8,11,0,2.2,'good'); L(1,'側板外圍等間隔',-8,9.8,0,1.8);
    S(1, H.tank(2,0,3,7),.15); S(1, H.pipe([5.5,.6,0],[2,.6,0],.14,mat(H,'#f59e0b')),.2);
    S(1, H.flow([[2,.6,0],[2,3,0],[2,6.5,0]],M.foamF,{n:10,r:.18,speed:2}),.25); L(1,'Ⅲ、Ⅳ 型：槽底注入',2,9.6,0,2.2,'good');
    S(1, H.tank(10,0,3,7,{roof:'float'}),.2); L(1,'外浮頂：特殊型',10,9.6,0,1.8,'good');

    /* 2 §214 補助栓・送液口 */
    S(2, H.tank(0,0,5,9),0); S(2, H.dike(0,0,16,16),.05);
    S(2, H.ring(0,0,5,20,M.zoneR),.1); L(2,'距槽壁 ≥ 15 m',0,2,-17,1.8,'bad');
    [[16,14],[-16,14],[16,-14]].forEach(([x,z],i)=>S(2, H.hydOut(x,z),.15+i*.05));
    S(2, H.disc(16,14,10,M.zoneG,.06),.2); L(2,'步行 ≤ 75 m・400 L/min',16,3,14,2.4,'good'); L(2,'3.5 kgf/cm²・3 支計',16,1.8,17,2);
    S(2, H.span(9,0,9,9.8,1.1,9.8,M.conc),.25); S(2, H.truck(12,6,Math.PI/2),.3);
    L(2,'送液口 N = A × q ÷ 800',9.4,3.2,9.4,2.6);

    /* 3 §215 碼頭射水槍 */
    S(3, H.pad(-20,8,20,30,M.sea),0); S(3, H.span(-20,0,4,20,1,8,M.conc),.05);
    S(3, H.tank(-6,-6,4,8),.05); S(3, H.pump(0,5),.1); S(3, H.pipe([-6,1,-2],[0,1,5],.15,M.steel),.1);
    S(3, H.pad(-20,8.02,20,23,M.zoneR,.08),.15); L(3,'海面前端 15 m 以內',0,1.5,16,2);
    [[-6,6],[6,6]].forEach(([x,z],i)=>{ S(3, H.pipe([x,1,z],[x,3,z],.18,M.red),.2); S(3, H.pipe([x,3,z],[x+(i?-1:1)*.6,3.5,z+1],.12,M.brass),.2); });
    S(3, H.flow([[-5.4,3.5,7],[-2,6,14],[1,3,20]],M.foamF,{n:12,r:.25,speed:3}),.3);
    L(3,'固定式射水槍 ≥ 2 具',0,6.5,6,2.2,'good'); L(3,'1,900 L/min・射程 ≥ 30 m',0,5.2,6,2.6);

    /* 4 §216 冷卻撒水 */
    S(4, H.tank(0,0,4,9),0); S(4, H.dike(0,0,14,14),.05);
    const rp=new THREE.Mesh(new THREE.TorusGeometry(4.2,.08,8,64),M.red.clone()); rp.rotation.x=Math.PI/2; rp.position.y=9.05; S(4,rp,.1);
    const sh=new THREE.Mesh(new THREE.CylinderGeometry(4.3,4.6,9,48,1,true),M.spray.clone()); sh.position.y=4.5; S(4,sh,.2,{glow:false});
    L(4,'槽壁每 m² ≥ 2 L/min',0,12.4,0,2.2,'good'); L(4,'孔徑 ≥ 4 mm・水源 4 小時',0,11.2,0,2.6);
    S(4, H.pipe([9,0,0],[9,1.2,0],.12,M.red),.25); S(4, H.pipe([8.7,1.2,0],[9.3,1.2,0],.15,M.brass),.25);
    D(4,[9.8,0,0],[9.8,1.2,0],'選擇閥 0.8～1.5 m',1.8,[1.2,.4,0]);

    /* 5 §217 泡沫噴頭 */
    S(5, H.bld(0,0,12,9,4.5,{open:true,roof:'glass'}),0);
    for(let i=-1;i<=2;i++) for(let j=-1;j<=1;j++){ S(5, H.head(i*3-1.5,4.5,j*3),.05); }
    S(5, H.pad(-3,-1.5,0,1.5,M.zoneY),.15); L(5,'每 9 m² 1 個噴頭',-1.5,2,0,1.9,'good');
    S(5, H.pad(-6,-4.5,6,4.5,M.zoneB,.02),.2); L(5,'放射區域 ≥ 100 m²',0,7,0,2);

    /* 6 §218 準用 */
    S(6, H.tank(-3,0,1.2,2.6,{roof:'none'}),0); L(6,'泡沫原液槽',-3,3.8,0,1.4);
    S(6, H.pipe([2,1,0],[-1.8,1,0],.12,M.red),.1); S(6, H.pipe([-1.8,1.6,0],[-1.8,.6,0],.1,M.brass),.15);
    S(6, H.flow([[4,1,0],[0,1,0],[-4,1,0]],M.water,{n:10,r:.1,speed:1.2}),.2);
    L(6,'混合濃度 3%／6%…（§79）',1,3,0,2.6,'good'); L(6,'準用 §69～§81',1,4.2,0,1.8);

    /* 7 §219 移動式 */
    S(7, H.bld(-6,0,9,7,4,{open:true,roof:'glass'}),0); S(7, H.span(-9.5,.6,-3.4,-8.5,1.6,-3.1,M.red),.05); S(7, H.person(-7,-1),.1);
    S(7, H.flow([[-8.8,1.1,-3],[-7,1.2,-1],[-5,1.4,1]],M.foamF,{n:8,r:.15,speed:1.5}),.15);
    L(7,'室內：準用 §34、§35',-6,6.4,0,2.2); L(7,'瞄子 3.5 kgf/cm²',-6,5.2,0,1.8,'bad');
    S(7, H.hydOut(6,0),.2); S(7, H.disc(6,0,6,M.zoneG),.25); L(7,'室外：準用 §40',6,3,0,1.7);

    /* 8 §220 水源 */
    S(8, H.span(-8,0,-3,8,.3,3,M.conc),0); S(8, H.span(-7.6,.3,-2.6,7.6,3.4,2.6,M.water,{edges:false,shadow:false}),.1);
    L(8,'泡沫頭：最大區域 10 分',0,7.6,0,2.4); L(8,'移動式：4 瞄子 × 30 分',0,6.4,0,2.4,'good');
    L(8,'射水槍：2 具 × 30 分',0,5.2,0,2.2); L(8,'儲槽：放出口量＋補助栓 20 分',0,4,0,2.8,'bad');

    /* 9 §221 加壓送水 */
    S(9, H.pump(0,0),0); S(9, H.pipe([.6,.65,0],[6,.65,0],.15,M.red),.05); S(9, H.pipe([6,.65,0],[6,8,0],.15,M.red),.1);
    S(9, H.span(5.4,8,-.6,6.6,8.4,.6,mat(H,'#f59e0b')),.12);
    D(9,[7.5,0,0],[7.5,8,0],'落差 h3',1,[1,0,0]);
    L(9,'H = h1＋h2＋h3＋h4',2,10.6,0,2.4,'good'); L(9,'電源 ≥ 放射時間 1.5 倍',2,9.4,0,2.4,'bad');
  },
});
function mat(H,c){ return H.mat(c); }
</script>
