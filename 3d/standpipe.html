<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>連結送水管：消防車把水送上高樓｜3D 消防設備動畫</title>
<meta name="description" content="§180～§184 連結送水管 3D 互動動畫：消防車接送水口、專用立管 100 mm、第 3 層以上出水口 50 m・雙口 63 mm・0.5～1.5 m、11 層以上水帶箱、高度 60 m 以上濕式＋中繼幫浦 2,400 L/min、送水設計壓力 H = h1+h2+h3+60。">
<link rel="icon" href="../icons/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="theme-color" content="#3b1e1a">
<link rel="stylesheet" href="anim.css?v=2026111903">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import { createAnim } from './engine.js?v=2026111903';

createAnim({
  title: '連結送水管：消防車把水送上高樓',
  page: '10-%E9%80%A3%E7%B5%90%E9%80%81%E6%B0%B4%E7%AE%A1-%E5%9C%96%E8%A7%A3.html',
  note: '樓層高度壓縮示意（24 層）；數字以條文為準。',
  steps: [
    {t:'不是給住戶用，是給消防車用', d:'連結送水管屬「消防搶救上之必要設備」：建築物本身不儲水、不加壓，水由消防車從地面送水口打進來，消防人員在高樓層出水口接水帶滅火。', tip:'§26 應設：5 或 6 層且總樓地板 ≥ 6,000 m²、7 層以上建築物、地下建築物 ≥ 1,000 m²。'},
    {t:'送水口：消防車從地面接管', d:'消防車停靠建築物旁，把水帶接上地面層室外的送水口，加壓送入立管。', tip:'§180④⑤⑥：送水口設於消防車易於接近且無送水障礙處，數量在立管數以上；雙口形 63 mm 陰式快速接頭，距基地地面 0.5～1 m，附近裝逆止閥及止水閥。'},
    {t:'立管：專用、管徑 ≥ 100 mm', d:'連結送水管立管為專用，管徑 100 mm 以上。建築物高度 50 m 以下時，得與室內消防栓共用立管（管徑 ≥ 100 mm、支管 ≥ 65 mm）。', tip:'§181：能承受送水設計壓力 1.5 倍以上水壓並持續 30 分鐘——室內消防栓、撒水是全閉揚程 1.5 倍、2 小時。'},
    {t:'出水口：第 3 層以上、樓梯間 5 m 內', d:'出水口設於地下建築物各層或建築物第 3 層以上各層的樓梯間或緊急昇降機間（含 5 m 內），各層任一點至出水口水平距離 50 m 以下。', tip:'§180：雙口形 63 mm 快速接頭，距樓地板 0.5～1.5 m，裝在 1.6 mm 鋼板箱內；第 10 層以下得用單口形。屋頂設測試用出水口。'},
    {t:'11 層以上：出水口旁設水帶箱', d:'11 層以上各層，於出水口 5 m 範圍內設水帶箱，箱內有直線水霧兩用瞄子 1 具、20 m 水帶 2 條以上，箱面 0.8 m² 以上。', tip:'§182。消防人員扛水帶爬到 11 樓以上太慢，所以高樓層直接備好。'},
    {t:'高度 > 60 m：濕式＋中繼幫浦', d:'建築物高度超過 60 m，消防車壓力不夠，連結送水管應採濕式，並設中繼幫浦接力加壓，出水量 2,400 L/min 以上。', tip:'§183：全揚程 H = h₁ + h₂ + h₃ + 60 m；送水口附近設手動啟動裝置及紅色啟動表示燈（防災中心可遙控且有通話者得免設）。'},
    {t:'送水設計壓力 = h₁ + h₂ + h₃ + 60 m', d:'送水設計壓力為配管摩擦損失＋水帶摩擦損失＋落差＋放水壓力，放水壓力固定以 60 m 計，水帶摩擦損失固定 4 m。', tip:'§184。這個值決定配管等級、耐壓試驗值與中繼幫浦揚程。'},
  ],
  groundY: -0.01, minDist: 2, sun:[10,30,14],
  views: {
    def:{dir:[0.55,0.25,0.8], dist:46, target:[0,13,0]},
    1:{dir:[0.6,0.3,0.74], dist:14, target:[4,1.2,4]},
    2:{dir:[0.55,0.2,0.81], dist:40, target:[0,13,0]},
    3:{dir:[0.45,0.2,0.87], dist:10, target:[2,3.4,0]},
    4:{dir:[0.45,0.2,0.87], dist:9, target:[2,11.2,0]},
    5:{dir:[0.55,0.25,0.8], dist:24, target:[1,16,0]},
    6:{dir:[0.55,0.25,0.8], dist:46, target:[0,13,0]},
  },
  build({THREE, mat, span, pipe, group, label, add, fixed, plate, dim, flow, pulse}) {
    const M = {
      ground: mat('#cbd5c0',{roughness:1}), road: mat('#6b7280',{roughness:1}), slab: mat('#d6d0c7'), wall: mat('#e7e2da',{roughness:1}),
      stair: mat('#cbd5e1',{transparent:true,opacity:.35,depthWrite:false}),
      pipe: mat('#dc2626',{metalness:.4,roughness:.4}), brass: mat('#ca8a04',{metalness:.7,roughness:.3}), box: mat('#dc2626',{roughness:.45}),
      truck: mat('#b91c1c',{roughness:.4}), cab: mat('#e5e7eb'), wheel: mat('#111827'), hose: mat('#f5f5f4'),
      flowM: mat('#60a5fa',{emissive:'#2563eb',emissiveIntensity:.6}), pump: mat('#b91c1c',{metalness:.5}), motor: mat('#475569',{metalness:.5}),
      lamp: mat('#ef4444',{emissive:'#ef4444',emissiveIntensity:1.2}), fireM: mat('#f97316',{emissive:'#f97316',emissiveIntensity:1}),
    };
    const NE={edges:false, shadow:false}, FH=1.1, NF=24;   // 樓高壓縮
    fixed(span(-14,-0.1,-8,14,0,14,M.ground,{edges:false}));
    fixed(span(-14,0.001,6,14,0.02,11,M.road,{edges:false}));
    for(let f=0;f<=NF;f++) fixed(span(-4,f*FH-0.06,-3,4,f*FH,3,M.slab,{edges:f%5===0}));
    fixed(span(-4,0,-3.1,4,NF*FH,-3,M.wall));
    fixed(span(1.2,0,-3,3.6,NF*FH,-0.6,M.stair,NE));
    [1,3,10,11,24].forEach(f=>fixed(label(`${f}F`,-4.8,(f-1)*FH+0.5,3,.6)));
    const RX=2.4, RZ=-1.8;

    /* ① 送水口＋消防車 */
    const T=group(span(1,0,7,7,1.8,9,M.truck), span(7,0,7,8.6,2.2,9,M.cab));
    [[2,7],[2,9],[6,7],[6,9],[7.8,7],[7.8,9]].forEach(([x,z])=>{ const w=new THREE.Mesh(new THREE.CylinderGeometry(.45,.45,.3,16),M.wheel.clone()); w.rotation.x=Math.PI/2; w.position.set(x,.45,z); T.add(w); });
    add(1, T, {drop:0});
    add(1, group(span(3.6,0,2.9,4.4,1.2,3.3,M.wall), pipe([3.8,0.8,3.3],[3.8,0.8,3.6],.08,M.brass), pipe([4.2,0.8,3.3],[4.2,0.8,3.6],.08,M.brass)), {drop:0, delay:.2});
    add(1, group(pipe([3.8,0.8,3.6],[3,0.2,7],.07,M.hose)), {drop:0, delay:.4});
    add(1, label('地面層送水口（雙口 63 mm）',4,2.6,4,1.8,'good'),{until:1, drop:0, glow:false});

    /* ② 立管 */
    add(2, group(pipe([4,0.8,3],[RX,0.8,RZ],.09,M.pipe), pipe([RX,0.8,RZ],[RX,NF*FH+0.6,RZ],.11,M.pipe)), {drop:0});
    add(2, label('專用立管 ≥ 100 mm',RX+2.4,10,RZ+1,1.3,'good'),{until:2, drop:0, glow:false});
    add(2, label('高 ≤ 50 m 得與室內消防栓共用',RX+2.4,8.6,RZ+1,1.9),{until:2, drop:0, glow:false, delay:.3});

    /* ③ 出水口（3F 以上每層） */
    for(let f=3;f<=NF;f++){ const y=(f-1)*FH; add(3, group(span(RX-0.5,y+0.1,RZ-0.6,RX+0.5,y+0.8,RZ-0.35,M.box)), {drop:0, delay:(f-3)*.03}); }
    add(3, label('第 3 層以上各層・樓梯間 5 m 內',RX+2.6,4.6,RZ+2,2.0,'good'),{until:3, drop:0, glow:false});
    add(3, label('雙口 63 mm・距地 0.5～1.5 m',RX+2.6,3.6,RZ+2,1.8),{until:3, drop:0, glow:false, delay:.3});
    add(3, label('各層任一點 ≤ 50 m（10 層以下得單口）',-1.5,1.6,2.6,2.2),{until:3, drop:0, glow:false, delay:.5});

    /* ④ 11 層以上水帶箱 */
    for(let f=11;f<=NF;f++){ const y=(f-1)*FH; add(4, span(RX-1.6,y+0.1,RZ-0.6,RX-0.8,y+0.85,RZ-0.35,M.box), {drop:0, delay:(f-11)*.03}); }
    add(4, label('11 層以上：出水口 5 m 內設水帶箱',RX-1.2,11*FH+1.2,RZ+2,2.2,'good'),{until:4, drop:0, glow:false});
    add(4, label('20 m 水帶 ≥ 2 條・瞄子 1 具・箱面 ≥ 0.8 m²',RX-1.2,10*FH+0.4,RZ+2,2.4),{until:4, drop:0, glow:false, delay:.3});

    /* ⑤ 中繼幫浦 */
    const PY=12*FH;
    add(5, group(pipe([RX-0.4,PY+0.4,RZ+1.2],[RX+0.4,PY+0.4,RZ+1.2],.3,M.pump), pipe([RX+0.4,PY+0.4,RZ+1.2],[RX+1.0,PY+0.4,RZ+1.2],.24,M.motor), pipe([RX,PY+0.4,RZ+1.2],[RX,PY+0.4,RZ],.08,M.pipe)), {drop:.3});
    add(5, label('> 60 m：濕式＋中繼幫浦',RX+3,PY+1.8,RZ+2,1.7,'bad'),{until:5, drop:0, glow:false});
    add(5, label('出水量 ≥ 2,400 L/min・H = h₁+h₂+h₃+60',RX+3,PY+0.6,RZ+2,2.4,'good'),{until:5, drop:0, glow:false, delay:.3});
    add(5, pulse(new THREE.Mesh(new THREE.SphereGeometry(.15,12,10),M.lamp.clone()).translateX(4.5).translateY(1.5).translateZ(3.4),1.5), {until:5, drop:0, glow:false});
    add(5, label('送水口旁：手動啟動＋紅色表示燈',5.5,3.2,4.2,2.0),{until:5, drop:0, glow:false, delay:.5});

    /* ⑥ 送水 */
    const FY=20*FH;
    add(6, flow([[3,0.5,7],[3.8,0.8,3.6],[4,0.8,3],[RX,0.8,RZ],[RX,FY+0.5,RZ],[RX-0.5,FY+0.5,RZ+0.4],[-2,FY+0.3,1.5]],M.flowM,{n:44,r:.13,speed:8}), {until:6, drop:0, glow:false});
    add(6, pulse(span(-3.5,FY,0.5,-2.2,FY+0.9,2.2,M.fireM,NE),3), {until:6, drop:0, glow:false});
    add(6, label('送水設計壓力 = h₁ + h₂ + h₃ + 60 m',0,NF*FH+2.6,0,2.4,'good'),{until:6, drop:0, glow:false});
    add(6, label('水帶摩擦損失固定 4 m・試壓 1.5 倍 30 分',0,NF*FH+1.4,0,2.6),{until:6, drop:0, glow:false, delay:.3});
  },
});
</script>
</body>
</html>
