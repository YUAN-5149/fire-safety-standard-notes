<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>消防專用蓄水池｜3D 消防設備動畫</title>
<meta name="description" content="§185～§187 消防專用蓄水池 3D 互動動畫：有效水量每 7,500／12,500 m² 20 m³、水平距離 100 m、消防車 2 m 內、投入孔 60 cm、採水口 100 mm 數量、地面下 4.5 m 有效水量、機械引水出水量與 H = h1+h2+15。">
<link rel="icon" href="../icons/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="theme-color" content="#3b1e1a">
<link rel="stylesheet" href="anim.css?v=2026111905">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import { createAnim } from './engine.js?v=2026111905';

createAnim({
  title: '消防專用蓄水池',
  page: '11-%E6%B6%88%E9%98%B2%E5%B0%88%E7%94%A8%E8%93%84%E6%B0%B4%E6%B1%A0-%E5%9C%96%E8%A7%A3.html',
  steps: [
    {t:'給消防車抽水用的水池', d:'大面積建築物附近的消防栓水量不夠時，消防車直接從消防專用蓄水池抽水。它也是「消防搶救上之必要設備」。', tip:'§27 應設、§185～§187 設置規定。'},
    {t:'有效水量：每 7,500 m² 20 m³', d:'依 §27 第 1、3 款設置者，第一層及第二層樓地板面積合計每 7,500 m²（含未滿）設 20 m³ 以上；依第 2 款設置者，總樓地板面積每 12,500 m² 設 20 m³ 以上。', tip:'§185①。例：1、2 層合計 16,000 m² → 16,000 ÷ 7,500 = 2.13 → 3 × 20 = 60 m³。'},
    {t:'水平距離 ≤ 100 m、單池 ≥ 20 m³', d:'任一消防專用蓄水池至建築物各部分的水平距離在 100 m 以下，且每池有效水量 20 m³ 以上。', tip:'§185②。'},
    {t:'消防車能接近到 2 m 內', d:'蓄水池設在消防車能接近至其 2 m 範圍內、易於抽取處。', tip:'§185③④：進水管投入後要能有效抽取所需水量。'},
    {t:'投入孔：60 cm 以上、附鐵蓋', d:'投入孔為邊長 60 cm 以上正方形或直徑 60 cm 以上圓孔，設鐵蓋保護。水量未滿 80 m³ 設 1 個以上，80 m³ 以上設 2 個以上。', tip:'§185⑤（一）；§187：投入孔標明「消防專用蓄水池」字樣。'},
    {t:'採水口：100 mm、高 0.5～1 m', d:'採水口口徑 100 mm、陽式螺牙，距基地地面 0.5～1 m。水量 20 m³ 以上 1 個；40 m³ 以上未滿 120 m³ 2 個；120 m³ 以上 3 個。', tip:'§185⑤（二）。投入孔與採水口擇一設置；採水口標明「採水口」或「消防專用蓄水池採水口」（§187）。'},
    {t:'有效水量：地面下 4.5 m 內', d:'有效水量是指蓄水池深度在基地地面下 4.5 m 範圍內的水量——太深的水消防車吸不上來。', tip:'§185 第 2 項。但採機械方式引水時不在此限。'},
    {t:'機械引水：加壓送水到採水口', d:'採機械方式引水時，設加壓送水裝置：水量未滿 40 m³ 出水量 1,100 L/min、採水口 1 個；40～120 m³ 2,200 L/min、2 個；120 m³ 以上 3,300 L/min、3 個。', tip:'§186：全揚程 H = h₁ + h₂ + 15 m；採水口附近設啟動裝置及紅色啟動表示燈。'},
  ],
  groundY: -6.1, minDist: 2, maxPolar:.6, sun:[10,20,12],
  views: {
    def:{dir:[0.5,0.45,0.74], dist:42, target:[0,0,4]},
    1:{dir:[0.45,0.45,0.77], dist:30, target:[0,1,0]},
    2:{dir:[0.05,0.97,0.25], dist:60, target:[0,0,6]},
    3:{dir:[0.6,0.4,0.7], dist:16, target:[8,1,12]},
    4:{dir:[0.4,0.6,0.7], dist:7, target:[7,0,10]},
    5:{dir:[0.6,0.25,0.76], dist:7, target:[10.5,0.5,12]},
    6:{dir:[0.9,0.1,0.42], dist:16, target:[8,-2.5,10]},
    7:{dir:[0.6,0.25,0.76], dist:14, target:[9,-1,11]},
  },
  build({THREE, mat, span, pipe, group, label, add, fixed, plate, dim, flow, pulse}) {
    const M = {
      ground: mat('#bbd3a5',{roughness:1}), soil: mat('#a16207',{transparent:true,opacity:.25,depthWrite:false}), road: mat('#6b7280',{roughness:1}),
      bld: mat('#e7e2da',{roughness:1}), roof: mat('#a8a29e'), win: mat('#94a3b8'), conc: mat('#9ca3af',{roughness:1}),
      water: mat('#3b82f6',{transparent:true,opacity:.55,depthWrite:false}), deep: mat('#1e3a8a',{transparent:true,opacity:.5,depthWrite:false}),
      lid: mat('#374151',{metalness:.5}), brass: mat('#ca8a04',{metalness:.7,roughness:.3}), pipe: mat('#dc2626',{metalness:.4}),
      truck: mat('#b91c1c',{roughness:.4}), cab: mat('#e5e7eb'), wheel: mat('#111827'), hose: mat('#f5f5f4'),
      ring: mat('#16a34a',{transparent:true,opacity:.15,depthWrite:false}), near: mat('#fde68a',{transparent:true,opacity:.6,depthWrite:false}),
      flowM: mat('#60a5fa',{emissive:'#2563eb',emissiveIntensity:.6}), pump: mat('#b91c1c',{metalness:.5}), motor: mat('#475569',{metalness:.5}),
      lamp: mat('#ef4444',{emissive:'#ef4444',emissiveIntensity:1.2}),
    };
    const NE={edges:false, shadow:false};
    // 地面挖空蓄水池位置：池 x 5～9, z 8～12, 深 6 m
    fixed(span(-30,-0.1,-20,5,0,30,M.ground,{edges:false})); fixed(span(9,-0.1,-20,30,0,30,M.ground,{edges:false}));
    fixed(span(5,-0.1,-20,9,0,8,M.ground,{edges:false})); fixed(span(5,-0.1,12,9,0,30,M.ground,{edges:false}));
    fixed(span(5,-0.1,8,9,0,12,M.conc));
    fixed(span(4.7,-6,7.7,9.3,-0.1,12.3,M.soil,NE));
    fixed(span(10,0.001,-20,15,0.02,30,M.road,{edges:false}));
    fixed(span(-14,0,-10,4,9,6,M.bld)); fixed(span(-14.2,9,-10.2,4.2,9.3,6.2,M.roof));
    for(let i=-12;i<=2;i+=3.5) [1.5,4.5,7.5].forEach(y=>fixed(span(i-0.8,y,6,i+0.8,y+1.4,6.05,M.win,{edges:false})));

    /* ① 概觀 */
    add(1, span(5.2,-5.8,8.2,8.8,-0.2,11.8,M.water,NE), {drop:0, glow:false});
    add(1, label('消防專用蓄水池（地下）',7,2.2,10,1.7),{until:1, drop:0, glow:false});
    add(1, label('1、2 層合計每 7,500 m² → 20 m³',-5,11,0,2.4,'good'),{until:1, drop:0, glow:false, delay:.3});
    add(1, label('（§27 第 2 款：總樓地板每 12,500 m²）',-5,9.8,0,2.6),{until:1, drop:0, glow:false, delay:.5});

    /* ② 100 m */
    const r=new THREE.Mesh(new THREE.CircleGeometry(100*0.3,64),M.ring.clone()); r.rotation.x=-Math.PI/2; r.position.set(7,0.03,10);
    add(2, r, {until:2, drop:0, glow:false});
    add(2, dim([7,0.3,10],[-14,0.3,-10],'至建築物各部分 ≤ 100 m（示意縮小）',{w:2.2}), {until:2, drop:0, glow:false});
    add(2, label('每池有效水量 ≥ 20 m³',7,4,12,1.5,'good'),{until:2, drop:0, glow:false, delay:.3});

    /* ③ 消防車 2 m */
    const T=group(span(11,0,6,13,1.8,13,M.truck), span(11,0,13,13,2.2,14.6,M.cab));
    [[11,7],[13,7],[11,11],[13,11],[11,13.8],[13,13.8]].forEach(([x,z])=>{ const w=new THREE.Mesh(new THREE.CylinderGeometry(.45,.45,.3,16),M.wheel.clone()); w.rotation.z=Math.PI/2; w.position.set(x,.45,z); T.add(w); });
    add(3, T, {drop:0});
    add(3, span(9,0.02,7,11,0.04,13,M.near,NE), {until:3, drop:0, glow:false});
    add(3, label('消防車能接近至 2 m 範圍內',10,3.2,10,1.8,'good'),{until:3, drop:0, glow:false});

    /* ④ 投入孔 */
    add(4, group(span(6.2,0,9.2,6.9,0.06,9.9,M.lid)), {drop:0});
    const pt=plate('消防專用蓄水池',1.2,0.24,{normal:'y',bg:'#374151'}); pt.position.set(6.55,0.07,10.4); add(4, pt, {drop:0});
    add(4, dim([6.2,0.15,9.1],[6.9,0.15,9.1],'≥ 60 cm',{w:.6, off:[0,.3,0]}),{until:4, drop:0, glow:false});
    add(4, label('未滿 80 m³：1 個以上・80 m³ 以上：2 個以上',6.5,1.5,10,2.5,'good'),{until:4, drop:0, glow:false, delay:.3});
    add(4, group(pipe([12,0.6,9.5],[10,0.3,9.5],.08,M.hose), pipe([10,0.3,9.5],[6.55,0.1,9.55],.08,M.hose), pipe([6.55,0.1,9.55],[6.55,-4.5,9.55],.08,M.hose)), {until:4, drop:0, delay:.5});

    /* ⑤ 採水口 */
    add(5, group(span(8.6,0,11,9.4,1.2,11.6,M.conc), pipe([9.4,0.75,11.3],[9.8,0.75,11.3],.08,M.brass), pipe([9,0,11.3],[9,-5.5,11.3],.08,M.pipe)), {drop:0});
    add(5, dim([10,0,11.8],[10,0.75,11.8],'0.5～1 m',{w:.6, off:[.4,0,0]}),{until:5, drop:0, glow:false});
    add(5, label('採水口 100 mm 陽式螺牙',9.4,2.0,11.6,1.6,'good'),{until:5, drop:0, glow:false, delay:.2});
    add(5, label('20 m³：1 個・40～120：2 個・120 以上：3 個',9.4,2.8,11.6,2.5),{until:5, drop:0, glow:false, delay:.4});

    /* ⑥ 4.5 m */
    add(6, span(5.2,-5.8,8.2,8.8,-4.5,11.8,M.deep,NE), {until:6, drop:0, glow:false});
    add(6, dim([9.5,0,10],[9.5,-4.5,10],'地面下 4.5 m 內才算有效水量',{w:2.0, off:[2.2,0,0]}),{until:6, drop:0, glow:false});
    add(6, label('更深的水消防車吸不上來',7,-5.2,12.5,1.6,'bad'),{until:6, drop:0, glow:false, delay:.3});

    /* ⑦ 機械引水 */
    add(7, group(pipe([6,-5.3,9],[7,-5.3,9],.3,M.pump), pipe([7,-5.3,9],[7.8,-5.3,9],.24,M.motor), pipe([6,-5.3,9],[6,-0.3,8.2],.07,M.pipe)), {drop:.3});
    add(7, flow([[6.5,-5.6,10],[6,-5.3,9],[6,-0.3,8.2],[9,0.75,11.3]],M.flowM,{n:16,r:.08,speed:3}), {until:7, drop:0, glow:false});
    const lp=new THREE.Mesh(new THREE.SphereGeometry(.12,12,10),M.lamp.clone()); lp.position.set(9,1.5,11.3);
    add(7, pulse(lp,1.5), {until:7, drop:0, glow:false});
    add(7, label('H = h₁ + h₂ + 15 m',7,1.6,13,1.4,'good'),{until:7, drop:0, glow:false});
    add(7, label('1,100／2,200／3,300 L/min',7,2.5,13,1.8),{until:7, drop:0, glow:false, delay:.3});
  },
});
</script>
</body>
</html>
